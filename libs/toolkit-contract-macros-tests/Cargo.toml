[package]
name = "cf-gears-toolkit-contract-macros-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "UI tests for toolkit-contract-macros (not published)"
publish = false

[lints]
workspace = true

[dev-dependencies]
# The crates under test
# `grpc-client` is needed for the *guards*, not for a client: the repr guard
# `#[toolkit::grpc_contract]` emits is always-on, while the
# `SecurityContextMarker` impls that satisfy it live behind this feature. So any
# crate compiling a gRPC projection whose methods take a security context needs
# it — which `valid_grpc_projection.rs` never revealed, because that contract
# takes no context at all.
toolkit-contract = { workspace = true, features = ["rest-client", "grpc-client"] }
toolkit-contract-macros = { workspace = true }
# `#[toolkit::provides]`'s generated body names `::toolkit::GearCtx` /
# `::toolkit::ClientHub` / `::toolkit::wiring::*` directly, so exercising it
# end to end (see `tests/provides_transport_shape.rs`) needs the runtime
# crate, not just `toolkit-contract`.
toolkit = { workspace = true }

# Test framework
trybuild = { workspace = true }

# Required by UI test cases
anyhow = { workspace = true }
async-trait = { workspace = true }
# The streaming projections emit `Pin<Box<dyn futures_core::Stream>>`, so a UI
# case that names that type needs the crate in scope.
futures-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
toolkit-security = { workspace = true }
tracing = { workspace = true }
secrecy = { workspace = true }
uuid = { workspace = true }
