[package]
name = "cf-gears-toolkit-taskward"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ToolKit runtime for long-lived background workers: pacing, wakeups, failure policy, bounded shutdown"
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "cf-gears-toolkit"]
categories = ["asynchronous"]
metadata.docs.rs.all-features = true

[lib]
name = "toolkit_taskward"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
criterion = { workspace = true, features = ["html_reports"] }
tracing-subscriber = { workspace = true }

[[bench]]
name = "worker_overhead"
harness = false
