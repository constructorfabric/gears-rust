[package]
name = "cf-gears-toolkit-macros-tests"
version = "0.6.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "UI tests for ToolKit macros (not published)"
publish = false

[lints]
workspace = true

[dev-dependencies]
# The macro crate being tested
toolkit-macros = { workspace = true }

# Test framework
trybuild = { workspace = true }

# Dependencies needed by UI test cases (that import toolkit traits/types)
tokio-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
toolkit = { workspace = true }
# `gts_publication(...)` runtime integration tests.
toolkit-gts = { workspace = true }
# Renamed to exercise a listed SDK crate's real collector across the crate boundary.
renamed_sdk = { package = "cf-gears-toolkit-gts-declarations-fixture", path = "../toolkit-gts-macros/tests/fixtures/declaring-crate" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
gts = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
