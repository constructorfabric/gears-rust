[package]
name = "cf-gears-toolkit-gts-macros"
version = "0.1.6"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ToolKit GTS proc-macros (#[gts_schema] attribute + gts_instance! function-like macro)"
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "cf-gears-toolkit"]
categories = ["development-tools::procedural-macro-helpers"]
metadata.docs.rs.all-features = true

[lib]
proc-macro = true
name = "toolkit_gts_macros"

[lints]
workspace = true

[dependencies]
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
# For the configured GTS_ID_PREFIX used when expanding the `gts_id!("...")`
# marker form inside `type_id = ...` / `id: ...` / `"id": ...` args.
gts-id = { workspace = true }
gts = { workspace = true }

[dev-dependencies]
# Path-only dev dependencies keep the macro -> runtime test cycle out of the
# published manifest. The renamed runtime dependency also exercises macro paths.
gts_kit = { package = "cf-gears-toolkit-gts", path = "../toolkit-gts" }
declarations_fixture = { package = "cf-gears-toolkit-gts-declarations-fixture", path = "tests/fixtures/declaring-crate" }
trybuild = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
