[package]
name = "cf-gears-test-containers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Single source of truth for the database container images used by the workspace integration tests"
# Test-only helper, like `cf-gears-toolkit-macros-tests`. Unpublished crates need
# no `release-plz.toml` entry (see the comment at release-plz.toml:5-9).
publish = false

[lints]
workspace = true

# Regular dependencies, not dev-dependencies: consumers reach `testcontainers`
# and `testcontainers-modules` types through this crate's return types.
[dependencies]
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[dev-dependencies]
temp-env = { workspace = true }
