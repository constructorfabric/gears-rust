[package]
name = "cf-gears-toolkit"
version = "0.12.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core ToolKit library"
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "cf-gears-toolkit"]
categories = ["development-tools"]
metadata.docs.rs.all-features = true

[lib]
name = "toolkit"

[lints]
workspace = true

[features]
# Enable the runner and the runtime integration by default.
default = ["otel", "db"]
coverage_nightly = []
# Use the facade's per-OS policy for TLS and application primitives.
fips = ["toolkit-security/fips", "dep:toolkit-http", "toolkit-http/fips"]

# Database integration (toolkit-db, migrations, DbManager/DbHandle in contexts/runtime)
db = ["dep:toolkit-db", "dep:sea-orm-migration"]

# Concrete Kubernetes TokenReview platform-plane authenticator, auto-wired into
# the OoP bootstrap when `oop_http.internal_auth` is configured (Profile 3).
k8s-auth = ["bootstrap", "dep:toolkit-k8s-auth"]

# Forward toolkit-contract's grpc-client feature so the `contract_support::grpc`
# module re-export is visible to `#[grpc_contract]`-generated code in SDKs that
# depend on `toolkit` but not on `toolkit-contract` directly (see
# `toolkit_contract_macros::support::contract_support_path`). No such SDK exists
# in-tree yet; the feature stays because `grpc-client` pulls tonic +
# toolkit-transport-grpc, and a gRPC projection is the exception, not the norm.
# The REST counterpart is deliberately NOT a feature: gears consume other gears
# over REST as a matter of course, so `discovery` and the proxy-wiring phase are
# unconditional and `toolkit-contract` is depended on with `rest-client` below.
contract-grpc-client = ["toolkit-contract/grpc-client"]

# OpenTelemetry support for distributed tracing
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:opentelemetry-otlp",
    "dep:tonic",
    "toolkit-trace-context/otel",
]

bootstrap = [
    "db",
    "dep:serde-saphyr",
    "cf-gears-system-sdks/directory_grpc",
    "dep:tracing-appender",
    "dep:file-rotate",
    "dep:tracing-log",
    "dep:tracing-subscriber",
    "dep:chrono",
    "dep:url",
    "dep:dsn",
    "dep:supports-color",
    "dep:enable-ansi-support",
    # OoP HTTP server: two-plane auth middleware
    "dep:toolkit-http-middleware",
    # OoP outbound platform-plane credential (InternalAuthInterceptor + SA reader)
    "dep:toolkit-transport-grpc",
    "dep:secrecy",
]

[dependencies]
toolkit-http = { workspace = true, optional = true }
# Project-local crates
toolkit-macros = { workspace = true }
toolkit-canonical-errors = { workspace = true, features = ["axum", "utoipa"] }
toolkit-db = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
toolkit-odata = { workspace = true }
toolkit-sdk = { workspace = true }
cf-gears-system-sdks = { workspace = true, features = ["directory"] }
# `rest-client` is not optional: `discovery` and the runtime proxy-wiring phase
# use `toolkit_contract::runtime::resolving`, which lives behind it.
toolkit-contract = { workspace = true, features = ["rest-client"] }

# Security primitives. Not optional: `toolkit-sdk` and `toolkit-contract`
# already depend on it; operation specs also use its shared `RouteAuth` type.
toolkit-security = { workspace = true }
# OoP HTTP server (bootstrap feature): two-plane auth middleware
toolkit-http-middleware = { workspace = true, optional = true }
# OoP outbound platform-plane credential attachment (bootstrap feature).
toolkit-transport-grpc = { workspace = true, optional = true }
# Wrapping the shared-secret / SA token as a redacting SecretString (bootstrap).
secrecy = { workspace = true, optional = true }
# Concrete K8s TokenReview InternalAuthenticator (k8s-auth feature).
toolkit-k8s-auth = { workspace = true, optional = true }

# Core deps
anyhow = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
tracing = { workspace = true }
figment = { workspace = true }
file-rotate = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
url = { workspace = true, optional = true }
dsn = { workspace = true, optional = true }
toolkit-utils = { workspace = true }
# Shared W3C Trace Context propagation (single source of truth with
# `cf-gears-toolkit-http`). Not optional: `extract_trace_id` uses the parser on
# the always-compiled canonical-error path, independent of the `otel` feature.
toolkit-trace-context = { workspace = true }
rustls = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }

# Router/types used in contracts and runtime
axum = { workspace = true }
http = { workspace = true }

# OpenAPI/serde
utoipa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true, optional = true }

# GTS support
gts = { workspace = true }
toolkit-gts = { workspace = true }

# Performance / lock-free structures
parking_lot = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
# `util` provides `ServiceExt::oneshot`, used by the OoP probe-first serve path
# to delegate to the gear router that is swapped in after `start()`.
tower = { workspace = true, features = ["util"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
urlencoding = { workspace = true }

# OpenTelemetry tracing support (optional) - full implementation
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-log = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
supports-color = { workspace = true, optional = true }
enable-ansi-support = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

# gRPC support only for otel (optional)
tonic = { workspace = true, optional = true }

# Unix-specific dependencies for graceful process termination
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
trybuild = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
serial_test = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite"] }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
