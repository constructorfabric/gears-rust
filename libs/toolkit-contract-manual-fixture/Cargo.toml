[package]
name = "cf-gears-toolkit-contract-manual-fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Fixture SDK for `#[client_manual]` REST methods (ADR-0009); tests only, not published"
publish = false

[lib]
name = "toolkit_contract_manual_fixture"

[features]
# On by default: every suite here exercises the generated clients, and
# trybuild hands the fixture crates exactly the features enabled here.
default = ["rest-client"]
rest-client = [
    "toolkit-contract/rest-client",
    "toolkit-contract/raw-http",
    "dep:toolkit-http",
    "dep:secrecy",
    "dep:futures-util",
]
# Only so `--all-features` builds compile the generated (empty) route
# registration; every method is `#[server_manual]`.
rest-server = ["toolkit-contract/rest-server", "dep:axum"]

# `#[toolkit::contract]` / `#[toolkit::rest_contract]` emit
# `#[::async_trait::async_trait]` and `::secrecy::ExposeSecret`; cargo-shear
# does not see either after `--expand`.
[package.metadata.cargo-shear]
ignored = ["async-trait", "secrecy"]

[lints]
workspace = true

[dependencies]
toolkit.workspace = true
toolkit-contract.workspace = true
toolkit-canonical-errors.workspace = true
toolkit-security.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
futures-core.workspace = true

# Referenced by the generated REST client.
toolkit-http = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
secrecy.workspace = true
futures-util.workspace = true
axum.workspace = true
http-body.workspace = true
uuid = { workspace = true, features = ["v4"] }
trybuild.workspace = true

# The suites exercise the generated clients, which exist only with `rest-client`.
[[test]]
name = "runtime"
required-features = ["rest-client"]

[[test]]
name = "raw"
required-features = ["rest-client"]

[[test]]
name = "ui"
required-features = ["rest-client"]
