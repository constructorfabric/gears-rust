services:
  mock:
    build:
      context: ..
      dockerfile: docker/http-mock.Dockerfile
    ports:
      - "18080:8080"  # Optional host access
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  file-parser-api:
    image: cf-gears-api:e2e
    build:
      context: ../..
      dockerfile: testing/docker/cf-gears.Dockerfile
    ports:
      - "8086:8086"
    extra_hosts:
      # Allow container to access host machine via host.docker.internal
      - "host.docker.internal:host-gateway"
    environment:
      # No external dependencies needed for file-parser gear.
      # bind_addr / enable_docs / cors_enabled come from config/e2e-local.yaml.
      # They used to be overridden here as APP__MODULES__api_gateway__CONFIG__*,
      # which no longer binds: the config root was renamed `modules` -> `gears`,
      # and a dash-named gear cannot be addressed by env var at all (#4115, #4175).
      - RUST_LOG=info
    depends_on:
      mock:
        condition: service_healthy
    # No external dependencies required for file-parser gear
    # (file-parser doesn't need Postgres, MinIO, etc.)
    # Readiness is checked by the Makefile e2e target

