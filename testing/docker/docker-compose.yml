services:
  mock:
    build:
      context: ..
      dockerfile: docker/http-mock.Dockerfile
    ports:
      - "18080:8080"  # Optional host access
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  file-parser-api:
    image: cf-gears-api:e2e
    build:
      context: ../..
      dockerfile: testing/docker/cf-gears.Dockerfile
    ports:
      - "8086:8086"
    extra_hosts:
      # Allow container to access host machine via host.docker.internal
      - "host.docker.internal:host-gateway"
    environment:
      # No external dependencies needed for file-parser gear.
      #
      # Three APP__MODULES__api_gateway__CONFIG__* overrides used to sit here.
      # They bound nothing: the config root was renamed `modules` -> `gears`, so
      # the MODULES branch resolves to no key at all. The gear's dashed name is
      # not the problem - #4142 made APP__GEARS__API_GATEWAY__* remap onto
      # `api-gateway`, and it works in HEAD.
      #
      # Do not "repair" them by renaming the prefix. BIND_ADDR and ENABLE_DOCS
      # would only restate config/e2e-local.yaml:98-99, but CORS_ENABLED was
      # `true` here against `cors_enabled: false` there - so reviving the line
      # would quietly switch CORS on for the whole e2e lane.
      - RUST_LOG=info
    depends_on:
      mock:
        condition: service_healthy
    # No external dependencies required for file-parser gear
    # (file-parser doesn't need Postgres, MinIO, etc.)
    # Readiness is checked by the Makefile e2e target

