suite: resource-group
features:
  - resource-group
  - static-tenants
  - static-authn
  - static-authz
launcher: e2e-launcher
env:
  APP__SERVER__HOME_DIR: "{root}/target/e2e-home-{suite_key}"
clean_home: true
config_gears:
  - resource-group

profiles:
  # AuthZ -> TenantResolver -> ResourceGroup chain. A full-config profile: keep
  # every base gear block, build the shared feature set plus the two chain
  # features, and override only the two plugin priorities that activate the
  # chain. Run via: make e2e-tr-authz
  tr-authz:
    features_file: config/e2e-features.txt
    extra_features:
      - tr-authz
      - tenant-resolver-rg
    default_features: true
    config_gears: ["*"]
    test_path: testing/e2e
    # The seed fixture writes into this home's resource_group.db: a home of
    # its own, apart from the base profile's, started empty each run.
    env:
      APP__SERVER__HOME_DIR: "{root}/target/e2e-home-tr-authz"
      CF_GEARS_HOME: "{root}/target/e2e-home-tr-authz"
    clean_home: true
    pytest_args:
      - -k
      - resource_group
    config_overrides:
      gears:
        tr-authz-plugin:
          config:
            vendor: constructorfabric
            priority: 90
        rg-tr-plugin:
          config:
            vendor: constructorfabric
            priority: 10
            # The suite seeds its root tenants with its own tenant type (E2E
            # may publish only under `x.e2etest`); the resolver must see them.
            tenant_types:
              - gts.cf.core.rg.group.v1~cf.core.rg.tenant.v1~
              - gts.cf.core.rg.group.v1~x.e2etest._.tenant.v1~
