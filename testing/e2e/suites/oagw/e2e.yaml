suite: oagw
features:
  # `oagw` stays listed so `make e2e-local GEAR=oagw` still finds this suite.
  - oagw
  # The cluster gear in process, for the sqlite profile's change log (ADR-0020).
  - oagw-embedded
  - credstore
  - static-credstore
  - static-tenants
  - static-authn
  - static-authz
launcher: e2e-launcher
config_gears:
  - oagw
  - credstore
  - static-credstore-plugin
  - grpc-hub
  # Its block in config/e2e-local.yaml carries the `oagw` profile.
  - cluster
env:
  APP__SERVER__HOME_DIR: "{root}/target/e2e-home-{suite_key}"
# Keep previous seed revisions and OAGW rows out of independent suite runs.
clean_home: true
config_overrides:
  gears:
    types-registry:
      # OAGW still uses the legacy in-memory registry. Its fixtures and catalog
      # will move to database-backed admission with the system gears migration.
      database: null
profiles:
  # OAGW on SQLite instead of in memory, with one upstream and two routes
  # provisioned from the types registry. The section 19 tests run only here,
  # keyed on OAGW_E2E_PROFILE. Run: `make e2e-oagw-sqlite`.
  sqlite:
    config_overrides:
      gears:
        oagw:
          database:
            server: sqlite_users
            file: oagw.db
        types-registry:
          config:
            entities:
              # The IDs and alias are mirrored in test_configuration_storage.py.
              - $id: "gts.cf.core.oagw.upstream.v1~5e0a1900-0000-4000-8000-000000000001"
                alias: "e2e-registry-upstream"
                server:
                  endpoints:
                    - host: "127.0.0.1"
                      port: 19876
                      scheme: "http"
                protocol: "gts.cf.core.oagw.protocol.v1~cf.core.oagw.http.v1"
                tags: ["e2e-registry"]
              # `enabled` and `priority` are left to their defaults.
              - $id: "gts.cf.core.oagw.route.v1~5e0a1900-0000-4000-8000-000000000002"
                upstream_id: "gts.cf.core.oagw.upstream.v1~5e0a1900-0000-4000-8000-000000000001"
                match:
                  http:
                    methods: ["GET"]
                    path: "/v1/models"
                tags: ["e2e-registry"]
              # Names its upstream by bare UUID instead of GTS identifier.
              - $id: "gts.cf.core.oagw.route.v1~5e0a1900-0000-4000-8000-000000000003"
                upstream_id: "5e0a1900-0000-4000-8000-000000000001"
                match:
                  http:
                    methods: ["GET"]
                    path: "/v1/bare-uuid"
    env:
      OAGW_E2E_PROFILE: "sqlite"
      # Where 19.1 reads the stored rows; set it when `home_dir` moves.
      OAGW_E2E_DB: "{root}/target/e2e-home-{suite_key}/oagw/oagw.db"
