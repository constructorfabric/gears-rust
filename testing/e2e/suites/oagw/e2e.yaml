suite: oagw
features:
  # `oagw` stays listed so `make e2e-local GEAR=oagw` still finds this suite.
  - oagw
  # The cluster gear in process, for the sqlite profile's change log (ADR-0020).
  - oagw-embedded
  - credstore
  - static-credstore
  - static-tenants
  - static-authn
  - static-authz
launcher: e2e-launcher
config_gears:
  - oagw
  - credstore
  - static-credstore-plugin
  - grpc-hub
  # Its block in config/e2e-local.yaml carries the `oagw` profile.
  - cluster
env:
  APP__SERVER__HOME_DIR: "{root}/target/e2e-home-{suite_key}"
# Keep previous seed revisions and OAGW rows out of independent suite runs.
clean_home: true
# Keep the base types-registry database: migrated resolvers need its platform
# API for pre-init publication. OAGW's legacy catalogue remains available too.
profiles:
  # OAGW on SQLite instead of in memory, with one upstream and two routes
  # provisioned from the types registry after host startup by the suite fixture.
  # The section 19 tests run only here,
  # keyed on OAGW_E2E_PROFILE. Run: `make e2e-oagw-sqlite`.
  sqlite:
    config_overrides:
      gears:
        oagw:
          database:
            server: sqlite_users
            file: oagw.db
          config:
            registry_provisioning:
              # Fixtures arrive after startup; observe them within the setup
              # budget instead of the production five-minute recheck period.
              recheck_interval: "1s"
    env:
      OAGW_E2E_PROFILE: "sqlite"
      # Where 19.1 reads the stored rows; set it when `home_dir` moves.
      OAGW_E2E_DB: "{root}/target/e2e-home-{suite_key}/oagw/oagw.db"
