suite: settings-service
# The gear calls types-registry during its own init and, with the default
# `secret_storage: required`, refuses to start without the credstore client,
# so the credstore gear rides along with its static plugin; the core gears
# (types-registry, resolvers, static plugins) come from the launcher defaults.
features:
  - settings-service
  - static-credstore
  - static-tenants
  - static-authn
  - static-authz
launcher: e2e-launcher
config_gears:
  - settings-service
  - credstore
  - static-credstore-plugin
