# Updated: 2026-04-16 by Constructor Tech
# Mini-Chat development configuration
#
# Minimal config for developing/testing the mini-chat gear.
# Based on quickstart.yaml but stripped to essentials.
#
# Usage:
#   cargo run --bin cf-gears-server --features mini-chat -- --config config/mini-chat.yaml run

server:
  home_dir: "~/.cf-gears"

database:
  servers:
    sqlite_users:
      engine: "sqlite"
      params:
        WAL: "true"
        synchronous: "NORMAL"
        busy_timeout: "5000"
      pool:
        max_conns: 1  # SQLite is single-writer; >1 causes SQLITE_BUSY_SNAPSHOT (517) under load
        acquire_timeout: "30s"

logging:
  default:
    console_level: info
    file: "logs/cf-gears.log"
    file_level: info
  sqlx:
    console_level: debug
    file: "logs/sql.log"
    file_level: debug
  api-gateway:
    console_level: debug
    file: "logs/api.log"
    file_level: debug
  mini_chat:
    console_level: debug
    file: "logs/mini-chat.log"
    file_level: debug

gears:
  api-gateway:
    config:
      bind_addr: "127.0.0.1:8087"
      prefix_path: "/cf"
      enable_docs: true
      cors_enabled: false
      openapi:
        title: "Mini-Chat Dev API"
        version: "0.1.0"
        description: "Mini-Chat development server"
      defaults:
        body_limit_bytes: 64000000
      auth_disabled: false
      # Throttling zones referenced by the mini-chat create_chat route
      # (ThrottlingSpec in gears/mini-chat/.../api/rest/routes/chats.rs).
      # These must be defined or gateway startup fails validation.
      #
      # The create_chat route binds these zones with dry_run = true, so the
      # gateway observes/logs would-be rejections but never returns 429. The
      # demo values below are therefore safe for the e2e suite (which hammers
      # POST /mini-chat/v1/chats from a single IP) while still exercising the
      # dry-run code path.
      rate_limit_zones:
        rl_mini_chat_chat:
          rate_limit: 10/s
          burst_limit: 10
          response_status_code: 429
          response_retry_after: auto
          key:
            type: ip
          max_keys: 10000
      in_flight_limit_zones:
        ifl_mini_chat_chat:
          in_flight_limit: 100
          backlog_limit: 0
          backlog_timeout: 0s
          response_status_code: 429
          key:
            type: ip
          max_keys: 10000

  service-discovery:
    config: {}

  grpc-hub:
    config:
      listen_addr: "uds:///tmp/cf-gears-grpc"

  authn-resolver:
    config:
      vendor: "constructorfabric"

  authz-resolver:
    config:
      vendor: "constructorfabric"

  static-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      # Three identities for authorization/isolation tests: user A and user B
      # share the default tenant, user C lives in another tenant. The
      # single-tenant resolver treats each tenant as its own root.
      mode: static_tokens
      tokens:
        - token: "mini-chat-e2e"
          identity:
            subject_id: "11111111-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
        - token: "mini-chat-e2e-user-b"
          identity:
            subject_id: "44444444-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
        - token: "mini-chat-e2e-tenant-b"
          identity:
            subject_id: "22222222-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
        # Quota-policy users (test_quota_policy.py): their usage rows are
        # rewritten in the DB, so they are kept apart from user A.
        - token: "mini-chat-e2e-quota-1"
          identity:
            subject_id: "55555555-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
        - token: "mini-chat-e2e-quota-2"
          identity:
            subject_id: "66666666-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
        - token: "mini-chat-e2e-quota-3"
          identity:
            subject_id: "77777777-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
      s2s_credentials:
        - client_id: "mini-chat"
          client_secret: "mini-chat-dev-secret"

  static-authz-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100

  tenant-resolver:
    config:
      vendor: "constructorfabric"

  single-tenant-tr-plugin:
    config: {}

  resource-group:
    database:
      server: "sqlite_users"
      file: "resource_group.db"
    config: {}

  simple-user-settings:
    database:
      server: "sqlite_users"
      file: "settings.db"
    config:
      max_field_length: 100

  oagw:
    config:
      # Upstream read timeout (idle time between reads, also the wait for the
      # response headers). Kept short so the provider_timeout test
      # (test_error_mapping.py, mock `header_delay`) fits the test budget; it
      # must stay above the longest idle gap of a normal mock stream (4 s in
      # the ping test of test_streaming.py).
      proxy_timeout_secs: 8
      allow_http_upstream: false
      ssrf_policy:
        enabled: false # Disabled for e2e tests (mock upstreams use 127.0.0.1)

  file-parser:
    config:
      allowed_local_base_dir: /tmp

  mini-chat:
    database:
      server: "sqlite_users"
      file: "mini_chat.db"
    config:
      # Reduce outbox partitions to limit SQLite write contention in tests.
      # Default (4) spawns too many concurrent writers for a single SQLite file.
      outbox:
        num_partitions: 2
      # Minimum allowed ping interval, so the ping test needs only a short
      # idle phase before the first delta.
      streaming:
        sse_ping_interval_seconds: 5
      # Orphan watchdog: minimum allowed timeout (90s) and frequent scans. No
      # E2E test waits for it (90s does not fit the test budget); orphan
      # handling is unit-tested (E2E-SCENARIOS.md 19-06).
      orphan_watchdog:
        enabled: true
        scan_interval_secs: 2
        timeout_secs: 90
      # Upload reaper: minimum allowed staleness (60s) and frequent scans, so
      # an abandoned upload is failed about a minute after its last update
      # (test_attachments.py TestUploadReaper). The upload's own indexing
      # deadline (25s) keeps a live upload well under 60s.
      upload_reaper:
        enabled: true
        scan_interval_secs: 2
        stale_after_secs: 60
      thread_summary_worker:
        enabled: true
        # A catalog model: the built-in fallback (gpt-4.1-mini) is not in this
        # catalog, so summaries could not be generated with it.
        summary_model_id: "gpt-5-mini"
        compression_threshold_pct: 60
        summary_system_prompt: "You are a conversation summarizer. Given a conversation (and optionally an existing summary), produce a detailed structured summary. Respond with an <analysis> block (your reasoning) followed by a <summary> block (the final summary). Only the <summary> content will be stored. Do not invent information not present in the conversation."
      # S2S credentials for obtaining SecurityContext
      # that will be used for communication with other gears.
      client_credentials:
        client_id: "mini-chat"
        client_secret: "mini-chat-dev-secret"
      # Provider registry. Key = provider_id (matches ModelCatalogEntry.provider_id).
      # `upstream_alias` is optional — defaults to `host` when omitted.
      providers:
        openai:
          kind: openai_responses
          storage_kind: openai
          host: "api.openai.com"
          auth_plugin_type: "gts.cf.core.oagw.auth_plugin.v1~cf.core.oagw.apikey.v1"
          auth_config:
            header: "Authorization"
            prefix: "Bearer "
            secret_ref: "openai-key"

        azure_openai:
          kind: openai_responses
          storage_kind: azure
          host: "genai-openai-dev-swedencentral-main01.openai.azure.com"
          api_path: "/openai/v1/responses"
          api_version: "2025-03-01-preview"
          storage_backend: "azure"
          auth_plugin_type: "gts.cf.core.oagw.auth_plugin.v1~cf.core.oagw.apikey.v1"
          auth_config:
            header: "api-key"
            prefix: ""
            secret_ref: "azure-openai-key"

