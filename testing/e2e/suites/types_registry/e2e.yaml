suite: types-registry
features:
  - static-tenants
  - static-authn
  - static-authz
launcher: e2e-launcher
config_gears: []
env:
  APP__SERVER__HOME_DIR: "{root}/target/e2e-home-{suite_key}"
# Keep old seed revisions and migrations from other branches out of this suite.
clean_home: true
profiles:
  force-disabled:
    config_overrides:
      gears:
        types-registry:
          config:
            allow_compatibility_force: false
    env:
      TYPES_REGISTRY_FORCE_ENABLED_E2E: "0"
