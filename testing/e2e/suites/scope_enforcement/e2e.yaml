# Route-policy / scope-enforcement profile.
#
# Replaces the former standalone `config/e2e-scope-enforcement.yaml`. It overlays
# the shared `config/e2e-local.yaml` with the api-gateway `route_policies` rules
# and a dedicated set of scoped static tokens, so no full config clone is needed.
#
# Gated by E2E_SCOPE_ENFORCEMENT (the suite's conftest skips without it).
# Run via: make e2e-local SUITE=scope-enforcement
suite: scope-enforcement
features_file: config/e2e-features.txt
default_features: true
launcher: e2e-launcher
config_gears: ["*"]
env:
  E2E_SCOPE_ENFORCEMENT: "1"
config_overrides:
  gears:
    api-gateway:
      config:
        route_policies:
          enabled: true
          rules:
            - path: "/users-info/v1/users"
              required_scopes: ["users:read", "users:admin"]
            - path: "/users-info/v1/users/*"
              required_scopes: ["users:read", "users:admin"]
            - path: "/users-info/v1/cities"
              required_scopes: ["cities:admin"]
            - path: "/users-info/v1/cities/*"
              required_scopes: ["cities:admin"]
    static-authn-plugin:
      config:
        vendor: constructorfabric
        priority: 100
        mode: static_tokens
        tokens:
          - token: "token-full-access"
            identity:
              subject_id: "11111111-1111-1111-1111-111111111111"
              subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
              token_scopes: ["*"]
          - token: "token-users-read"
            identity:
              subject_id: "22222222-2222-2222-2222-222222222222"
              subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
              token_scopes: ["users:read"]
          - token: "token-users-admin"
            identity:
              subject_id: "33333333-3333-3333-3333-333333333333"
              subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
              token_scopes: ["users:admin"]
          - token: "token-cities-admin"
            identity:
              subject_id: "44444444-4444-4444-4444-444444444444"
              subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
              token_scopes: ["cities:admin"]
          - token: "token-no-scopes"
            identity:
              subject_id: "55555555-5555-5555-5555-555555555555"
              subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
              token_scopes: ["unrelated:scope"]
