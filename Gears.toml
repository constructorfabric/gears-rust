# Gears manifest. Used by `cargo gears` CLI for linting and other tasks.
# See https://github.com/constructorfabric/cargo-gears for documentation.

[apps.gears-rust.dev]
config = "lint.yml"
gears = []

[apps.gears-rust.dev.lint]
fmt = false       # already handled by `make fmt`
clippy = false    # already handled by `make clippy`

[apps.gears-rust.dev.lint.dylint]
enabled = true
# Remove entries as violations are fixed or cargo-gears-lints is updated.
skip = [
    # is_system_module() in cargo-gears-lints doesn't recognize "gears/system/"
    # path prefix, causing false positives on system gear SDK crates.
    # Tracking: https://github.com/constructorfabric/cargo-gears/issues/84
    "de0504_client_versioning",
    # Path exclusion logic in cargo-gears-lints uses "modules/" prefix but this
    # repo uses "gears/".
    "de1101_tests_in_separate_files", # same tracking issue as above
    # Scope broadened from /contract/ to /domain/ in cargo-gears-lints.
    # Pre-existing code in domain/ layers needs migration.
    # Tracking: https://github.com/constructorfabric/cargo-gears/issues/85
    "de0101_no_serde_in_contract",
    "de0102_no_toschema_in_contract", # same tracking issue as above
    # Both lints key purely off the `*Dto` name suffix (case-insensitive) and
    # assume DTO implies REST: DE0201 requires the type to live in
    # `*/api/rest/*.rs`, DE0204 requires a `ToSchema` derive for OpenAPI.
    # `cluster-sdk`'s `*Dto` types are neither — they are gRPC wire messages,
    # projected into `proto/cluster/**/*.proto` (`message CacheEntryDto`) and
    # pinned by `proto.lock.toml`. They never appear in an OpenAPI document, so
    # `ToSchema` would be dead weight on them, and `api/rest/` would be the
    # wrong home for a type whose only transport is gRPC. Note DE0204 fires
    # here despite its own docs scoping it to `*/api/rest/*.rs`.
    # The lints also flag the prost-generated twins under `target/`, which is
    # build output rather than authored code.
    # Tracking: https://github.com/constructorfabric/cargo-gears/issues/85
    "de0201_dtos_only_in_api_rest",
    "de0204_dtos_must_have_toschema_derive",
]
