[package]
name = "cf-gears-construct-sdk"
version = "0.1.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SDK for the construct gear: client trait, transport-agnostic models and errors"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["web-programming"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "construct_sdk"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `RecordV1::observed_at` (de)serialises as RFC 3339
time = { workspace = true, features = ["serde-well-known"] }
uuid = { workspace = true }

# The connector record types, defined as Rust structs that generate their
# GTS type schemas
gts = { workspace = true }
schemars = { workspace = true }

toolkit = { workspace = true }
toolkit-canonical-errors = { workspace = true }
# `#[gts_type_schema]`, which also registers the record types at link time
toolkit-gts = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }

[dev-dependencies]
graph-storage-sdk = { package = "cf-gears-graph-storage-sdk", path = "../../graph-storage/graph-storage-sdk" }
jsonschema = { workspace = true }
