[package]
name = "cf-gears-construct"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Construct gear: living per-subject profile built from connector records"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["web-programming"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "construct"

[lints]
workspace = true

[dependencies]
construct-sdk = { package = "cf-gears-construct-sdk", version = "0.1.0", path = "../construct-sdk" }

# AuthZ resolver for authorization (PEP flow)
authz-resolver-sdk = { package = "cf-gears-authz-resolver-sdk", version = "0.5.2", path = "../../../gears/system/authz-resolver/authz-resolver-sdk" }
authz-resolver = { workspace = true }

# Tenant settings (the personalization default for new subjects)
settings-service-sdk = { workspace = true }

oagw-sdk = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }

# Record types: the types registry resolves a record's type and base types
types-registry-sdk = { workspace = true }
types-registry = { workspace = true }
jsonschema = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
utoipa = { workspace = true }
axum = { workspace = true, features = ["macros"] }
uuid = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
aws-lc-rs = { workspace = true }
hex = { workspace = true }
time = { workspace = true }
# Database - SeaORM (driver features come from toolkit-db)
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
thiserror = { workspace = true }

toolkit = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite"] }
toolkit-db-macros = { workspace = true }
toolkit-canonical-errors = { workspace = true, features = ["axum"] }
toolkit-security = { workspace = true }
toolkit-macros = { workspace = true }

[dev-dependencies]
types-registry-sdk = { workspace = true, features = ["test-util"] }
toolkit-db = { workspace = true, features = ["sqlite", "test-support"] }
toolkit-gts = { workspace = true }
tower = { workspace = true, features = ["util"] }
proptest = { workspace = true }
tracing-test = { workspace = true }
