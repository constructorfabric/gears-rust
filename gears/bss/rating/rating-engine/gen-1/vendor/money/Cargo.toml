# Engine generation 1's copy of `cf-gears-bss-money` (gears/bss/libs/money), written by hand beside
# the sources `tools/scripts/vendor_engine_generation.py` copies verbatim into `src/` (rating
# ADR-0006). The manifest renames the crate so that it links beside the workspace's own `bss_money`,
# and pins what it computes with: a workspace upgrade must not reach a generation.
[package]
name = "cf-gears-bss-rating-gen1-money"
edition = "2024"
license = "Apache-2.0"
description = "BSS Rating engine generation 1: frozen copy of bss_money (exact fractions, currency specs, canonical decimal text)"
publish = false

[lib]
name = "rating_gen1_money"

[features]
default = []
exact = ["dep:bigdecimal"]
serde = ["dep:serde"]

[dependencies]
rust_decimal = { version = "=1.41.0", features = ["serde"] }
thiserror = "2.0"
bigdecimal = { version = "=0.4.10", optional = true }
serde = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = "1.0"
