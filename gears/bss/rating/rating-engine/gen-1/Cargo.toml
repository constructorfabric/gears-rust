[package]
name = "cf-gears-bss-rating-engine-gen-1"
# Set here, not inherited: the root manifest is outside the frozen tree.
edition = "2024"
license = "Apache-2.0"
description = "BSS Rating engine generation 1: the frozen evaluation semantics, with its own input and output types and vendored evaluation code"

[lib]
name = "bss_rating_engine_gen_1"

[lints]
workspace = true

# Isolation rule (ADR-0006): a generation depends only on its vendored copies, the registry crates of
# the numeric closure pinned in `vendor/LOCK.toml`, and the non-numeric allowlist (serde, uuid, time,
# thiserror). `make check-pure-crates` enforces it from `tools/scripts/pure_crates.toml`, and
# `make check-engine-generations` fails when the workspace resolves the closure differently.
[dependencies]
cf-gears-bss-rating-gen1-money = { path = "vendor/money", features = ["exact"] }
cf-gears-bss-rating-gen1-derived = { path = "vendor/derived" }
# Pinned until the freeze vendors them; `vendor/LOCK.toml` records the checksums.
rust_decimal = { version = "=1.41.0", features = ["serde"] }
bigdecimal = "=0.4.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
time = { version = "0.3.47", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1.23.3", features = ["serde"] }

[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
