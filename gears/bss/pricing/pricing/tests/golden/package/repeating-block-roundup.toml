family     = "package"
id         = "repeating-block-roundup"
kind       = "evaluation"
provenance = ["AC#60 (backup)", "AC#88 (backup)", "PRD §17.2 (backup)"]

# `package` is legal on `usage` rows only (D-386), so `usage` is the only honest
# chargeKind this case can carry - there is no reading of a block-priced row that
# is not metered.
#
# The `meter` is authored. A row that prices in blocks is metered by definition,
# and `api.calls` is what the
# `package` publish case (`supersession-continuity/package-size-change-rejected`)
# prices, so the two `package` rows now name one meter. It reads directly
# against `whole_unit`: a call is counted whole, which is what makes the block
# boundaries below integers rather than a quantization artefact.

[snapshot]
model_kind              = "package"
charge_kind             = "usage"
currency                = "USD"
meter                   = "api.calls"
package_size            = 1000
package_price_minor     = 2500
billing_granularity     = "whole_unit"
tier_aggregation_window = "invoice_period"

[[assert]]
given  = { q = 0 }
expect = { charge_minor = 0 }
why    = "ceil(0/1000) is zero blocks, not one — no usage buys no block"

[[assert]]
given  = { q = 1 }
expect = { charge_minor = 2500 }
why    = "a partial block rounds up to one whole block"

[[assert]]
given  = { q = 1000 }
expect = { charge_minor = 2500 }
why    = "exactly one block; the boundary must not tip into two"

[[assert]]
given  = { q = 1001 }
expect = { charge_minor = 5000 }
why    = "ceil(1.001) is two blocks — a floor reading would halve this charge"

[[assert]]
given  = { q = 2000 }
expect = { charge_minor = 5000 }
why    = "two whole blocks; the second boundary behaves like the first"
