family     = "per-unit"
id         = "external-quantity"
kind       = "evaluation"
provenance = ["AC#60 (backup)", "PRD §17.2 (backup)"]

[snapshot]
model_kind      = "per_unit"
charge_kind     = "recurring"
currency        = "USD"
rate            = "15"
quantity_source = "subscription_seat_count"

[[assert]]
given  = { q = 0 }
expect = { charge = "0" }
why    = "zero seats bills nothing"

[[assert]]
given  = { q = 1 }
expect = { charge = "15" }
why    = "one seat at the unit price"

[[assert]]
given  = { q = 7 }
expect = { charge = "105" }
why    = "unit price × the quantity supplied by quantitySource — never metered usage. The quantity is external (Subscriptions' seat count), which is why it arrives as a runtime given rather than from the snapshot"
