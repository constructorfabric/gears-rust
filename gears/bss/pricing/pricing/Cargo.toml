[package]
name = "cf-gears-bss-pricing"
edition.workspace = true
license.workspace = true
description = "PriceBook pricing gear"

[lib]
name = "bss_pricing"

# `infra/storage/entity.rs` declares every entity module through its
# `entities!` macro (`pub mod $module;`), which cargo-shear cannot follow, so it
# reports the files as unlinked. They are compiled.
[package.metadata.cargo-shear]
ignored-paths = ["src/infra/storage/entity/*.rs"]

[lints]
workspace = true

[features]
test-support = []

[dependencies]
bss-pricing-sdk = { workspace = true }
utoipa = { workspace = true }
toolkit-db-macros = { workspace = true }
rust_decimal = { workspace = true }
toolkit-macros = { workspace = true }
bss-products-sdk = { workspace = true }
bss-approval = { workspace = true }
# D-518: weak ETag and 304 on the plan and book list reads.
bss-rest = { workspace = true }
# D-490: the approvals inbox's source port, which this gear implements over its own doors.
bss-approvals-sdk = { workspace = true }
# D-490: the inbox's votes go through this gear's own vote doors as a request (`oneshot`).
tower = { workspace = true, features = ["util"] }
event-broker-sdk = { workspace = true, features = ["db", "outbox"] }
coord = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
time = { workspace = true, features = ["serde-well-known"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
toolkit = { workspace = true, features = ["db"] }
toolkit-db = { workspace = true, features = ["pg", "sqlite"] }
# The book list pages on the toolkit's OData pager (D-442): its filter and order vocabulary and
# the served `Page` envelope.
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
sea-orm = { workspace = true, features = ["sqlx-postgres", "sqlx-sqlite"] }
sea-orm-migration = { workspace = true }
tokio = { workspace = true, features = ["time", "macros", "rt"] }
tokio-retry = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
arc-swap = { workspace = true }
authz-resolver = { workspace = true }
authz-resolver-sdk = { workspace = true }
types-registry = { workspace = true }
types-registry-sdk = { workspace = true }
toolkit-security = { workspace = true }
toolkit-gts = { workspace = true }
toolkit-canonical-errors = { workspace = true }

[dev-dependencies]
# Integration tests call `plan_item_repo::insert_as_given`. Cargo unifies this edge with the
# library under test, so that function is compiled in for `cargo test` and absent from a
# production build.
bss-pricing = { package = "cf-gears-bss-pricing", path = ".", features = ["test-support"] }
parking_lot = { workspace = true }
proptest = { workspace = true }
# The usage reads prove a fixed statement count with toolkit-db's `QueryRecorder` (D-428).
toolkit-db = { workspace = true, features = ["pg", "sqlite", "test-support"] }
# The events suite decodes the interim envelope with the broker SDK's own decoder
# (`producer::ProducerOutboxEnvelope`), which the `outbox` feature exposes.
event-broker-sdk = { workspace = true, features = ["db", "outbox"] }
# The bound-producer suite (`tests/broker_producer.rs`) drives a real in-process broker: the
# gear's own harness (`test_support::EventBrokerHarness`), which replaced the SDK's mock.
cf-gears-event-broker = { path = "../../../system/event-broker/event-broker", features = ["test-utils"] }
toml = { workspace = true }
# The shipped binary keeps a parsed body's key order (file-parser pulls in `preserve_order`);
# the tests run in that order too, so the key-order digest test can fail (behaviour LOW-4).
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["test-util"] }
testcontainers-modules = { workspace = true }
test-containers = { workspace = true }
tower = { workspace = true }
# A test's `SQLite` file lives in its own temporary directory, removed with the test (the database,
# its `-wal` and its `-shm`); before, every run left its files in the user's temp dir.
tempfile = { workspace = true }
