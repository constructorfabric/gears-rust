family     = "tier-boundary"
id         = "volume-variant-a-cliff"
kind       = "evaluation"
provenance = ["AC#60", "PRD §17.2", "D-17"]

# `volume` is legal on `usage` rows only (`inst-mk-chargekind`, D-18), so `usage`
# is the only honest chargeKind here - and, exactly as in `graduated-band-edge`,
# the row named no `meter`. Same question, same answer, and now closed the same
# way: see that case for the reasoning. The two cases price the same quantity
# over the same bands and differ only in the formula, so they name one meter -
# `api.calls`, counted whole - and the cliff at 1000 is a cliff at 1000 calls.

[snapshot]
model_kind              = "volume"
charge_kind             = "usage"
currency                = "USD"
meter                   = "api.calls"
tier_aggregation_window = "invoice_period"
billing_granularity     = "whole_unit"

  [[snapshot.bands]]
  from_qty = 0
  to_qty   = 1000
  unit_amount_minor = 5

  [[snapshot.bands]]
  from_qty = 1000
  to_qty   = "open"
  unit_amount_minor = 3

[[assert]]
given  = { q = 999 }
expect = { charge_minor = 4995 }
why    = "Variant A selects the band holding q and applies its rate to the whole q"

[[assert]]
given  = { q = 1000 }
expect = { charge_minor = 3000 }
why    = "the cliff: one more unit selects band 2 and the bill drops by 2000. Catalog volume is Variant A only — Variant B (per-tier block fee) was dropped 2026-07-04 and is not authorable"

[[assert]]
given  = { q = 1500 }
expect = { charge_minor = 4500 }
why    = "still band 2's rate applied to the whole quantity, not just the excess"
