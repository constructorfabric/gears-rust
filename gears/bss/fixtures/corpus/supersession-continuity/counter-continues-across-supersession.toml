family     = "supersession-continuity"
id         = "counter-continues-across-supersession"
kind       = "evaluation"
provenance = ["inst-tb-window-continuity", "D-89"]

# The other half of this family: what the successor's bands are applied to.
#
# The tier counter Q is keyed `(subscription, meter, dimensionKey, window)` - it
# belongs to the subscription's usage history, not to a price-row version - and
# the key is phase-blind. Superseding a row does NOT reset an in-window counter,
# and a phase conversion does not either. The successor's bands are simply
# applied to the continued Q.
#
# These are the successor's bands. The quantity is the window total carried
# across the supersession, not usage since it.

[snapshot]
model_kind              = "graduated"
charge_kind             = "usage"
currency                = "USD"
meter                   = "compute.seconds"
billing_granularity     = "per_hour"
tier_aggregation_window = "invoice_period"

  [[snapshot.bands]]
  from_qty = 0
  to_qty   = 1000
  unit_amount_minor = 7

  [[snapshot.bands]]
  from_qty = 1000
  to_qty   = "open"
  unit_amount_minor = 4

[[assert]]
given  = { q = 1500 }
expect = { charge_minor = 9000 }
why    = "1500 is the continued window total: 600 accumulated under the predecessor plus 900 after. 1000 at 7 plus 500 at 4 = 9000. Had the counter reset to 900 the successor's first band would have swallowed it whole at 6300 - a 2700 difference on one row, which is what this case exists to prevent"

[[assert]]
given  = { q = 600 }
expect = { charge_minor = 4200 }
why    = "the pre-supersession accumulation alone, priced under the successor's bands - the predecessor's rates do not survive, only the counter does"
