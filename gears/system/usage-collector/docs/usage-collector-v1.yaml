# Reference contract for the Usage Collector REST surface. The runtime
# OpenAPI document is emitted from `OperationBuilder` calls in
# `gears/system/usage-collector/src/api/rest/routes.rs`; a CI drift-check
# diffs paths, methods, operationIds, tags, parameters, and response
# schemas against this file.
#
# NOTE: this file describes the Phase 2 metering model (registry-owned GTS
# type declarations, declared aggregation folds, invalidation-only
# corrections, interval usage windows, usage feed). The implementation in
# `usage-collector-sdk` and the TimescaleDB plugin still implements the
# superseded model; see DESIGN.md 3.12.2.

openapi: 3.1.0
info:
  title: Usage Collector API
  version: 1.0.0-alpha
  description: |
    Append-only metering ledger. Attributed usage-record ingestion
    (including invalidation entries), raw and aggregated read surfaces, a
    replay-safe usage feed, bulk backfill import, and reconciliation
    metadata.

    All operations require a resolved `SecurityContext` supplied upstream by
    the platform gateway. **No operation modifies an accepted entry** and
    **no operation writes a GTS type declaration** — declaring, amending, and
    withdrawing declarations are `types-registry` surfaces.

servers:
  - url: https://api.example.com
    description: Platform API gateway (deployment-specific).

tags:
  - name: Usage Records
    description: |
      Ingestion of usage records and invalidation entries, raw and
      aggregated reads, and point lookup by record identifier.
  - name: Backfill
    description: |
      Bulk historical import, workload-isolated from live ingestion. Takes
      measurements and invalidation entries alike — the route for any covered
      period the live past tolerance rejects.
  - name: Usage Feed
    description: |
      Replay-safe, snapshot-consistent, cursor-paginated feed for charging
      consumers, scoped by GTS type subscription.
  - name: Reconciliation
    description: Per-scope ingestion counters and watermarks.
security:
  - bearerAuth: []

paths:
  /usage-collector/v1/records:
    post:
      operationId: usage_collector.create_usage_records
      tags: [Usage Records]
      summary: Ingest a batch of usage records or invalidation entries
      description: |
        Submit up to 100 ledger entries. Every entry carries an
        `idempotency_key` and is deduplicated on
        `(tenant_id, gts_type_id, idempotency_key, window_start, window_end)`.

        The presence of `invalidates` is the sole discriminator between an
        ordinary measurement and an invalidation; an entry is never
        identified as a correction by the value or sign of its quantity. An
        invalidation entry is a faithful copy of the record it withdraws,
        carrying additionally its own idempotency key, the target reference,
        and a reason code.

        **The live path bounds the covered period on both sides, for every
        entry it admits.** An entry whose period ends further into the
        future than the configured future tolerance (default 5 minutes) is
        rejected with
        `context.field_violations[N].reason = FUTURE_WINDOW`, and one whose
        period starts further into the past than the configured past
        tolerance (default 48 hours) is rejected with
        `context.field_violations[N].reason = PAST_WINDOW`.
        Each violation names the offending instant and the bound it
        breached. A period older than the past bound is never admitted
        here: the error names
        `POST /usage-collector/v1/records/backfill` as the route that
        accepts it.

        Both bounds govern an invalidation entry too, over the period it
        copies from its target. Withdrawing a record older than the past
        tolerance goes to the backfill route, not to this one.

        An `idempotency_key` or `gts_type_id` carrying a control character
        is rejected before the entry identifier is derived, because that
        derivation concatenates both values under a `0x1F` separator.

        Returns `200` if every entry was accepted or deduplicated, `207
        Multi-Status` if at least one was rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUsageRecordsRequest"
            examples:
              example_usage:
                summary: Ordinary measurement over a covered period
                value:
                  records:
                    - tenant_id: "11111111-1111-1111-1111-111111111111"
                      gts_type_id: gts.cf.core.uc.usage_record.v1~cf.mini_chat._.tokens_consumed.v1~
                      quantity: "42"
                      window_start: "2026-05-29T12:00:00Z"
                      window_end: "2026-05-29T13:00:00Z"
                      idempotency_key: ik-emit-usage-0001
                      resource_ref:
                        resource_id: rsc_compute_vm_001
                        resource_type: compute.vm
              example_point_event:
                summary: Point event (zero-length period)
                value:
                  records:
                    - tenant_id: "11111111-1111-1111-1111-111111111111"
                      gts_type_id: gts.cf.core.uc.usage_record.v1~cf.mini_chat._.requests.v1~
                      quantity: "1"
                      window_start: "2026-05-29T12:00:00Z"
                      window_end: "2026-05-29T12:00:00Z"
                      idempotency_key: ik-emit-point-0001
                      resource_ref:
                        resource_id: rsc_compute_vm_001
                        resource_type: compute.vm
              example_invalidation:
                summary: Invalidation — a faithful copy, quantity echoed not negated
                value:
                  records:
                    - tenant_id: "11111111-1111-1111-1111-111111111111"
                      gts_type_id: gts.cf.core.uc.usage_record.v1~cf.mini_chat._.tokens_consumed.v1~
                      invalidates: "01234567-89ab-cdef-0123-456789abcdef"
                      reason_code: emitter_duplicate
                      quantity: "42"
                      window_start: "2026-05-29T12:00:00Z"
                      window_end: "2026-05-29T13:00:00Z"
                      idempotency_key: ik-invalidate-0001
                      resource_ref:
                        resource_id: rsc_compute_vm_001
                        resource_type: compute.vm
      responses:
        "200":
          description: Every entry accepted or deduplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUsageRecordsResponse"
        "207":
          description: |
            At least one entry rejected. Inspect each per-entry `outcome`
            and `error` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUsageRecordsResponse"
        default:
          $ref: "#/components/responses/Problem"

    get:
      operationId: usage_collector.list_usage_records
      tags: [Usage Records]
      summary: Query raw usage records (cursor-paginated)
      description: |
        Ledger read path over exactly one GTS type within a mandatory time
        range. Returns entries **as persisted**: a withdrawn record and its
        invalidation are both returned, with the linkage in both directions.
        The path applies no fold.

        An entry is selected when the end of its covered period falls in
        the requested range (`from <= window_end < to`), whatever the length
        of that period. Pagination is keyset-stable over `(window_end, id)`.
      parameters:
        - $ref: "#/components/parameters/GtsTypeIdQuery"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of usage records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_UsageRecord"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/records/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    get:
      operationId: usage_collector.get_usage_record
      tags: [Usage Records]
      summary: Point lookup of a single entry by identifier
      description: |
        Returns the exact persisted fact, including the correction linkage
        in both directions. A PDP denial collapses to `404` so this surface
        never acts as an existence oracle.
      responses:
        "200":
          description: The persisted entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageRecord"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/records/aggregate:
    post:
      operationId: usage_collector.query_aggregated_usage_records
      tags: [Usage Records]
      summary: Aggregated usage query over one GTS type
      description: |
        Derived view over the ledger. **The request carries no aggregation
        parameter**: the fold is the one declared by the queried GTS type
        (`SUM`, `COUNT`, `MAX`, `MIN`, or `LATEST`), resolved from its
        declaration.

        A record withdrawn by an accepted invalidation, and the invalidation
        entry itself, each contribute nothing to the selected set. Because
        the invalidation carries the target's covered period, no requested
        range selects one of the pair without the other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregationRequest"
      responses:
        "200":
          description: Aggregated result buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregationResult"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/records/backfill:
    post:
      operationId: usage_collector.backfill_usage_records
      tags: [Backfill]
      summary: Bulk historical import, isolated from live ingestion
      description: |
        Identical validation and request shape to `POST /records`, differing
        only in four respects: the workload is isolated from live ingestion
        so it cannot breach live-path SLOs, every accepted entry is stamped
        `origin: backfill`, the live path's past bound on the covered period
        (default 48 hours) does not apply because this route exists for
        exactly the periods that bound rejects, and submissions whose
        covered period begins further back than the configured backfill
        window (default 90 days) require elevated authorization.

        The route takes measurements and invalidation entries alike, mixed
        in one batch, under the same per-entry rules `POST /records`
        applies. Every accepted entry carries `origin: backfill`, the
        invalidation included, so a correction of closed history reads as
        history. The in-process SDK trait carries the same operation as
        `backfill_usage_records`.

        A deployment must not admit a backfill window wider than the raw
        retention its storage profile guarantees for the target GTS type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUsageRecordsRequest"
      responses:
        "200":
          description: Every entry accepted or deduplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUsageRecordsResponse"
        "207":
          description: At least one entry rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUsageRecordsResponse"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/feed:
    get:
      operationId: usage_collector.read_usage_feed
      tags: [Usage Feed]
      summary: Read a page of the usage feed
      description: |
        Deterministic, replay-safe, pull-based read path for charging
        consumers.

        Ordering is monotonic `acceptance_sequence`, scoped per
        `(tenant_id, gts_type_id)`; no cross-tenant or cross-type total
        order is claimed. Interleaving of scopes within a page is
        implementation-defined but deterministic — the same cursor yields
        the same continuation, extended only by entries accepted since. A
        replay bounded by a previously recorded `watermark` is identical,
        entry for entry.

        A paginated scan does not observe entries appearing, disappearing,
        or changing mid-scan, except append-only arrivals demarcated by the
        `watermark` returned with each page. Corrections arrive as ordinary
        entries at their own acceptance position; an accepted invalidation
        removes neither entry from the feed.

        A cursor older than the retention floor is refused with `400`
        (`context.reason = CURSOR_BEYOND_RETENTION`) rather than served as a
        silently truncated range.
      parameters:
        - name: gts_type_id
          in: query
          required: true
          description: |
            Subscription: the GTS types this consumer reads. Repeat the
            parameter for each type. The feed excludes everything else —
            from the entries, the cursor, and the watermark.
          schema:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
              maxLength: 512
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of feed entries with cursor and watermark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/reconciliation:
    get:
      operationId: usage_collector.get_reconciliation_metadata
      tags: [Reconciliation]
      summary: Per-scope ingestion counters and watermarks
      description: |
        Sufficient for an external reconciliation job to compare gear-side
        accepted totals against a consumer's processed totals for a range
        without a full raw scan, and to detect an emitter that has silently
        stopped.

        **Stall detection is consumer-side.** The gear exposes the
        watermarks and the declared nominal sampling interval; it evaluates
        neither, raises no stalled-emitter signal, and holds no threshold of
        its own.
      parameters:
        - name: scope
          in: query
          required: true
          description: Granularity at which to report.
          schema:
            type: string
            enum: [caller, caller_tenant, tenant_gts_type]
        - name: gts_type_id
          in: query
          required: false
          description: Narrow to one GTS type; required when `scope=tenant_gts_type`.
          schema:
            type: string
            maxLength: 512
        - name: tenant_id
          in: query
          required: false
          description: Narrow to one tenant.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reconciliation metadata for the requested scopes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationMetadataList"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Platform-issued bearer JWT resolved into a `SecurityContext`
        upstream of this gear. Requests without a resolved
        `SecurityContext` fail closed.

  parameters:
    RecordId:
      name: id
      in: path
      required: true
      description: Server-derived entry identifier (RFC 4122 UUID).
      schema:
        type: string
        format: uuid
    GtsTypeIdQuery:
      name: gts_type_id
      in: query
      required: true
      description: |
        The single GTS type to query. Both read paths target exactly one
        type, so returned rows share one unit, one fold, and one declared
        metadata surface.
      schema:
        $ref: "#/components/schemas/GtsTypeId"
    RangeFrom:
      name: from
      in: query
      required: true
      description: |
        Inclusive lower bound of the requested range (UTC, RFC 3339). The
        range is mandatory on every read path.
      schema:
        type: string
        format: date-time
    RangeTo:
      name: to
      in: query
      required: true
      description: Exclusive upper bound of the requested range (UTC, RFC 3339).
      schema:
        type: string
        format: date-time
    Filter:
      name: filter
      in: query
      required: false
      description: |
        OData `$filter` over the fixed field set (`tenant_id`,
        `resource_id`, `resource_type`, `subject_id`, `subject_type`,
        `entry_type`, `origin`, `invalidates`) plus every property the
        queried type's metadata schema declares. Opaque-identifier fields
        and declared metadata properties accept `eq` and `in` only.

        The covered period is **not** filtered here — it is carried by the
        mandatory `from` / `to` parameters, which select on the period end.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Number of items per page (1..1000).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor token. Forward-only; callers MUST NOT parse or modify.
      schema:
        type: string

  responses:
    Problem:
      description: RFC 9457 `application/problem+json` envelope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    EntryType:
      type: string
      enum: [record, invalidation]
      readOnly: true
      description: |
        The closed discriminator between a measurement and a withdrawal,
        **derived** from whether the entry carries `invalidates`. It appears
        on read shapes only; the ingestion shape accepts no discriminator
        field, so a marker can never disagree with the payload it marks.

        An entry is never identified as a correction by the value or sign of
        its quantity: zero and negative quantities are ordinary
        measurements, and an invalidation echoes the quantity it withdraws
        rather than negating it.

    RecordOrigin:
      type: string
      enum: [live, backfill]
      description: |
        Which ingestion path admitted the entry. Server-assigned from the
        path itself, never caller-supplied, and returned on every read path.

    AggregationDimension:
      oneOf:
        - type: string
          enum: [tenant_id, resource_id, resource_type, subject_id, subject_type]
          description: |
            Group by a fixed field. `resource_id` / `resource_type` flatten
            `resource_ref`; `subject_id` / `subject_type` flatten
            `subject_ref` (entries without a subject are excluded from the
            grouping).
        - type: object
          additionalProperties: false
          required: [metadata]
          description: |
            Group by the value of a single declared metadata property. The
            key MUST be a property the queried type's metadata schema
            declares.
          properties:
            metadata:
              type: string
              minLength: 1
      description: |
        Aggregation grouping dimension: either a fixed field emitted as a
        JSON string, or a single-field tagged object `{"metadata": "<key>"}`
        selecting a declared metadata property.

    Timestamp:
      type: string
      format: date-time
      description: |
        UTC instant (RFC 3339). Timestamps carrying no offset are rejected;
        non-UTC offsets are normalized to UTC. A covered-period bound carries
        at most microsecond precision — the record-identity derivation reads a
        fixed-width microsecond form, so a finer value is rejected rather than
        truncated.

    UsageQuantity:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]{1,28})?$'
      example: "42.5"
      description: |
        Finite, signed decimal measurement in the canonical unit bound to
        the entry's GTS type. Wire-encoded as a JSON **string**, never a
        JSON number, so client and server representations cannot round-trip
        through float and silently lose precision. The carrier on every
        server surface is `rust_decimal::Decimal`, persisted in an exact
        decimal type.

        **The sign is never constrained.** A negative quantity records a
        real decrease in consumption and is an ordinary measurement, not a
        correction. Absent, non-numeric, non-finite, or out-of-range values
        are rejected at ingestion.

        Published range: magnitude ≤ 7.9×10²⁸ with up to 28 significant
        decimal digits and at most 28 digits after the decimal point.
        Every storage plugin MUST round-trip that full range —
        **including its negative half** — and the full precision without
        loss, and no path may convert, scale, round, or truncate a
        quantity between acceptance and read.

    AggregatedQuantity:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
      example: "79228162514264337593543950400"
      description: |
        Signed **arbitrary-precision** fold result, wire-encoded as a JSON
        string for the same float-safety reason as `UsageQuantity`. A `SUM`
        over a wide window can exceed `Decimal`'s ceiling, so the carrier is
        `bigdecimal::BigDecimal`, unbounded rather than capped at
        `UsageQuantity`'s ceiling.

    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[^\x00-\x1F\x7F]+$'
      description: |
        Caller-supplied dedup key. The dedup identity is the 5-tuple
        `(tenant_id, gts_type_id, idempotency_key, window_start,
        window_end)`, so submissions differing in period are distinct
        entries rather than duplicates and an emitter does not encode the
        period into the key.

        **The key carries what the identity does not.** `resource_ref` and
        `subject_ref` are compared on a collision but are not part of the
        identity, so one key shared across two resources in one period is a
        conflict, not a duplicate. Two entries covering one period need two
        keys, an invalidation needs a key distinct from its target's, and a
        retry must repeat its key exactly.

        An exact-equality retry on that identity is absorbed and the stored
        entry is returned. Any differing caller-supplied field — including a
        metadata-only difference — is rejected as a conflict.

        **Control characters are excluded.** The entry identifier
        derivation concatenates this value with the other dedup-identity
        inputs under a `0x1F` separator, so a key carrying a control
        character would break the derivation's injectivity. The charset is
        otherwise unconstrained, and the length is bounded at 1 to 256
        characters. No token shape is enforced.

        **The horizon is per-meter.** An identity stays visible for at least
        as long as the referenced type's retention policy retains the entry,
        measured from the covered period. That span is a guaranteed floor.
        Beyond it a matching submission is admitted as a new entry,
        deduplicated, or rejected as a conflict, and consumer-side
        deduplication by entry identifier takes over.

    GtsTypeId:
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^gts\.cf\.core\.uc\.usage_record\.v1~[^\x00-\x1F\x7F~]+~$'
      example: gts.cf.core.uc.usage_record.v1~cf.mini_chat._.tokens_consumed.v1~
      description: |
        Reference to the GTS type declaration held by `types-registry`. The
        value identifies exactly one declared meter across the deployment;
        the gear resolves the declaration by it and infers no metering
        meaning — fold, canonical unit, or metadata surface — from its
        shape. Those come from the declaration alone.

        **The value ends with `~`.** That terminal marker is the platform
        GTS convention distinguishing a *type* identifier from an *instance*
        identifier (`guidelines/GTS.md`), and this field holds a type
        identifier.

        **The base prefix is mandatory.** Every meter is a derived type of
        `gts.cf.core.uc.usage_record.v1~`, carrying exactly one further
        segment. That base is published at
        `docs/schemas/usage_record.v1.schema.json`, and deriving from it is
        what subjects a declaration to the `x-gts-traits-schema` that makes
        the aggregation fold, the canonical unit, and the retention policy
        mandatory and checkable when the declaration is registered rather
        than when the first entry is rejected. A deeper chain is refused: a
        meter is a leaf, not a base for further meters.

        **Control characters are excluded**, for the same reason as
        `IdempotencyKey`: the entry identifier derivation concatenates this
        value with the other dedup-identity inputs under a `0x1F` separator.

    ReasonCode:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        Why an invalidation was issued. Mandatory on an invalidation entry
        and forbidden on an ordinary record — including one whose quantity
        is negative, since that records real consumption rather than a
        correction. Returned on every read path exposing the correction.

    RecordMetadata:
      type: object
      additionalProperties:
        type: string
      description: |
        Closed key/value map. Every key MUST be a property the referenced
        type's metadata schema declares; values are strings in v1
        irrespective of richer typing the schema can express. Default cap
        8 KiB per entry (operator-configurable). MUST NOT contain PII,
        payment data, regulated health data, or credentials.

    ResourceRef:
      type: object
      additionalProperties: false
      required: [resource_id, resource_type]
      description: Caller-supplied resource attribution; both fields are mandatory.
      properties:
        resource_id:
          type: string
          minLength: 1
          maxLength: 256
        resource_type:
          type: string
          minLength: 1
          maxLength: 256

    SubjectRef:
      type: object
      additionalProperties: false
      required: [subject_id]
      description: |
        Optional subject attribution. `subject_id` is mandatory when
        supplied; `subject_type` is optional. Never derived from the
        caller's `SecurityContext`.
      properties:
        subject_id:
          type: string
          minLength: 1
          maxLength: 256
        subject_type:
          type: string
          minLength: 1
          maxLength: 256

    UsageRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - resource_ref
        - gts_type_id
        - entry_type
        - quantity
        - window_start
        - window_end
        - idempotency_key
        - accepted_at
        - acceptance_sequence
        - origin
      description: |
        One accepted ledger entry — a measurement or an invalidation,
        discriminated by `entry_type`, which the server derives from
        `invalidates`. **Never rewritten, retired, or
        altered after acceptance**; there is no status field and no
        lifecycle flag.

        The metering unit and the aggregation fold are resolved from the GTS
        type declaration and are deliberately **not** carried per entry:
        denormalizing them onto a high-rate stream would create a second
        place the same fact can be read and disagree.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Server-derived UUIDv5 over
            `(tenant_id, gts_type_id, idempotency_key, window_start, window_end)`.
            Stable across exact-equality retries and reproducible offline by
            the emitter, so a correction reference can be computed before
            submission. `invalidates` is deliberately excluded from the
            derivation — and so is the `entry_type` derived from it — so one
            key cannot stand for both a measurement and its withdrawal. The
            namespace constant is recorded in the identity ADR.
        tenant_id:
          type: string
          format: uuid
        resource_ref:
          $ref: "#/components/schemas/ResourceRef"
        subject_ref:
          $ref: "#/components/schemas/SubjectRef"
        gts_type_id:
          $ref: "#/components/schemas/GtsTypeId"
        entry_type:
          $ref: "#/components/schemas/EntryType"
        quantity:
          $ref: "#/components/schemas/UsageQuantity"
        window_start:
          $ref: "#/components/schemas/Timestamp"
        window_end:
          $ref: "#/components/schemas/Timestamp"
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        accepted_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            Gear-assigned instant of acceptance. **Not settable or
            overridable by the emitter** — an emitter-supplied one would let
            a skewed emitter hide its own lateness. Late arrival is
            evaluated as `accepted_at` against `window_end`.
        acceptance_sequence:
          type: integer
          format: int64
          minimum: 0
          description: |
            Gear-assigned position, monotonic per
            `(tenant_id, gts_type_id)`. Orders the usage feed and breaks
            `LATEST` ties. No cross-tenant or cross-type total order is
            claimed.
        origin:
          $ref: "#/components/schemas/RecordOrigin"
        invalidates:
          type: string
          format: uuid
          description: |
            The entry this one withdraws. Present exactly when
            `reason_code` is; its presence is what makes this entry an
            invalidation. The target MUST exist, MUST itself be a `record`,
            and MUST NOT already be invalidated.
        reason_code:
          $ref: "#/components/schemas/ReasonCode"
        invalidated_by:
          type: string
          format: uuid
          description: |
            The invalidation entry withdrawing this record, where one
            exists. Derived on read, not stored: it supplies the reverse
            direction of the correction linkage so a reader retrieving one
            entry sees it has been withdrawn without a second query.
        metadata:
          $ref: "#/components/schemas/RecordMetadata"

    CreateUsageRecordRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - resource_ref
        - gts_type_id
        - quantity
        - window_start
        - window_end
        - idempotency_key
      dependentRequired:
        invalidates: [reason_code]
        reason_code: [invalidates]
      description: |
        Ingestion projection of `UsageRecord`: the same shape minus the four
        server-owned fields — `id`, `accepted_at`, `acceptance_sequence`,
        and `origin` — and minus the derived `entry_type`. A stray value for
        any of them is rejected as an unknown field.

        The same schema carries both entry types, distinguished by
        `invalidates` alone: supplying it makes the submission an
        invalidation, omitting it makes it an ordinary record. There is no
        caller-supplied discriminator, so a marker cannot disagree with the
        payload it marks. `invalidates` and `reason_code` are
        both-or-neither, enforced by `dependentRequired`.

        For an invalidation the server additionally enforces that every
        caller-supplied field equals the target's — tenant, type, resource,
        subject (presence against absence is itself a mismatch), covered
        period, quantity, and metadata — rejecting any difference by naming
        the field that differs.
      properties:
        tenant_id:
          type: string
          format: uuid
        resource_ref:
          $ref: "#/components/schemas/ResourceRef"
        subject_ref:
          $ref: "#/components/schemas/SubjectRef"
        gts_type_id:
          $ref: "#/components/schemas/GtsTypeId"
        quantity:
          $ref: "#/components/schemas/UsageQuantity"
        window_start:
          $ref: "#/components/schemas/Timestamp"
        window_end:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            Exclusive end of the covered period; MUST be greater than or
            equal to `window_start`. Equal bounds mark a **point event** — a
            single instant rather than a period.
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        invalidates:
          type: string
          format: uuid
          description: |
            The entry this submission withdraws. Supplying it makes the
            submission an invalidation and requires `reason_code`; omitting
            it makes the submission an ordinary record.
        reason_code:
          $ref: "#/components/schemas/ReasonCode"
        metadata:
          $ref: "#/components/schemas/RecordMetadata"

    CreateUsageRecordsRequest:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreateUsageRecordRequest"

    CreateUsageRecordResult:
      oneOf:
        - $ref: "#/components/schemas/AcceptedUsageRecord"
        - $ref: "#/components/schemas/RejectedUsageRecord"
      discriminator:
        propertyName: outcome
        mapping:
          accepted: "#/components/schemas/AcceptedUsageRecord"
          rejected: "#/components/schemas/RejectedUsageRecord"
      description: |
        Per-record acknowledgement, internally tagged on `outcome`. Every
        submitted record yields exactly one entry and `results` preserves
        input order, so `index` is redundant with the array position and
        is carried anyway to keep an entry self-describing once it is
        lifted out of the array.

        There is no `duplicate` outcome on the wire. An exact-equality
        retry is absorbed by the dedup unique `(tenant_id, gts_type_id,
        idempotency_key, window_start, window_end)` and reported as
        `accepted` carrying the already-persisted record. A same-key
        submission whose canonical fields differ is `rejected` with
        `IDEMPOTENCY_CONFLICT`.

    AcceptedUsageRecord:
      type: object
      additionalProperties: false
      required: [outcome, index, record]
      description: The record was persisted (or an identical one already was).
      properties:
        outcome:
          type: string
          const: accepted
        index:
          type: integer
          minimum: 0
          description: Zero-based position of this record in the request's `records` array.
        record:
          $ref: "#/components/schemas/UsageRecord"

    RejectedUsageRecord:
      type: object
      additionalProperties: false
      required: [outcome, index, error]
      description: |
        The record failed validation, PDP authorization, the emission
        semantics matrix, or a same-key canonical-field mismatch
        (`IDEMPOTENCY_CONFLICT`). `error` is the same canonical envelope a
        single-record failure would have surfaced, folded into the batch.
      properties:
        outcome:
          type: string
          const: rejected
        index:
          type: integer
          minimum: 0
          description: Zero-based position of this record in the request's `records` array.
        error:
          $ref: "#/components/schemas/Problem"

    CreateUsageRecordsResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreateUsageRecordResult"

    Page_UsageRecord:
      type: object
      additionalProperties: false
      required: [items, page_info]
      description: Cursor-paginated page of ledger entries, keyset-stable over `(window_end, id)`.
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/UsageRecord"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    FeedPage:
      type: object
      additionalProperties: false
      required: [entries, watermark, page_info]
      description: |
        A page of the usage feed, keyset-stable over
        `(acceptance_sequence, id)` within each subscribed
        `(tenant_id, gts_type_id)` scope.
      properties:
        entries:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/UsageRecord"
        watermark:
          $ref: "#/components/schemas/FeedWatermark"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    FeedWatermark:
      type: object
      additionalProperties: false
      required: [accepted_at, acceptance_sequence]
      description: |
        The acceptance position through which this page is complete. Holds
        for **every** scope of the subscription, so a consumer can treat it
        as a single progress marker rather than tracking one per scope.
      properties:
        accepted_at:
          $ref: "#/components/schemas/Timestamp"
        acceptance_sequence:
          type: integer
          format: int64
          minimum: 0

    MetadataFilter:
      type: object
      additionalProperties: false
      required: [key, values]
      description: |
        Equality-set filter over one declared metadata property. Across an
        array: AND between distinct keys, OR within a single filter's
        `values`. An empty array imposes no metadata filter.
      properties:
        key:
          type: string
          minLength: 1
          description: A property the queried type's metadata schema declares.
        values:
          type: array
          minItems: 1
          items:
            type: string

    TimeRange:
      type: object
      additionalProperties: false
      required: [from, to]
      description: |
        Mandatory bounded range. An entry is selected when the end of its
        covered period falls in the range — `from <= window_end < to`.
      properties:
        from:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: Inclusive lower bound.
        to:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: Exclusive upper bound.

    AggregationRequest:
      type: object
      additionalProperties: false
      required: [gts_type_id, time_range]
      description: |
        Aggregation request. **There is no aggregation parameter** — the
        fold is resolved from the queried type's declaration, which is what
        makes "usage for this period" a single number per meter. A caller
        free to pick a different fold over the same entries could obtain a
        second defensible answer with nothing recording which one a charge
        derived from.
      properties:
        gts_type_id:
          allOf:
            - $ref: "#/components/schemas/GtsTypeId"
          description: The single GTS type to aggregate.
        time_range:
          $ref: "#/components/schemas/TimeRange"
        filter:
          type: string
          description: |
            OData `$filter` over the fixed field set plus every declared
            metadata property. The covered period is carried by
            `time_range`, not here.
        metadata_filter:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFilter"
        group_by:
          type: array
          maxItems: 2
          uniqueItems: true
          description: |
            Ordered grouping dimensions. Omitted or empty for the
            no-grouping case, which yields a single bucket with no `key`.
            Capped at 2 dimensions.
          items:
            $ref: "#/components/schemas/AggregationDimension"

    AggregationBucket:
      type: object
      additionalProperties: false
      required: [value]
      description: |
        Single folded bucket. `key` carries the dimension values in
        `group_by` order; omitted when `group_by` was empty.
      properties:
        key:
          type: array
          description: |
            Dimension values in `group_by` order. Each entry is the string
            form of its dimension: `Uuid::to_string()` (lowercase,
            hyphenated) for `tenant_id`; the record's value verbatim for
            the other fixed fields; the metadata value at the declared key
            for `{"metadata":"<key>"}`.
          items:
            type: string
        value:
          oneOf:
            - $ref: "#/components/schemas/AggregatedQuantity"
            - type: "null"
          description: |
            The folded quantity. `null` when no entries matched — for
            example `MAX` over an empty set.

    AggregationResult:
      type: object
      additionalProperties: false
      required: [buckets]
      description: |
        Aggregated-query result. A single bucket with no `key` represents
        the no-grouping case. Neither the fold nor `gts_type_id` is echoed:
        the fold is a property of the declaration the caller already
        resolves, and the type was a request input.
      properties:
        buckets:
          type: array
          maxItems: 100000
          description: |
            Result buckets. A request producing more than
            `MAX_AGGREGATION_BUCKETS` (100,000) is rejected with `400`
            (`context.reason = AGGREGATION_RESULT_TOO_LARGE`); narrow the
            range or drop the high-cardinality dimension.
          items:
            $ref: "#/components/schemas/AggregationBucket"

    ReconciliationMetadata:
      type: object
      additionalProperties: false
      required: [scope, accepted_count, accepted_at_watermark, window_end_watermark, sequence_watermark]
      description: |
        Per-scope ingestion metadata. Counts report ingestion activity
        rather than aggregating the meter, so they are reported for every
        GTS type irrespective of its declared fold.
      properties:
        scope:
          type: object
          additionalProperties: true
          description: |
            The scope these figures cover — some combination of calling
            gear, tenant, and GTS type depending on the requested
            granularity.
        accepted_count:
          type: integer
          format: int64
          minimum: 0
        quantity_summary:
          type: object
          additionalProperties: false
          description: |
            Fold-appropriate summary: the accrued sum for a `SUM` type, or
            the observation count together with the latest observation
            otherwise, since quantities under any other fold are not
            summable.
          properties:
            accrued_sum:
              $ref: "#/components/schemas/AggregatedQuantity"
            observation_count:
              type: integer
              format: int64
              minimum: 0
            latest_observation:
              $ref: "#/components/schemas/UsageQuantity"
        accepted_at_watermark:
          $ref: "#/components/schemas/Timestamp"
        window_end_watermark:
          $ref: "#/components/schemas/Timestamp"
        sequence_watermark:
          type: integer
          format: int64
          minimum: 0

    ReconciliationMetadataList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationMetadata"

    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, prev_cursor, limit]
      description: Cursor-based pagination envelope.
      properties:
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page. `null` on the last page.
        prev_cursor:
          type: [string, "null"]
          description: Opaque cursor for the previous page. `null` on the first page.
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
          description: Effective page size applied to this page.

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, context]
      description: |
        RFC 9457 problem+json envelope. `type` is a canonical-error category
        URI; `status` is the HTTP status; `context` is a per-category
        structured object. Discrimination layers, in order of granularity:
        `type` (broad category), `context.resource_type` (which entity),
        `context.field_violations[N].field`/`.reason` (per-field for
        `InvalidArgument`), or `context.reason` (carried natively on
        `Aborted`, `PermissionDenied`, `Unauthenticated`).
        `context.retryable` is a retry-safety hint.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        trace_id:
          type: string
          description: W3C Trace Context `trace-id` for correlation.
        context:
          type: object
          additionalProperties: true
          description: |
            Per-category structured context. Common fields include `reason`,
            `retryable`, `retry_after_seconds`, `field_violations`,
            `resource_type`, and `resource_name`.
