# Reference contract for the Usage Collector REST surface. The runtime
# OpenAPI document is emitted from `OperationBuilder` calls under
# `gears/system/usage-collector/usage-collector/src/api/rest/routes/`; a CI
# drift-check diffs paths, methods, operationIds, tags, parameters, and
# response schemas against this file.
#
# STATUS: unreleased. This file describes the Phase 2 metering model
# (registry-owned GTS type declarations, declared aggregation folds,
# invalidation-only corrections, interval usage windows, usage feed,
# isolated backfill, reconciliation). It is the *target* contract, not the
# served one: the routes registered today, `usage-collector-sdk`, and the
# TimescaleDB plugin all still implement the superseded Phase 1 surface.
#
# The divergence is deliberate and expected. This gear moves its
# specification first and lets the implementation follow, so the document
# leads the code for one cycle by decision rather than by neglect; the debt
# is carried in DESIGN.md 3.12.2 and PRD section 13.
#
# What that costs, stated plainly: for as long as the marker below reads
# `unreleased`, the six checks in `openapi_contract_tests.rs` that compare
# this document against the registered routes are `#[ignore]`d, so no CI
# job diffs the two. Do not generate a client from this file and expect it
# to work against a running gear. The YAML-internal checks (every `$ref`
# resolves) and the registry-internal checks stay live, so neither side is
# free to rot on its own, and both operation counts are pinned, so the gap
# can neither widen nor close unnoticed.

openapi: 3.1.0

# Machine-readable form of the STATUS note above, so a reader of the
# document alone — a client generator, a downstream gear — sees the same
# thing a reader of the test module does. Flipping this to `released` is
# the same edit as removing those six `#[ignore]`s: a live test holds the
# two together.
x-contract-status: unreleased
info:
  title: Usage Collector API
  version: 1.0.0-alpha
  description: |
    Append-only metering ledger. Attributed usage-record ingestion
    (including invalidation entries), raw and aggregated read surfaces, a
    replay-safe usage feed, bulk backfill import, and reconciliation
    metadata.

    All operations require a resolved `SecurityContext` supplied upstream by
    the platform gateway. **No operation modifies an accepted entry** and
    **no operation writes a GTS type declaration** — declaring, amending, and
    withdrawing declarations are `types-registry` surfaces.

servers:
  - url: https://api.example.com
    description: Platform API gateway (deployment-specific).

tags:
  - name: Usage Records
    description: |
      Ingestion of usage records and invalidation entries, raw and
      aggregated reads, and point lookup by record identifier.
  - name: Backfill
    description: |
      Bulk historical import, workload-isolated from live ingestion. Takes
      measurements and invalidation entries alike — the route for any covered
      period the live past tolerance rejects.
  - name: Usage Feed
    description: |
      Replay-safe, snapshot-consistent, cursor-paginated feed for charging
      consumers, scoped by GTS type subscription.
  - name: Reconciliation
    description: Per-scope ingestion counters and watermarks.
security:
  - bearerAuth: []

paths:
  /usage-collector/v1/records:
    post:
      operationId: usage_collector.create_usage_records
      tags: [Usage Records]
      summary: Ingest a batch of usage records or invalidation entries
      description: |
        Submit ledger entries up to the per-request cap, which is operator
        configuration (100 by default). An empty or over-cap submission is
        rejected whole with `400` on `records`. Supplying `invalidates` makes
        an entry an invalidation. Dedup, identity, and invalidation rules are
        specified in DESIGN.md §3.1, and per-entry rejections are listed on
        `RejectedUsageRecord`.

        The live path bounds the covered period of every entry, an
        invalidation's copied period included. A period ending beyond the
        future tolerance (default 5 minutes) is rejected with
        `context.field_violations[N].reason = FUTURE_WINDOW`, and one ending
        beyond the past tolerance (default 48 hours) with `PAST_WINDOW`,
        which names `POST /usage-collector/v1/records/backfill` as the route
        that accepts it. Each violation names the instant and the bound.

        Returns `200` if every entry was accepted or deduplicated, `207
        Multi-Status` if at least one was rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUsageRecordsRequest"
            examples:
              example_usage:
                summary: Ordinary measurement over a covered period
                value:
                  records:
                    - tenant_id: "11111111-1111-1111-1111-111111111111"
                      gts_type_id: gts.cf.core.uc.usage_record.v1~cf.mini_chat._.tokens_consumed.v1~
                      quantity: "42"
                      window_start: "2026-05-29T12:00:00Z"
                      window_end: "2026-05-29T13:00:00Z"
                      idempotency_key: ik-emit-usage-0001
                      resource_ref:
                        resource_id: rsc_compute_vm_001
                        resource_type: compute.vm
              example_point_event:
                summary: Point event (zero-length period)
                value:
                  records:
                    - tenant_id: "11111111-1111-1111-1111-111111111111"
                      gts_type_id: gts.cf.core.uc.usage_record.v1~cf.mini_chat._.requests.v1~
                      quantity: "1"
                      window_start: "2026-05-29T12:00:00Z"
                      window_end: "2026-05-29T12:00:00Z"
                      idempotency_key: ik-emit-point-0001
                      resource_ref:
                        resource_id: rsc_compute_vm_001
                        resource_type: compute.vm
              example_invalidation:
                summary: Invalidation — a faithful copy, quantity echoed not negated
                value:
                  records:
                    - tenant_id: "11111111-1111-1111-1111-111111111111"
                      gts_type_id: gts.cf.core.uc.usage_record.v1~cf.mini_chat._.tokens_consumed.v1~
                      invalidates: "01234567-89ab-cdef-0123-456789abcdef"
                      reason_code: emitter_duplicate
                      quantity: "42"
                      window_start: "2026-05-29T12:00:00Z"
                      window_end: "2026-05-29T13:00:00Z"
                      resource_ref:
                        resource_id: rsc_compute_vm_001
                        resource_type: compute.vm
      responses:
        "200":
          description: Every entry accepted or deduplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUsageRecordsResponse"
        "207":
          description: |
            At least one entry rejected. Inspect each per-entry `outcome`
            and `error` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUsageRecordsResponse"
        default:
          $ref: "#/components/responses/Problem"

    get:
      operationId: usage_collector.list_usage_records
      tags: [Usage Records]
      summary: Query raw usage records (cursor-paginated)
      description: |
        Ledger read path over exactly one GTS type within a mandatory time
        range. Returns entries **as persisted**: a withdrawn record and its
        invalidation are both returned, and the invalidation names its target.
        The path applies no fold.

        An entry is selected when the end of its covered period falls in
        the requested range (`from <= window_end < to`), whatever the length
        of that period. Pagination is keyset-stable over `(window_end, id)`,
        which a caller `$orderby` prefixes rather than replaces.

        Declared metadata properties are filtered by repeated
        `metadata.<key>=<value>` query parameters, for example
        `?metadata.region=eu&metadata.region=us&metadata.tier=gold`. Each
        distinct `<key>` forms one filter and its repetitions form that
        filter's value set. `MetadataFilter` is the normative definition of
        the predicate they build, and it bounds them. These parameters are
        specified here rather than under `parameters` below because OpenAPI
        cannot declare a parameter whose name carries a placeholder.
      parameters:
        - $ref: "#/components/parameters/GtsTypeIdQuery"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/OrderBy"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of usage records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_UsageRecord"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/records/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    get:
      operationId: usage_collector.get_usage_record
      tags: [Usage Records]
      summary: Point lookup of a single entry by identifier
      description: |
        Returns the exact persisted fact. The read runs under the caller's
        authorized scope, so an entry outside it returns `404` and this
        surface never acts as an existence oracle.
      responses:
        "200":
          description: The persisted entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageRecord"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/records/aggregate:
    post:
      operationId: usage_collector.query_aggregated_usage_records
      tags: [Usage Records]
      summary: Aggregated usage query over one GTS type
      description: |
        Derived view over the ledger. **The request carries no aggregation
        parameter**: the fold is the one declared by the queried GTS type,
        resolved from its declaration.

        A record withdrawn by an accepted invalidation, and the invalidation
        entry itself, each contribute nothing to the selected set. Because
        the invalidation carries the target's covered period, no requested
        range selects one of the pair without the other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregationRequest"
      responses:
        "200":
          description: Aggregated result buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregationResult"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/records/backfill:
    post:
      operationId: usage_collector.backfill_usage_records
      tags: [Backfill]
      summary: Bulk historical import, isolated from live ingestion
      description: |
        Identical validation and request shape to `POST /records`, differing
        only in four respects: the workload is isolated from live ingestion
        so it cannot breach live-path SLOs, every persisted entry is stamped
        `origin: backfill`, the live path's past bound on the covered period
        (default 48 hours) does not apply because this route exists for
        exactly the periods that bound rejects, and the configured
        backfill window (default 90 days) is a hard bound: a submission
        whose covered period ends further back is rejected with
        `context.field_violations[N].reason = PAST_WINDOW` naming the
        window, and no override is accepted on this or any other surface.
        The bound refuses only what lies past it, so a covered period
        ending exactly at the window is admitted.

        The route takes measurements and invalidation entries alike, mixed
        in one batch, under the same per-entry rules `POST /records`
        applies. Every persisted entry carries `origin: backfill`, the
        invalidation included, so a correction of closed history reads as
        history. The in-process SDK trait carries the same operation as
        `backfill_usage_records`.

        A deployment must not admit a backfill window that leaves any GTS
        type's retention below the window plus one operational replay
        horizon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUsageRecordsRequest"
      responses:
        "200":
          description: Every entry accepted or deduplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUsageRecordsResponse"
        "207":
          description: At least one entry rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUsageRecordsResponse"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/feed:
    get:
      operationId: usage_collector.read_usage_feed
      tags: [Usage Feed]
      summary: Read a page of the usage feed
      description: |
        Replay-safe, snapshot-consistent, pull-based read path for charging
        consumers. Order, completeness, and replay guarantees are specified
        in DESIGN.md §3.1 (Feed order) and §3.2 (Feed Gateway); cursor
        representation is on `FeedPage`.

        A cursor older than the retention floor is refused with `400` and a
        `cursor` field violation (`CURSOR_BEYOND_RETENTION`) rather than
        served as a silently truncated range.
      parameters:
        - name: gts_type_id
          in: query
          required: true
          description: |
            Subscription: the GTS types this consumer reads. Repeat the
            parameter for each type. The feed excludes everything else —
            from the entries and the cursor.

            The list is bounded because a subscription spans every tenant
            the caller may read, for each named type, so its size sets the
            cost of every page. A consumer of more than 100 types reads them
            over several subscriptions.
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: "#/components/schemas/GtsTypeId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Until"
      responses:
        "200":
          description: A page of feed entries with its cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        default:
          $ref: "#/components/responses/Problem"

  /usage-collector/v1/reconciliation:
    get:
      operationId: usage_collector.get_reconciliation_metadata
      tags: [Reconciliation]
      summary: Per-scope ingestion counters and watermarks
      description: |
        Sufficient for an external reconciliation job to compare gear-side
        accepted totals against a consumer's processed totals for a range
        without a full raw scan, and to detect an emitter that has silently
        stopped.

        **Stall detection is consumer-side.** The gear exposes the
        watermarks; the declared nominal sampling interval is served by
        `types-registry`. The gear evaluates neither, raises no
        stalled-emitter signal, and holds no threshold of its own.
      parameters:
        - name: scope
          in: query
          required: true
          description: |
            Granularity at which to report. The `caller` and
            `caller_tenant` scopes are reserved and not served in v1,
            because the tenant plane carries no calling-gear identity.
            Adding them later widens this enum, which is additive.
          schema:
            type: string
            enum: [tenant_gts_type]
        - name: gts_type_id
          in: query
          required: true
          description: The GTS type to report on.
          schema:
            $ref: "#/components/schemas/GtsTypeId"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
        - name: tenant_id
          in: query
          required: false
          description: |
            Narrow to one tenant. Omitted, the read reports every tenant of
            the requested type that has data in the range, so it paginates.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of reconciliation metadata for the requested scopes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationMetadataList"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Platform-issued bearer JWT resolved into a `SecurityContext`
        upstream of this gear. Requests without a resolved
        `SecurityContext` fail closed.

  parameters:
    RecordId:
      name: id
      in: path
      required: true
      description: Server-derived entry identifier (RFC 4122 UUID).
      schema:
        type: string
        format: uuid
    GtsTypeIdQuery:
      name: gts_type_id
      in: query
      required: true
      description: |
        The single GTS type to query. Both read paths target exactly one
        type, so returned rows share one unit, one fold, and one declared
        metadata surface.
      schema:
        $ref: "#/components/schemas/GtsTypeId"
    RangeFrom:
      name: from
      in: query
      required: true
      description: |
        Inclusive lower bound of the requested range (UTC, RFC 3339). The
        range is mandatory on every read path.
      schema:
        type: string
        format: date-time
    RangeTo:
      name: to
      in: query
      required: true
      description: Exclusive upper bound of the requested range (UTC, RFC 3339).
      schema:
        type: string
        format: date-time
    Filter:
      name: $filter
      in: query
      required: false
      description: |
        OData `$filter` over the fixed field set (`tenant_id`,
        `resource_id`, `resource_type`, `subject_id`, `subject_type`,
        `entry_type`, `origin`, `invalidates`). Opaque-identifier fields
        accept `eq` and `in` only.

        Declared metadata properties are **not** operands here — the
        `toolkit-odata` grammar does not express filters over JSON map
        keys. Filter on them with the repeated `metadata.<key>` parameters
        described on the operation and defined by `MetadataFilter`.

        The covered period is **not** filtered here — it is carried by the
        mandatory `from` / `to` parameters, which select on the period end.
      schema:
        type: string
    OrderBy:
      name: $orderby
      in: query
      required: false
      # A `$ref` rather than a copy: `every_ref_resolves` walks every node,
      # so renaming the component fails a live test instead of orphaning
      # the prose below.
      x-order-keys:
        $ref: "#/components/schemas/RecordOrderKey"
      description: |
        OData `$orderby`. Every key MUST be a value `RecordOrderKey` names,
        and all keys MUST share one sort direction. Anything else is
        rejected `400` (`VALIDATION`), because keyset pagination requires a
        uniform-direction, never-null keyset.

        Absent `$orderby` the order is `(window_end, id)`. Supplied, the
        effective order is the caller's keys followed by that pair, which
        the server appends in the caller's direction.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Number of items per page (1..1000).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor token. Forward-only; callers MUST NOT parse or
        modify. It binds the order and the full query scope it was
        minted under — every filtering and scoping parameter, `$filter`
        and `metadata.<key>` included: a malformed token, any change to
        that scope, or an accompanying `$orderby` is rejected `400` with
        a `cursor` field violation (`INVALID_CURSOR`, `FILTER_MISMATCH`,
        `ORDER_WITH_CURSOR`).
        Continue a page by resending the same query, cursor apart.
      schema:
        type: string
    Until:
      name: until
      in: query
      required: false
      description: |
        A later feed cursor bounding a replay: reading stops at its
        position. Omit it to read the live feed. It is validated and
        refused past the retention floor as `cursor` is, under the same
        subscription, with violations reported on `until`.
      schema:
        type: string

  responses:
    Problem:
      description: RFC 9457 `application/problem+json` envelope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    EntryType:
      type: string
      enum: [record, invalidation]
      readOnly: true
      description: |
        The closed discriminator between a measurement and a withdrawal,
        **derived** from whether the entry carries `invalidates`. It appears
        on read shapes only; the ingestion shape accepts no discriminator
        field, so a marker can never disagree with the payload it marks.

        An entry is never identified as a correction by the value or sign of
        its quantity: zero and negative quantities are ordinary
        measurements, and an invalidation echoes the quantity it withdraws
        rather than negating it.

    RecordOrigin:
      type: string
      enum: [live, backfill]
      description: |
        Which ingestion path admitted the entry. Server-assigned from the
        path itself, never caller-supplied, and returned on every read path.

    AggregationDimension:
      oneOf:
        - type: string
          enum: [tenant_id, resource_id, resource_type, subject_id, subject_type]
          description: |
            Group by a fixed field. `resource_id` / `resource_type` flatten
            `resource_ref`; `subject_id` / `subject_type` flatten
            `subject_ref` (entries without a subject are excluded from the
            grouping).
        - type: object
          additionalProperties: false
          required: [metadata]
          description: |
            Group by the value of a single declared metadata property. The
            key MUST be a property the queried type's metadata schema
            declares.
          properties:
            metadata:
              type: string
              minLength: 1
      description: |
        Aggregation grouping dimension: either a fixed field emitted as a
        JSON string, or a single-field tagged object `{"metadata": "<key>"}`
        selecting a declared metadata property.

    RecordOrderKey:
      type: string
      enum:
        - id
        - tenant_id
        - resource_id
        - resource_type
        - entry_type
        - origin
        - window_start
        - window_end
        - accepted_at
      description: |
        The admissible `$orderby` keys, defined here once. A key qualifies
        when it is scalar, mandatory on every entry, and ordered the way its
        wire form reads. `resource_id` and `resource_type` flatten
        `resource_ref`, as on `$filter` and `AggregationDimension`.

        Fail-closed: a field added to `UsageRecord` is not an order key
        until this enum names it. The four required fields it excludes each
        fail one of those three tests — `resource_ref` is an object,
        `quantity` is a decimal carried as a string (so `"9"` sorts after
        `"42.5"`), `idempotency_key` is opaque, and `gts_type_id` is
        reserved and holds one value per request. Optional fields are
        excluded by the nullable-keyset rule.

    Timestamp:
      type: string
      format: date-time
      description: |
        UTC instant (RFC 3339). Timestamps carrying no offset are rejected;
        non-UTC offsets are normalized to UTC. A covered-period bound carries
        at most microsecond precision — the record-identity derivation reads a
        fixed-width microsecond form, so a finer value is rejected rather than
        truncated.

    UsageQuantity:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]{0,27})(?:\.[0-9]{1,28})?$'
      example: "42.5"
      description: |
        Finite, signed decimal in the canonical unit of the entry's GTS
        type, wire-encoded as a JSON **string** so it never round-trips
        through float. The sign is never constrained: a negative quantity is
        an ordinary measurement, not a correction.

        Published range: at most 28 significant decimal digits (leading
        zeros excluded) and at most 28 digits after the decimal point, so
        the magnitude is below 10²⁸ and the smallest non-zero value is
        1×10⁻²⁸, negative half included. The pattern cannot express the
        significant-digit bound, which the gear enforces at ingestion. The
        bound is narrower than the `rust_decimal::Decimal` carrier's 29
        significant digits; where the two disagree, this bound is
        normative. Fidelity across the range is DESIGN.md §3.1 (Quantity
        fidelity).

    AggregatedQuantity:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
      example: "79228162514264337593543950400"
      description: |
        Signed **arbitrary-precision** fold result, wire-encoded as a JSON
        string for the same float-safety reason as `UsageQuantity`. A `SUM`
        over a wide window can exceed `Decimal`'s ceiling, so the carrier is
        `bigdecimal::BigDecimal`, unbounded rather than capped at
        `UsageQuantity`'s ceiling.

    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[^\x00-\x1F\x7F]+$'
      not:
        pattern: '^inv:'
      description: |
        Caller-supplied dedup key on a measurement; an invalidation carries
        none (`StoredIdempotencyKey`). It is one part of the dedup identity
        `(tenant_id, gts_type_id, idempotency_key, window_start,
        window_end)`; how to choose it and the dedup outcomes are specified
        in DESIGN.md §2.1 (Idempotency-by-key) and §3.1.

        Control characters are excluded because the identifier derivation
        joins the identity inputs under a `0x1F` separator. The `inv:`
        prefix is reserved for derived invalidation keys. No token shape is
        otherwise enforced.

    StoredIdempotencyKey:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[^\x00-\x1F\x7F]+$'
      description: |
        The dedup key an accepted entry carries: the caller's
        `IdempotencyKey` on a measurement, and on an invalidation the
        server-derived `inv:` followed by the `invalidates` identifier,
        lowercase hyphenated.

    GtsTypeId:
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^gts\.cf\.core\.uc\.usage_record\.v1~[^\x00-\x1F\x7F~]+~$'
      example: gts.cf.core.uc.usage_record.v1~cf.mini_chat._.tokens_consumed.v1~
      description: |
        Reference to the GTS type declaration held by `types-registry`. The
        value identifies exactly one declared meter across the deployment;
        the gear resolves the declaration by it and infers no metering
        meaning — fold, canonical unit, or metadata surface — from its
        shape. Those come from the declaration alone.

        **The value ends with `~`.** That terminal marker is the platform
        GTS convention distinguishing a *type* identifier from an *instance*
        identifier (`guidelines/GTS.md`), and this field holds a type
        identifier.

        **The base prefix is mandatory.** Every meter is a derived type of
        `gts.cf.core.uc.usage_record.v1~`, carrying exactly one further
        segment. That base is published at
        `docs/schemas/usage_record.v1.schema.json`, and deriving from it is
        what subjects a declaration to the `x-gts-traits-schema` that makes
        the aggregation fold, the canonical unit, and the retention policy
        mandatory and checkable when the declaration is registered rather
        than when the first entry is rejected. A deeper chain is refused: a
        meter is a leaf, not a base for further meters.

        **Control characters are excluded**, for the same reason as
        `IdempotencyKey`: the entry identifier derivation concatenates this
        value with the other dedup-identity inputs under a `0x1F` separator.

    ReasonCode:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        Why an invalidation was issued. Mandatory on an invalidation entry
        and forbidden on an ordinary record — including one whose quantity
        is negative, since that records real consumption rather than a
        correction. Returned on every read path exposing the correction.

    RecordMetadata:
      type: object
      additionalProperties:
        type: string
      description: |
        Closed key/value map. Every key MUST be a property the referenced
        type's metadata schema declares; values are strings in v1
        irrespective of richer typing the schema can express. Default cap
        8 KiB per entry (operator-configurable). MUST NOT contain PII,
        payment data, regulated health data, or credentials.

    ResourceRef:
      type: object
      additionalProperties: false
      required: [resource_id, resource_type]
      description: Caller-supplied resource attribution; both fields are mandatory.
      properties:
        resource_id:
          type: string
          minLength: 1
          maxLength: 256
        resource_type:
          type: string
          minLength: 1
          maxLength: 256

    SubjectRef:
      type: object
      additionalProperties: false
      required: [subject_id]
      description: |
        Optional subject attribution. `subject_id` is mandatory when
        supplied; `subject_type` is optional. Never derived from the
        caller's `SecurityContext`.
      properties:
        subject_id:
          type: string
          minLength: 1
          maxLength: 256
        subject_type:
          type: string
          minLength: 1
          maxLength: 256

    UsageRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - resource_ref
        - gts_type_id
        - entry_type
        - quantity
        - window_start
        - window_end
        - idempotency_key
        - accepted_at
        - origin
      oneOf:
        - title: record
          description: A measurement. Carries neither `invalidates` nor `reason_code`.
          properties:
            entry_type:
              const: record
            invalidates: false
            reason_code: false
        - title: invalidation
          description: A withdrawal. Carries both `invalidates` and `reason_code`.
          properties:
            entry_type:
              const: invalidation
          required:
            - invalidates
            - reason_code
      description: |
        One accepted ledger entry — a measurement or an invalidation,
        discriminated by `entry_type`, which the server derives from
        `invalidates`. **Never rewritten, retired, or
        altered after acceptance**; there is no status field and no
        lifecycle flag.

        The two entry types are exclusive schema branches, so a shape that
        contradicts its own discriminator is unrepresentable: an
        `invalidation` carries both `invalidates` and `reason_code`, a
        `record` carries neither.

        The metering unit and the aggregation fold are resolved from the GTS
        type declaration and are deliberately **not** carried per entry:
        denormalizing them onto a high-rate stream would create a second
        place the same fact can be read and disagree.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Server-derived UUIDv5 over
            `(tenant_id, gts_type_id, idempotency_key, window_start, window_end)`,
            reproducible offline by the emitter. The namespace constant is
            recorded in the identity ADR.
        tenant_id:
          type: string
          format: uuid
        resource_ref:
          $ref: "#/components/schemas/ResourceRef"
        subject_ref:
          $ref: "#/components/schemas/SubjectRef"
        gts_type_id:
          $ref: "#/components/schemas/GtsTypeId"
        entry_type:
          $ref: "#/components/schemas/EntryType"
        quantity:
          $ref: "#/components/schemas/UsageQuantity"
        window_start:
          $ref: "#/components/schemas/Timestamp"
        window_end:
          $ref: "#/components/schemas/Timestamp"
        idempotency_key:
          $ref: "#/components/schemas/StoredIdempotencyKey"
        accepted_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            Gear-assigned instant of acceptance. **Not settable or
            overridable by the emitter** — an emitter-supplied one would let
            a skewed emitter hide its own lateness. Late arrival is
            evaluated as `accepted_at` against `window_end`.
        origin:
          $ref: "#/components/schemas/RecordOrigin"
        invalidates:
          type: string
          format: uuid
          description: |
            The `record` this invalidation withdraws.
        reason_code:
          $ref: "#/components/schemas/ReasonCode"
        metadata:
          $ref: "#/components/schemas/RecordMetadata"

    CreateUsageRecordRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - resource_ref
        - gts_type_id
        - quantity
        - window_start
        - window_end
      oneOf:
        - title: record
          description: A measurement. Carries the caller's key and neither `invalidates` nor `reason_code`.
          required:
            - idempotency_key
          properties:
            invalidates: false
            reason_code: false
        - title: invalidation
          description: A withdrawal. Carries `invalidates` and `reason_code`, and no key.
          required:
            - invalidates
            - reason_code
          properties:
            idempotency_key: false
      description: |
        Ingestion projection of `UsageRecord`, without the server-owned
        `id`, `accepted_at`, and `origin` and the derived `entry_type`; a
        stray value for any of them is rejected as an unknown field. The
        `oneOf` branches tell the two entry types apart by `invalidates`
        alone, with no caller-supplied discriminator. An invalidation must
        also be a faithful copy of its target (DESIGN.md §3.1), and a
        mismatch is rejected naming the field that differs.
      properties:
        tenant_id:
          type: string
          format: uuid
        resource_ref:
          $ref: "#/components/schemas/ResourceRef"
        subject_ref:
          $ref: "#/components/schemas/SubjectRef"
        gts_type_id:
          $ref: "#/components/schemas/GtsTypeId"
        quantity:
          $ref: "#/components/schemas/UsageQuantity"
        window_start:
          $ref: "#/components/schemas/Timestamp"
        window_end:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            Exclusive end of the covered period; MUST be greater than or
            equal to `window_start`. Equal bounds mark a **point event** —
            a zero-length period, not an error.
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        invalidates:
          type: string
          format: uuid
          description: |
            The `record` this invalidation withdraws.
        reason_code:
          $ref: "#/components/schemas/ReasonCode"
        metadata:
          $ref: "#/components/schemas/RecordMetadata"

    CreateUsageRecordsRequest:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          description: |
            Bounded by the per-request cap, which is operator configuration
            (100 by default) and therefore not fixed in this schema.
          items:
            $ref: "#/components/schemas/CreateUsageRecordRequest"

    CreateUsageRecordResult:
      oneOf:
        - $ref: "#/components/schemas/AcceptedUsageRecord"
        - $ref: "#/components/schemas/RejectedUsageRecord"
      discriminator:
        propertyName: outcome
        mapping:
          accepted: "#/components/schemas/AcceptedUsageRecord"
          rejected: "#/components/schemas/RejectedUsageRecord"
      description: |
        Per-record acknowledgement, tagged on `outcome`. `results` preserves
        input order, and `index` repeats the array position so an entry
        stays self-describing once lifted out of the array.

        There is no `duplicate` outcome: an absorbed retry is `accepted` and
        carries the persisted entry. Under the `eventual` dedup level, an
        `accepted` entry can still lose a race and be discarded (DESIGN.md
        §3.1, Dedup level).

    AcceptedUsageRecord:
      type: object
      additionalProperties: false
      required: [outcome, index, record]
      description: The record was persisted (or an identical one already was).
      properties:
        outcome:
          type: string
          const: accepted
        index:
          type: integer
          minimum: 0
          description: Zero-based position of this record in the request's `records` array.
        record:
          $ref: "#/components/schemas/UsageRecord"

    RejectedUsageRecord:
      type: object
      additionalProperties: false
      required: [outcome, index, error]
      description: |
        The record failed validation, authorization, or deduplication.
        `error` is the envelope a single-record failure would have surfaced.
        Dedup rejections carry `context.reason`: `IDEMPOTENCY_CONFLICT`;
        `ALREADY_INVALIDATED`, whose `context` names the target,
        `invalidated_by`, and the stored `reason_code`; or
        `TARGET_NOT_CONVERGED`, with `context.retryable = true`.
      properties:
        outcome:
          type: string
          const: rejected
        index:
          type: integer
          minimum: 0
          description: Zero-based position of this record in the request's `records` array.
        error:
          $ref: "#/components/schemas/Problem"

    CreateUsageRecordsResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          description: One entry per submitted record, so bounded by the per-request cap.
          items:
            $ref: "#/components/schemas/CreateUsageRecordResult"

    Page_UsageRecord:
      type: object
      additionalProperties: false
      required: [items, page_info]
      description: Cursor-paginated page of ledger entries, keyset-stable over `(window_end, id)`, which a caller `$orderby` prefixes rather than replaces.
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/UsageRecord"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    FeedPage:
      type: object
      additionalProperties: false
      required: [entries, page_info]
      description: |
        A page of the usage feed in feed order (DESIGN.md §3.1). Everything
        before `next_cursor` is delivered and final. On a live read
        `next_cursor` is never `null`, even on a short page; it is `null`
        only on the page that reaches `until`. `prev_cursor` is always
        `null`.
      properties:
        entries:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/UsageRecord"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    MetadataFilter:
      type: object
      additionalProperties: false
      required: [key, values]
      description: |
        Equality-set filter over one declared metadata property, and the
        normative definition of metadata filtering for **both** read paths.

        - `key` MUST be a property the queried type's metadata schema
          declares; an undeclared key is rejected `400` (`VALIDATION`).
        - Within one filter, `values` are OR-ed.
        - Across filters, distinct keys are AND-ed.
        - The resulting predicate is AND-ed with `$filter` / `filter`, which
          cannot carry these operands itself. No filter at all — an absent
          or empty set — imposes no metadata restriction.
        - A query carries at most 16 filters, each with at most 32 values.
        - The predicate is part of the query scope a `cursor` is bound to.

        The aggregation path carries these objects in its request body. The
        raw read path carries the same predicate as repeated
        `metadata.<key>=<value>` query parameters, because OpenAPI cannot
        declare a parameter whose name carries a placeholder. The two
        spellings denote one predicate with one meaning.
      properties:
        key:
          type: string
          minLength: 1
          description: A property the queried type's metadata schema declares.
        values:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string

    TimeRange:
      type: object
      additionalProperties: false
      required: [from, to]
      description: |
        Mandatory bounded range. An entry is selected when the end of its
        covered period falls in the range — `from <= window_end < to`.
      properties:
        from:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: Inclusive lower bound.
        to:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: Exclusive upper bound.

    AggregationRequest:
      type: object
      additionalProperties: false
      required: [gts_type_id, time_range]
      description: |
        Aggregation request. **There is no aggregation parameter** — the
        fold is resolved from the queried type's declaration, which is what
        makes "usage for this period" a single number per meter. A caller
        free to pick a different fold over the same entries could obtain a
        second defensible answer with nothing recording which one a charge
        derived from.
      properties:
        gts_type_id:
          allOf:
            - $ref: "#/components/schemas/GtsTypeId"
          description: The single GTS type to aggregate.
        time_range:
          $ref: "#/components/schemas/TimeRange"
        filter:
          type: string
          description: |
            OData `$filter` over the fixed field set. Declared metadata
            properties are filtered by `metadata_filter`, not here; the two
            are AND-ed. The covered period is carried by `time_range`.
        metadata_filter:
          type: array
          maxItems: 16
          description: |
            Metadata predicate, AND-ed with `filter`. Semantics and bounds
            are defined by `MetadataFilter`.
          items:
            $ref: "#/components/schemas/MetadataFilter"
        group_by:
          type: array
          maxItems: 2
          uniqueItems: true
          description: |
            Ordered grouping dimensions. Omitted or empty for the
            no-grouping case, which yields a single bucket with an empty
            `key`. Capped at 2 dimensions, so a bucket `key` never carries
            more than 2 entries.
          items:
            $ref: "#/components/schemas/AggregationDimension"

    AggregationBucket:
      type: object
      additionalProperties: false
      required: [key, value]
      description: |
        Single folded bucket. `key` carries the dimension values in
        `group_by` order, one entry per dimension; an empty array when
        `group_by` was empty.
      properties:
        key:
          type: array
          maxItems: 2
          description: |
            Dimension values in `group_by` order. Each entry is the string
            form of its dimension: `Uuid::to_string()` (lowercase,
            hyphenated) for `tenant_id`; the record's value verbatim for
            the other fixed fields; the metadata value at the declared key
            for `{"metadata":"<key>"}`.
          items:
            type: string
        value:
          oneOf:
            - $ref: "#/components/schemas/AggregatedQuantity"
            - type: "null"
          description: |
            The folded quantity. `null` when no entries matched — for
            example `MAX` over an empty set.

    AggregationResult:
      type: object
      additionalProperties: false
      required: [buckets]
      description: |
        Aggregated-query result. A single bucket with an empty `key`
        represents the no-grouping case. Neither the fold nor
        `gts_type_id` is echoed: the fold is a property of the declaration
        the caller already resolves, and the type was a request input.
      properties:
        buckets:
          type: array
          maxItems: 100000
          description: |
            Result buckets. A request producing more than
            `MAX_AGGREGATION_BUCKETS` (100,000) is rejected with `400`
            (`context.reason = AGGREGATION_RESULT_TOO_LARGE`); narrow the
            range or drop the high-cardinality dimension.
          items:
            $ref: "#/components/schemas/AggregationBucket"

    ReconciliationMetadata:
      type: object
      additionalProperties: false
      required:
        - scope
        - accepted_count
        - quantity_summary
        - accepted_at_watermark
        - window_end_watermark
      description: |
        Per-scope ingestion metadata. Counts report ingestion activity
        rather than aggregating the meter, so they are reported for every
        GTS type irrespective of its declared fold.

        `accepted_count` and `quantity_summary` cover exactly the entries
        the requested range selects (`from <= window_end < to`), the same
        rule every read path applies. The two watermarks are current as
        of the response and are not bounded by the range.
      properties:
        scope:
          type: object
          additionalProperties: false
          required: [tenant_id, gts_type_id]
          description: |
            The scope these figures cover: tenant and GTS type in v1.
            Serving a reserved `caller` or `caller_tenant` scope later
            widens this object, which is additive.
          properties:
            tenant_id:
              type: string
              format: uuid
            gts_type_id:
              $ref: "#/components/schemas/GtsTypeId"
        accepted_count:
          type: integer
          format: int64
          minimum: 0
        quantity_summary:
          description: |
            Fold-appropriate summary: the accrued sum for a `SUM` type, or
            the observation count together with the latest observation
            otherwise, since quantities under any other fold are not
            summable. The type's declared fold selects the branch, so
            exactly one of the two is present.
          oneOf:
            - type: object
              additionalProperties: false
              required: [accrued_sum]
              description: Summary for a `SUM` type.
              properties:
                accrued_sum:
                  $ref: "#/components/schemas/AggregatedQuantity"
            - type: object
              additionalProperties: false
              required: [observation_count, latest_observation]
              description: Summary for any other fold.
              properties:
                observation_count:
                  type: integer
                  format: int64
                  minimum: 0
                latest_observation:
                  $ref: "#/components/schemas/UsageQuantity"
        accepted_at_watermark:
          $ref: "#/components/schemas/Timestamp"
        window_end_watermark:
          $ref: "#/components/schemas/Timestamp"

    ReconciliationMetadataList:
      type: object
      additionalProperties: false
      required: [items, page_info]
      description: |
        Cursor-paginated page of per-scope counters, keyset-stable over
        `tenant_id` within the requested GTS type.
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReconciliationMetadata"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, prev_cursor, limit]
      description: Cursor-based pagination envelope.
      properties:
        next_cursor:
          type: [string, "null"]
          description: |
            Opaque cursor for the next page. `null` on the last page, unless
            the page schema states otherwise (`FeedPage` does).
        prev_cursor:
          type: [string, "null"]
          description: |
            Opaque cursor for the previous page. `null` on the first page,
            unless the page schema states otherwise (`FeedPage` does).
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
          description: Effective page size applied to this page.

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, context]
      description: |
        RFC 9457 problem+json envelope. `type` is a canonical-error category
        URI; `status` is the HTTP status; `context` is a per-category
        structured object. Discrimination layers, in order of granularity:
        `type` (broad category), `context.resource_type` (which entity),
        `context.field_violations[N].field`/`.reason` (per-field for
        `InvalidArgument`), or `context.reason` (carried natively on
        `Aborted`, `PermissionDenied`, `Unauthenticated`).
        `context.retryable` is a retry-safety hint.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        trace_id:
          type: string
          description: W3C Trace Context `trace-id` for correlation.
        context:
          type: object
          additionalProperties: true
          description: |
            Per-category structured context. Common fields include `reason`,
            `retryable`, `retry_after_seconds`, `field_violations`,
            `resource_type`, and `resource_name`.
