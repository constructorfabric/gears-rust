[package]
name = "cf-gears-le-issue-admission-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Admission plugin for the license-enforcement gear: root grants from authorized issue requests"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "licensing"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "le_issue_admission_plugin"

[lints]
workspace = true

[dependencies]
license-enforcement-sdk = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
gts = { workspace = true }
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["rt", "macros"] }
