[package]
name = "cf-gears-authz-resolver"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AuthZ resolver gear - discovers and routes to plugins"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "authorization"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "authz_resolver"

[lints]
workspace = true

[dependencies]
# Trait boundaries of consumed SDKs are `CanonicalError` (ADR 0005).
toolkit-canonical-errors = { workspace = true }
# Local dependencies
authz-resolver-sdk = { package = "cf-gears-authz-resolver-sdk", version = "0.6.0", path = "../authz-resolver-sdk", features = [
    "rest-client",
    "rest-server",
] }
# Plugin discovery via `consumes`: local registry or resolving REST client.
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.4.0", path = "../../types-registry/types-registry-sdk", features = ["rest-client"] }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-contract = { workspace = true, features = ["runtime-client", "rest-server"] }
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }
# Bounds a cold plugin selection (`DISCOVERY_BUDGET`).
tokio = { workspace = true, features = ["time"] }

# Error handling and serialization
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `register_rest` hands an `axum::Router` to the SDK's generated route
# registration; the SDK owns the http/futures/stream deps for that codegen.
axum = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
# Async test harness + supporting types for the gear/local-client unit tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util = { workspace = true }
uuid = { workspace = true }
toolkit-gts = { workspace = true }
parking_lot = { workspace = true }
# The in-memory platform registry the selection tests run against.
types-registry-sdk = { package = "cf-gears-types-registry-sdk", path = "../../types-registry/types-registry-sdk", features = ["test-util"] }
