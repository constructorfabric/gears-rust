[package]
name = "cf-gears-tr-authz-plugin"
version = "0.1.22"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AuthZ resolver plugin with tenant hierarchy resolution via Tenant Resolver"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "authorization"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "tr_authz_plugin"

[lints]
workspace = true

[dependencies]
# Local dependencies
authz-resolver-sdk = { package = "cf-gears-authz-resolver-sdk", version = "0.6.0", path = "../../authz-resolver-sdk" }
tenant-resolver-sdk = { package = "cf-gears-tenant-resolver-sdk", version = "0.4.6", path = "../../../tenant-resolver/tenant-resolver-sdk" }
# Publishes in `init` through the host-linked registry's local platform API.
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.4.0", path = "../../../types-registry/types-registry-sdk" }
# `deps = [tenant_resolver]`: its `init` takes the `TenantResolverClient` that gear registers.
tenant-resolver = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-gts = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }

# Data structures
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
tokio-util = { workspace = true }
# The in-memory platform registry the publication tests run against.
types-registry-sdk = { package = "cf-gears-types-registry-sdk", path = "../../../types-registry/types-registry-sdk", features = ["test-util"] }
