[package]
name = "cf-gears-rules-authz-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AuthZ resolver plugin evaluating explicitly configured, fail-closed permission rules"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "authorization"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "rules_authz_plugin"

[lints]
workspace = true

[dependencies]
# Local dependencies
authz-resolver-sdk = { package = "cf-gears-authz-resolver-sdk", version = "0.5.2", path = "../../authz-resolver-sdk" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.9", path = "../../../types-registry/types-registry-sdk" }
types-registry = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-gts = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }

# Data structures
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
toolkit-canonical-errors = { workspace = true }
# The real Event Broker ingest service and its PolicyEnforcer produce checks.
event-broker = { workspace = true, features = ["test-utils"] }
event-broker-sdk = { workspace = true }
gts = { workspace = true }
chrono = { workspace = true }
