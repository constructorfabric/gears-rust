[package]
name = "cf-gears-single-tenant-tr-plugin"
version = "0.1.43"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Zero-config tenant resolver plugin for single-tenant deployments"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lib]
name = "single_tenant_tr_plugin"

[lints]
workspace = true

[dependencies]
# Local dependencies
tenant-resolver-sdk = { package = "cf-gears-tenant-resolver-sdk", version = "0.4.8", path = "../../tenant-resolver-sdk" }
# Publishes through the consumed platform API (local or resolving REST client).
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.4.2", path = "../../../types-registry/types-registry-sdk", features = ["rest-client"] }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }

# Data structures
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
# The plugin instance document of the GTS publication.
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-util = { workspace = true }
types-registry-sdk = { workspace = true, features = ["test-util"] }
