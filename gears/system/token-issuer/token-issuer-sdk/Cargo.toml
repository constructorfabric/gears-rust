[package]
name = "cf-gears-token-issuer-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SDK for token_issuer gear: signing port, mint API traits, models, and error definitions"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "token_issuer_sdk"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

# GTS types
gts = { workspace = true }
gts-macros = { workspace = true }
toolkit-gts = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-security = { workspace = true }

[package.metadata.cargo-shear]
# `toolkit_gts::gts_type_schema` expands into code that has `gts_macros`.
# Since `cargo expand` shows the code after it expands all macros recursively, `gts-macros` is
# invisible for `cargo-shear`.
ignored = ["gts-macros"]
