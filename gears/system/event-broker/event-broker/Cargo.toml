[package]
name = "cf-gears-event-broker"
description = "Event Broker: Ingest/Delivery/Dispatcher composite module (deployment-topology skeleton)"
version = "0.4.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["constructorfabric", "cf-gears", "event-broker"]
categories = ["asynchronous"]
metadata.docs.rs.all-features = true

autobins = false

[features]
# Exposes `test_support` (the in-process `EventBrokerHarness` + `test_router`)
# to other crates' tests, mirroring oagw's `test-utils`. The event-broker SDK's
# integration tests enable it to resolve a real in-process `EventBrokerApi`
# (`LocalBroker`) from the harness's `ClientHub` instead of a mock. The
# harness's own deps (`memory-event-broker-plugin`, `types-registry-sdk`,
# `sea-orm-migration`, `tokio-util`) are already regular dependencies; the
# router-driving side modules (`request`/`response`) additionally need `http`
# + `tower`, and the fixtures need `types-registry-sdk`'s `test-util`, so the
# feature pulls those in (they are otherwise dev-only).
test-utils = ["dep:http", "dep:tower", "types-registry-sdk/test-util"]
# Gates the engine-matrix tests (`tests/*_backends_test.rs`), which need a
# Docker daemon for their PostgreSQL and MySQL servers (or the servers
# `EB_TEST_POSTGRES_URL` / `EB_TEST_MYSQL_URL` name), so a default `cargo test`
# never does. The drivers themselves are production features already.
integration = []

[lib]
name = "event_broker"

[[bin]]
name = "cf-gears-event-broker-server"
path = "src/bin/server.rs"

[lints]
workspace = true

[dependencies]
# A concrete topic and a concrete event type are both derived GTS type schemas,
# so the broker models neither itself: the identifier wrapper comes from `gts`,
# the resolved type schema from `types-registry-sdk`, and the DTO shapes the API
# reports from its own SDK - projecting a schema onto one of those shapes is
# broker-side work and lives here.
# `types-registry-sdk` is also what `infra/specification.rs`'s
# `TypesRegistrySpecificationManager` resolves through, and `event-broker-sdk`'s
# `gts` module is where the GTS base-type constants live rather than duplicated
# `gts_id!(...)` literals.
event-broker-sdk = { workspace = true }
gts = { workspace = true }
types-registry-sdk = { workspace = true }

cluster = { workspace = true }
cluster-sdk = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
rand = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
bytes = { workspace = true }
jsonschema = { workspace = true }
toolkit-stable-hash = { workspace = true }
http-body-util = { workspace = true }
# `infra/metrics.rs`: the ingest outbox's retry and stall metrics, on the
# global `MeterProvider` the host installs.
opentelemetry = { workspace = true }

# `bootstrap` feature: `toolkit::bootstrap::{AppConfig, run_server}`, used
# only by `src/bin/server.rs` (eb-single-process-implementation D7) -
# the library target itself doesn't need it, but Cargo features are
# crate-wide, matching how `apps/cf-gears-example-server` depends on it.
toolkit = { workspace = true, features = ["bootstrap"] }
toolkit-security = { workspace = true }
# `Iso8601Duration`, to parse a resolved retention trait into a real duration
# rather than passing a string through to the API.
toolkit-utils = { workspace = true, features = ["serde", "schemars"] }
toolkit-canonical-errors = { workspace = true, features = ["axum", "utoipa"] }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-macros = { workspace = true }
utoipa = { workspace = true }
authz-resolver-sdk = { workspace = true, features = ["rest-client"] }
authz-resolver = { workspace = true }
types-registry = { workspace = true }
# GTS ids and schema metadata used by domain authorization.
toolkit-gts = { workspace = true }
# `domain/ingest.rs`'s `subject_type_allowed`/`domain/specification.rs`'s
# `validate_allowed_subject_types` need `GtsIdPattern`/`GtsId::matches_pattern`
# directly - `toolkit-gts` re-exports `GtsId`/`GtsInstanceId`/`GtsSchema` but

# Pooled outbound HTTP/1 client for the dispatcher's forwards, called from
# ordinary axum handlers (design.md D7). The shared upstream engine
# (ADR toolkit/0004) gives keep-alive pooling, idle-read timeouts and outbound
# framing hygiene.
toolkit-http-proxy = { workspace = true }

# Database - SeaORM (driver features come from toolkit-db), for the
# SpecificationManager cache, Storage's durable namespaces and the ingest
# outbox (eb-single-process-implementation). The gear's database may be
# SQLite, PostgreSQL or MySQL/MariaDB (DESIGN `cpt-cf-evbk-constraint-multi-sql`),
# so all three drivers are linked. All DB access goes
# through SecureORM (`toolkit_db::secure`); raw connections are never held by
# gear code. `toolkit_db::outbox` (same crate) backs the ingest-side
# transactional outbox (design.md D5) - the same generic library the SDK's
# client-side `ProducerOutbox` already uses, here on the opposite
# (server-enqueue) side.
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite", "pg", "mysql"] }
toolkit-db-macros = { workspace = true }

# Optional, enabled by `test-utils`: the harness's router-driving side modules
# (`test_support::{request, response}`) build `http::Request`s and drive the
# router via `tower::ServiceExt::oneshot`. Also dev-deps, for this crate's own
# `#[cfg(test)]` tests.
http = { workspace = true, optional = true }
tower = { workspace = true, optional = true }

# CLI for the standalone binary (src/bin/server.rs), mirroring
# apps/cf-gears-example-server's Cli shape.
clap = { workspace = true }

# `src/bin/server.rs`-only: linked so their `inventory::submit!` gear/plugin
# registrations are present in the binary. `event_broker` itself needs
# `cluster`/`authz-resolver`/`types-registry` (already deps above) at
# compile time for its own domain code; `api-gateway`/`authn-resolver` are
# needed only for the binary's AuthN pipeline and
# have no compile-time API surface this crate's library code calls, so they
# (and the concrete plugins) are declared here but only ever referenced from
# `src/bin/server.rs`, never from `src/`.
api-gateway = { workspace = true }
authn-resolver = { workspace = true }
static-authn-plugin = { workspace = true }
static-authz-plugin = { workspace = true }
standalone-cluster-plugin = { workspace = true }
# The storage backends, injected at wiring as providers (`module.rs`), the way
# the cluster gear injects its cache providers. The gear links them but knows
# only the `backend::Backend` trait behind them; the test harness runs on memory.
kafka-event-broker-plugin = { workspace = true }
memory-event-broker-plugin = { workspace = true }
mysql-event-broker-plugin = { workspace = true }
postgres-event-broker-plugin = { workspace = true }
sqlite-event-broker-plugin = { workspace = true }

[[bench]]
name = "partition_cache"
harness = false

[[bench]]
name = "delivery"
harness = false

[dev-dependencies]
# The crate itself with `test-utils`, as oagw does: every `tests/` binary gets
# `test_support` (the in-process harness) with no `required-features`.
cf-gears-event-broker = { path = ".", features = ["test-utils"] }
# `tests/support/containers.rs`: the PostgreSQL and MySQL servers of the
# engine-matrix tests, on `libs/test-containers`' pinned tags.
test-containers = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
# `benches/partition_cache.rs` - the two hot paths of the per-partition cache
# were each once wrong in a way only a curve over a swept parameter reveals.
criterion = { workspace = true, features = ["html_reports"] }
# `test-util` backs the paused-clock session tests.
tokio = { workspace = true, features = ["macros", "rt", "process", "test-util"] }
tower = { workspace = true }
http = { workspace = true }
# An in-memory exporter to read back `infra/metrics.rs`'s instruments.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-test = { workspace = true }
# `tests/standalone_integration_tests.rs` (design.md D8, task group 10) -
# spawns the real `[[bin]]` as a subprocess and drives it over real HTTP,
# rather than in-process mocks.
reqwest = { workspace = true, features = ["json", "stream"] }
tempfile = { workspace = true }
# `types_registry_sdk::testing::MockTypesRegistryClient` - the SDK's own
# ready-made in-memory test double, reused rather than hand-rolled
# (`eb-gts-type-registration`).
types-registry-sdk = { workspace = true, features = ["test-util"] }
# `cf-gears-standalone-cluster-plugin` moved to [dependencies] above (also
# needed by src/bin/server.rs); regular dependencies are available to tests
# too, so no separate dev-dependency entry is needed here anymore.
