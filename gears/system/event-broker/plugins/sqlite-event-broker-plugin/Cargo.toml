[package]
name = "cf-gears-sqlite-event-broker-plugin"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SQLite storage backend plugin for the event-broker gear: a single-process event log in one database file"
keywords = ["constructorfabric", "cf-gears", "event-broker"]
categories = ["database"]
metadata.docs.rs.all-features = true

[lib]
name = "sqlite_event_broker_plugin"

[lints]
workspace = true

[dependencies]
# The `backend::Backend` contract this crate implements. This crate depends on
# the SDK only, never on the gear.
event-broker-sdk = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
toolkit-gts = { workspace = true }
toolkit-utils = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
# Direct sqlx, not `libs/toolkit-db`: see the crate docs in `src/lib.rs`.
sqlx = { workspace = true, features = ["sqlite", "migrate", "macros", "chrono", "uuid"] }

[dev-dependencies]
# Path only, no version: the suite is not published.
event-broker-backend-conformance = { package = "cf-gears-event-broker-backend-conformance", path = "../event-broker-backend-conformance" }
event-broker-backend-bench = { package = "cf-gears-event-broker-backend-bench", path = "../event-broker-backend-bench" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }

# Needs no server: it runs over a file in a temporary directory, so it is not
# gated behind a feature the way the server-backed plugins' benches are.
[[bench]]
name = "backend"
harness = false
