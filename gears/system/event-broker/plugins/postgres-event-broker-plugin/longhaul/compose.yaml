# The PostgreSQL server the long-haul run writes to and the operator watches
# (longhaul/README.md). The tag follows libs/test-containers' POSTGRES_TAG, and
# GEARS_TEST_PG_TAG overrides it the same way.
#
#   docker compose -f longhaul/compose.yaml up -d
#   EB_LONGHAUL_URL=postgres://postgres:postgres@127.0.0.1:54329/events
services:
  pg:
    image: postgres:${GEARS_TEST_PG_TAG:-18-alpine}
    container_name: evbk-longhaul-pg
    ports: ["54329:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
      # A database of the run's own, apart from the `postgres` maintenance
      # database; created only when the volume is first initialised.
      POSTGRES_DB: events
    # Lock waits over 200 ms and statements over 200 ms go to the container's
    # log (`docker compose logs -f pg`); pg_stat_statements ranks the plugin's
    # queries by total time. The invariant check reads every segment in one
    # snapshot, a lock each: thousands of segments outgrow the default 64
    # locks per transaction. 600 connections, as the tests' own container
    # (tests/common/mod.rs), lets the conformance suites run in parallel here.
    #
    # Sized for sustained inserts, after the mq-perf setup: with the defaults
    # (max_wal_size 1GB, shared_buffers 128MB) a run of tens of thousands of
    # events/s forces a checkpoint every few seconds, and the full-page
    # images written after each one halve the throughput. The WAL is sized
    # so checkpoints come from the timer, compressed, and spread over it;
    # the background writer and autovacuum keep up with the insert rate.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c log_lock_waits=on
      -c deadlock_timeout=200ms
      -c log_min_duration_statement=200
      -c track_io_timing=on
      -c max_connections=600
      -c max_locks_per_transaction=1024
      -c shared_buffers=2GB
      -c max_wal_size=16GB
      -c wal_compression=lz4
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
      -c bgwriter_delay=50ms
      -c bgwriter_lru_maxpages=4000
      -c bgwriter_lru_multiplier=4
      -c autovacuum_max_workers=6
      -c autovacuum_vacuum_cost_limit=8000
      -c autovacuum_vacuum_scale_factor=0.01
      -c jit=off
    # shared_buffers above the default 64MB of /dev/shm.
    shm_size: 2560m
    volumes:
      - evbk-longhaul:/var/lib/postgresql
      # observe.sql and the invariants it loads, at the same relative paths
      # as in the repository, for psql inside the container.
      - ./:/evbk/longhaul:ro
      - ../tests:/evbk/tests:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "events"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  evbk-longhaul: {}
