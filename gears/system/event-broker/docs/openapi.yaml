# Created: 2026-05-11 by Constructor Tech

openapi: 3.1.0
info:
  title: Event Broker API
  version: 1.0.0
  description: |
    Event Broker is a tenant-scoped event streaming primitive for Gears modules.
    Producers publish typed events to topics via single or batch submissions; consumers
    subscribe via `multipart/mixed` streaming (`/v1/events:stream`) or browser-native
    Server-Sent Events (`/v1/events:sse`) — see `features/0004-consumption-transport.md`
    — and receive events filtered by type, subject, and per-member filter expressions.

    This file is the authoritative machine-readable public contract for the Event Broker
    v1 REST surface. PRD.md and DESIGN.md intentionally summarize behavior and refer
    here for wire shapes, field semantics, and HTTP-level error mapping.

servers:
  - url: https://api.example.com

tags:
  - name: events
    description: Producer-side event submission (single + batch) and consumer-side streaming (`:stream`, `:sse`).
  - name: producers
    description: Producer registration and idempotent-chain lifecycle.
  - name: topics
    description: Topic introspection and storage-segment metadata.
  - name: event-types
    description: Event-type introspection (read-only; registration via SDK/types_registry).
  - name: consumer-groups
    description: Consumer group registry (anonymous create path + read/list/delete).
  - name: subscriptions
    description: Consumer subscription lifecycle - JOIN, seek, leave.

paths:

  /v1/events:
    post:
      tags: [events]
      summary: Publish a single event
      description: |
        Enqueue one event into the per-topic ingest outbox. The broker resolves the
        owning topic from the `topic` trait on the event `type`'s resolved GTS type
        schema. Publish is asynchronous: `202 Accepted` once the event is durably
        enqueued in ingest's own store, after which the event is delivered to the
        storage backend out of band. Offset is assigned asynchronously by the
        storage backend and is never returned inline.

        Synchronous persistence - holding the response until the backend confirms
        the event is persisted - is requested with the standard `Prefer: wait=N`
        header (RFC 7240, N capped by configuration): `201 Created` once the event
        is stored, `202 Accepted` if N elapses first (the event stays enqueued and
        is stored later), `200 OK` when the event is a duplicate. `Prefer:
        respond-async` names the default (async) behaviour and is accepted as a
        no-op (still `202`).
      parameters:
        - name: Prefer
          in: header
          required: false
          description: >-
            RFC 7240 preference selecting synchronous persistence. `wait=N` asks
            the broker to hold the response until the event is stored, N seconds
            capped by configuration; a bare `wait` uses the cap and a non-numeric
            value is rejected (`400`). `respond-async` is the default (no-op).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/gts.cf.core.events.event.v1~.schema.json"
      responses:
        "201":
          description: >-
            Stored - `Prefer: wait=N` was satisfied: the backend has the event.
            No body.
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        "202":
          description: >-
            Accepted, durably enqueued in the outbox (or `Prefer: wait=N` elapsed
            before the backend stored the event).
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        "200":
          description: >-
            Idempotent duplicate - a lost-ack retry of the producer chain's current
            head. The event is already durable; nothing is written and the response
            carries no body.
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        "400":
          description: >-
            Validation error (read-only/unknown field, `meta.ingest_tenant` and
            `meta.ingest_actor` included, which only the broker stamps; malformed `trace_parent`,
            a `meta` block its producer's mode does not admit
            (`MetaWithoutProducerId`, `ChainModeFieldsMissing`,
            `MonotonicModeFieldsViolation`) or a `meta.version` newer than the
            broker supports (`UnknownMetaVersion`), etc.), the event's
            resolved partition key over 1024 bytes in its JSON string form
            (reason `partition_key_too_long`, field `events[0].partition_key`;
            the key itself is not echoed), a malformed `Prefer: wait` value
            (not a non-negative whole number of seconds), or `InvalidTenant`
            (the event's `subject_tenant` is the nil UUID; refused before any
            authorization), or `InvalidSubjectOwner` (the event's `subject_owner` is the
            nil UUID; refused with it). An event type whose partition key is
            `/subject_owner` refuses an event with no owner (`PartitionKeyUnresolved`),
            after its `data` is validated (`422` first).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            Forbidden. `TenantIdNotAuthorized` - the caller may not publish into
            the event's `subject_tenant`: the tenant check (`produce` on the tenant
            scope, rooted at the event's tenant, barriers respected) and the
            barrier check (`produce_ignore_barrier` on the event type, same
            root, barriers ignored) are both denied. `NotAuthorizedToProduce` -
            the type check (`produce` on the event type, rooted at the caller's
            own tenant) is denied. The body is the generic permission-denied
            body naming the request resource; it does not carry the code.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Topic, event type or producer not registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: >-
            SequenceViolation - the event neither advances nor duplicates the
            producer chain's committed `last_sequence`. `context.resource_name`
            names the resolved topic; the `sequence_mismatch` violation's
            `description` reads `index=0 producer=<id> topic=<topic>
            last_sequence=<n>`, the committed head last, so the producer can resync
            (re-read `GET /v1/producers/{id}/cursors`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: >-
            EventTooLarge - the event's encoding is over the 60 KiB (61,440-byte)
            per-event limit, checked after the envelope field checks (`source`,
            `subject`, `trace_parent`, `type`) and before the event type is
            resolved. An `event_too_large` field violation on `events[0]`, whose
            description gives the measured bytes and the limit. Nothing is written.
            Or Payload Too Large - the request body is over the request body limit
            (api-gateway `defaults.body_limit_bytes`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >-
            SchemaViolation - the event `data` does not satisfy the event type's
            `data_schema`. `context.resource_name` names the resolved topic and the
            `(payload)`/`schema_validation` field violation says what is wrong
            without echoing submitted content.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed (the PDP could not answer), or a tenant, barrier or
            type check whose answer does not compile. Nothing is enqueued.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the topic is not yet provisioned, the
            broker's database or ingest pipeline is unavailable (including a
            producer-chain write that exhausted its contention retries), or no ingest
            instance is reachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/events:batch:
    post:
      tags: [events]
      summary: Publish a batch of events (atomic per topic)
      description: |
        Atomic per-topic batch of up to 100 events. All-or-nothing per topic.
        Each event's owning topic is resolved from the `topic` trait on its `type`;
        a batch whose event types resolve to more than one topic is rejected.

        Events may carry several producer ids, and stateless events. The chained
        and monotonic events are split into runs, one per `(producer, topic)`,
        each keeping request order, and each run is checked against its chain's
        committed `last_sequence`: a chained run advances when its first event
        links to the head, is a duplicate prefix through the event whose
        `sequence` equals the head, and is otherwise a `412`; a monotonic run
        skips its leading events with `sequence <= last_sequence`. Duplicates are
        not enqueued; the rest of the batch is. Every answer is status only.

        `Prefer: wait=N` (RFC 7240, N capped by configuration) applies to the
        batch as a whole, with the status codes of a single publish: `201` once
        every admitted event is stored, `202` if N elapses first, `200` when every
        event is a duplicate.
      parameters:
        - name: Prefer
          in: header
          required: false
          description: >-
            RFC 7240 preference selecting synchronous persistence. `wait=N` asks
            the broker to hold the response until every admitted event is stored,
            N seconds capped by configuration; a bare `wait` uses the cap and a
            non-numeric value is rejected (`400`). `respond-async` is the default
            (no-op).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    $ref: "./schemas/gts.cf.core.events.event.v1~.schema.json"
                  minItems: 1
                  maxItems: 100
      responses:
        "201":
          description: >-
            Stored - `Prefer: wait=N` was satisfied: the backend has every event.
            No body.
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        "202":
          description: >-
            Accepted (async; every event that is not a duplicate durably
            enqueued, or `Prefer: wait=N` elapsed before they were stored). A batch
            carrying any stateless event is never a duplicate.
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        "200":
          description: >-
            Every event of the batch is a duplicate - a lost-ack resend. Nothing
            is written and the response carries no body.
          headers:
            Preference-Applied:
              $ref: "#/components/headers/PreferenceApplied"
        "400":
          description: >-
            Validation error, or a batch run rule broken. An envelope field
            violation (for example a malformed `trace_parent`) names the bare
            field, as on `POST /v1/events`, and rejects the whole batch. A run
            rule violation is a `field_violations` entry:
            `empty_batch` (no events; field `events`), `duplicate_event_id` (an
            `id` repeated within the batch; field `events[<index>].id`, the
            repeat), `malformed_run` (a chained run's events do not link - every
            event has `sequence > previous` and each after the first has
            `previous` equal to the prior event's `sequence` - or a monotonic
            run's sequences do not strictly increase; field
            `events[<index>].meta`, the first offending event). The run rules are
            checked before any chain state is read. An event whose resolved
            partition key is over 1024 bytes in its JSON string form is a
            `partition_key_too_long` field violation on
            `events[<index>].partition_key`. An event whose `subject_tenant` is the nil
            UUID is an `InvalidTenant` error, and one whose `subject_owner` is the
            nil UUID an `InvalidSubjectOwner` error, each naming the event as
            `event <index>: ...` and refused before any event is authorized. A
            `meta.ingest_tenant` or `meta.ingest_actor` member is an unknown field
            (`InvalidBody`): only the broker stamps them. An
            event whose `meta` block breaks its producer's mode, or whose
            `meta.version` is newer than the broker supports, is a
            `MetaWithoutProducerId`, `ChainModeFieldsMissing`,
            `MonotonicModeFieldsViolation` or `UnknownMetaVersion` error; the
            detail does not name the event. A malformed `Prefer: wait` value
            (not a non-negative whole number of seconds) is also `400`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            Forbidden. `TenantIdNotAuthorized` - the caller may not publish into
            the event's `subject_tenant`: the tenant check (`produce` on the tenant
            scope, rooted at the event's tenant, barriers respected) and the
            barrier check (`produce_ignore_barrier` on the event type, same
            root, barriers ignored) are both denied for an event of the batch.
            `NotAuthorizedToProduce` - the type check (`produce` on the event
            type, rooted at the caller's own tenant) is denied for an event of
            the batch. Either refuses the whole batch. The body is the generic
            permission-denied body naming the request resource; it does not
            carry the code.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Topic, event type or producer not registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: >-
            SequenceViolation - atomic batch rejection: a run neither advances nor
            duplicates its chain's committed `last_sequence`. Nothing is enqueued.
            `context.resource_name` names the topic; the `sequence_mismatch`
            violation's `description` reads `index=<n> producer=<id>
            topic=<topic> last_sequence=<n>` - the position of the run's first
            event, its producer and topic, and the committed head, last.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: >-
            A `batch_too_large` field violation on `batch.count` (more events than
            the configured max) or `batch.bytes` (total payload over the
            configured byte ceiling), or an `event_too_large` field violation on
            `events[<index>]` (an event's encoding over the 60 KiB per-event
            limit), or Payload Too Large (the request body over the request body
            limit, api-gateway `defaults.body_limit_bytes`). Nothing is enqueued.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: SchemaViolation - an event's `data` does not satisfy its event type's `data_schema` (atomic batch rejection)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed (the PDP could not answer), or a tenant, barrier or
            type check whose answer does not compile. Nothing is enqueued.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the batch's topic is not yet provisioned,
            the broker's database or ingest pipeline is unavailable (including a
            producer-chain write that exhausted its contention retries), or no ingest
            instance is reachable. Nothing is enqueued.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/events:stream:
    get:
      tags: [events]
      summary: Multipart event consumption (default transport)
      description: |
        The default consumption endpoint, framing delivery as `multipart/mixed`;
        `/v1/events:sse` serves the same frame kinds as Server-Sent Events.
        Long-lived: the response stays open and emits frames as events arrive;
        heartbeat frames keep intermediaries from cutting idle connections.
        Wire format is `multipart/mixed; boundary=<...>` carried over
        `Transfer-Encoding: chunked`. Each multipart part carries exactly one
        frame whose JSON body has a top-level `kind` of `event`, `heartbeat`,
        `topology`, or `control`. See `features/0004-consumption-transport.md`.

        Frame shapes:
        - `{ "kind": "event", "payload": { /* one event */ } }`: the payload is the event as
          read (the `gts.cf.core.events.event.v1~` schema with its `readOnly` fields and no
          `meta`); it carries no `topic`.
        - `{ "kind": "heartbeat", "at": "<iso8601>" }`
        - `{ "kind": "topology", "topology_version": <int>, "assigned": [{ "topic", "partition", "offset": <i64>, "last_examined": <i64> }] }`
          - the full current assignment snapshot; emitted once at open (baseline,
          the first frame). For both transports, a continuing stream reports the latest
          observed streamable generation on strict loss or a version-only change. The
          non-terminal snapshot includes retained positions. Generations may coalesce.
          A newer same-set generation seen during open can follow the baseline.
        - `{ "kind": "control", "code": "progress" | "terminal", "positions": [{ "topic", "partition", "offset": <i64>, "last_examined": <i64> }], "reason": "rebalanced" | "lose_all" | "teardown" }`
          is the position carrier. `code: "progress"` is a non-terminal mid-stream report
          of the partitions whose filter rejected at least the drift threshold of events
          since they last reported; it carries no `reason`. `code: "terminal"` is the LAST
          frame of the stream and always carries a `reason`, with the final positions of
          every partition the stream was reading when it ended: on a gain
          (`"rebalanced"`), on a lose-all (`"lose_all"`) or when the broker tears the
          stream down (`"teardown"`, see below). The broker then closes the stream
          gracefully; a non-transactional SDK consumer records each partition's
          `last_examined` in its offset store (a transactional one only traces the
          positions), and every SDK consumer re-JOINs. A partition loss is NOT
          control-carried - it is an in-band `topology` frame.

        Cursor seed/advance is via `POST /v1/subscriptions/{id}:seek` (pre-stream
        only) — this stream endpoint is delivery-only. Browser consumers wanting
        Server-Sent Events use `/v1/events:sse` instead.

        Opening checks, in order: the caller's identity (a caller whose subject or tenant
        id is the nil UUID answers `403 TenantIdNotAuthorized` before any read or PDP
        call); the subscription (`404 SubscriptionNotFound` when it is not a group member)
        and the caller's right to consume as its tenant (`403 TenantIdNotAuthorized`); the
        joiner (`403 SubscriptionNotOwned` when the caller is not the principal that joined
        the subscription); the consumer group (`404 ConsumerGroupNotFound` when it is no
        longer registered) and the policy's `consume` on it (`403 ConsumerGroupNotAuthorized`
        when refused, `500` when its answer does not compile or its evaluation fails); the
        cursors (`409 PositionsNotSet`); the stream lease (`409 StreamingInProgress`);
        then the member's consume scope. The open reuses the scope the member holds when
        it was evaluated for the same principal and none of its interest groups has
        expired. Otherwise it evaluates each interest group as JOIN does, one after
        another, and reuses a barrier-right or consume-scope answer that JOIN or an
        earlier open got within `streaming.authz_scope_ttl_secs` (default 60): a reused
        barrier right skips that question, and a reused consume scope skips both the
        consume scope and the tenant check. No exact-selector check runs at open.

        An open stream ends with a `terminal` control frame whose `reason` is `teardown`
        when the member's consume scope is cleared (for example, a renewal of an interest
        group is refused, or the member is gone) or expires (it reaches the end of its
        window without a renewal), when reads stay unanswerable for longer than the
        broker's tolerance, or when deciding a batch of events fails (for example, the
        authorization decision cannot be made).
      parameters:
        - name: subscription
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Long-lived multipart/mixed event stream (Transfer-Encoding chunked).
          content:
            multipart/mixed:
              schema:
                description: |
                  Stream of multipart parts. Each part has `Content-Type: application/json`
                  and a JSON body with top-level `kind` of `event | heartbeat | topology | control`.
                type: string
        "400":
          description: >-
            Invalid Argument - a missing or invalid `subscription`, or an
            unrecognised query parameter. Only `subscription` is recognised; a
            legacy `timeout`/`collect` parameter is rejected, not ignored.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: |
            `TenantIdNotAuthorized`: the caller's subject or tenant id is the nil UUID, or
            the caller may not consume as the subscription's tenant. When the open evaluates
            an interest group, the codes JOIN answers for a refused barrier right or consume
            scope: `TenantIdNotAuthorized` or `TopicNotAuthorized`.
            `SubscriptionNotOwned`: the caller is not the principal that joined the
            subscription. `ConsumerGroupNotAuthorized`: the policy refuses `consume` on the
            subscription's consumer group.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >-
            SubscriptionNotFound - the subscription is not a group member, or its member
            left the group while the stream was opening (for example reaped after an open
            that outlasted the member's `join_timeout`); the consumer must re-JOIN with a
            new subscription.
            `ConsumerGroupNotFound` - the subscription's consumer group is no longer
            registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "406":
          description: |
            Not Acceptable. The client's `Accept` header excludes `multipart/mixed`.
            Response body lists the supported media types.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            Two `code`s, distinguished in the body:
            `PositionsNotSet` - one or more assigned `(topic, partition)` pairs have
            no committed cursor for the subscription's group; the consumer SHALL
            SEEK the listed partitions via `POST /v1/subscriptions/{id}:seek` and
            retry. The body carries one `positions_not_set` violation per unseeded
            partition, with `subject` `<topic>:<partition>` and `description` "call POST
            /v1/subscriptions/<subscription-id>:seek before re-opening the stream".
            A well-behaved SDK seeds positions before opening the stream and should
            not normally observe this.
            `StreamingInProgress` - a stream is already open on this subscription:
            a second `:stream` or `:sse` open is refused, and so is a SEEK; a read or a
            LEAVE of the subscription is served. The existing stream is unaffected.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: |
            SubscriptionTerminated - the subscription has already terminated
            (gain, lose-all, LEAVE/DELETE, or lease expiry). Returned on any reuse
            of a terminated id (not yet answered, tracked in #5977; see
            "Topology-Change Handling (Rebalance)" in `features/0004-consumption-transport.md`
            for what a reused id answers today); the consumer re-JOINs for a new
            subscription.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed, a tenant-check answer (the caller's right to consume as
            the subscription's tenant) that does not compile, a group-check answer (the
            policy's `consume` on the consumer group) that does not compile, or a member scope
            that another writer replaced twice while the stream was opening.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database is unavailable: the consumer
            group read, a cursor read, or the event-type candidate query of an interest group the
            open evaluates.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/events:sse:
    get:
      tags: [events]
      summary: Server-Sent Events consumption
      description: |
        Browser-native `text/event-stream` consumption endpoint. Same frame
        kinds as `/v1/events:stream` (`event | heartbeat | topology | control`),
        but framed as SSE events with the `event:` line carrying the kind and
        the JSON payload on a `data:` line. A reopened stream starts each assigned
        partition at the group cursor the last SEEK set (`POST /v1/subscriptions/{id}:seek`),
        not at SSE's `Last-Event-ID`. Disabled by default in v1; enabled via deployment
        configuration (not yet implemented, tracked in #5984). See
        `features/0004-consumption-transport.md`.
      parameters:
        - name: subscription
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Long-lived text/event-stream
          content:
            text/event-stream: {}
        "400":
          description: >-
            Invalid Argument - a missing or invalid `subscription`, or an
            unrecognised query parameter. Only `subscription` is recognised; a
            legacy `timeout`/`collect` parameter is rejected, not ignored.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: As `/v1/events:stream`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: As `/v1/events:stream`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >-
            SubscriptionNotFound or ConsumerGroupNotFound, as `/v1/events:stream`; or the
            transport is disabled in deployment (not yet implemented, tracked in #5984).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "406":
          description: >-
            Not Acceptable. The client's `Accept` header excludes `text/event-stream`; the
            `detail` names the media type this endpoint serves.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            As `/v1/events:stream`: `PositionsNotSet` (an assigned partition has no
            committed cursor) or `StreamingInProgress` (a stream is already open on this
            subscription).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: >-
            SubscriptionTerminated - the consumer must re-JOIN (not yet answered, tracked in
            #5977; see "Topology-Change Handling (Rebalance)" in
            `features/0004-consumption-transport.md` for what a reused id answers today).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: As `/v1/events:stream`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: As `/v1/events:stream`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/producers:
    post:
      tags: [producers]
      summary: Register a producer and obtain a broker-minted producer id
      description: |
        Mints a producer `id` (UUID) bound to the calling principal. The `mode` field
        determines the dedup protocol: `chained` (chain-linked sequence) or `monotonic`
        (monotonically increasing sequence). Stateless producers do not register.
        Re-registration mints a fresh producer `id`; the broker does NOT reuse prior ids.
        A `client_agent` (RFC 9110 User-Agent grammar) is required and immutable; the broker
        persists it on the producer row and echoes it on registration, cursor, and reset
        responses (per ADR-0004).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, client_agent]
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum: [chained, monotonic]
                  description: Dedup protocol mode for this producer.
                client_agent:
                  type: string
                  pattern: '^[\x20-\x7E]+$'
                  minLength: 1
                  maxLength: 256
                  description: >-
                    Required, immutable RFC 9110 User-Agent grammar string (ASCII, 1-256
                    bytes) identifying the producer client. Per ADR-0004.
      responses:
        "201":
          description: Producer registered; id minted
          headers:
            Location:
              description: URL of the producer resource (`/v1/producers/<id>`)
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [id, mode, client_agent]
                properties:
                  id:
                    type: string
                    format: uuid
                  mode:
                    type: string
                    enum: [chained, monotonic]
                    description: Echoed dedup protocol mode.
                  client_agent:
                    type: string
                    description: Echoed client_agent from the request (immutable).
        "400":
          description: >-
            Invalid Argument - a `client_agent` that is not printable ASCII, is
            empty or over 256 bytes, or breaks the RFC 9110 User-Agent grammar
            (a field violation naming `client_agent`, reason `ascii_only`,
            `field_too_long` or `user_agent_grammar`). A body that is not valid JSON
            answers a generic `400` (an `about:blank` problem naming no field). A missing,
            unknown or mistyped field, an unknown `mode` included, answers `422`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            Forbidden. `TenantIdNotAuthorized` - the tenant check (`produce` on the tenant
            scope, rooted at the caller's own tenant, barriers respected) is denied; asked
            after the `400` checks and before the producer is written.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: >-
            Payload Too Large - the request body is over the request body limit (api-gateway
            `defaults.body_limit_bytes`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: >-
            Unsupported Media Type - the request `Content-Type` is missing or is not a JSON media
            type (`application/json` or an `application/<subtype>+json` type).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >-
            Unprocessable Entity - the body is valid JSON but does not fit the request shape:
            a missing, unknown or mistyped field, or an unknown `mode` value.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example the tenant check's
            evaluation failed (the PDP could not answer) or its answer does not compile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database is unavailable: the producer
            insert.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/producers/{id}/cursors:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Producer id (broker-minted UUID).
    get:
      tags: [producers]
      summary: Read per-topic last_sequence for a registered producer
      description: |
        Returns the broker's known `last_sequence` of the producer's chain on each topic
        it has published to, for desync recovery. The chain is kept per
        `(producer, topic)`; no partition is part of it (ADR-0004 "Chain Scope"). Principal-bound - only the registering principal may
        call this. `topics` is empty if the producer has not yet published any events. The
        response is an object (not a bare array) so it carries the echoed `id` /
        `client_agent` and stays extensible.
      responses:
        "200":
          description: Producer cursors (topics may be empty)
          content:
            application/json:
              schema:
                type: object
                required: [id, client_agent, topics]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
                  client_agent:
                    type: string
                    description: Echoed producer client_agent (per ADR-0004).
                  topics:
                    type: array
                    description: Per-topic cursors; empty until the producer publishes.
                    items:
                      type: object
                      required: [topic, last_sequence]
                      additionalProperties: false
                      properties:
                        topic: { type: string }
                        last_sequence: { type: integer, format: int64, minimum: 0 }
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            Forbidden. After the `404`: `TenantIdNotAuthorized` - the tenant check (`produce`
            on the tenant scope, rooted at the producer's tenant, barriers respected) is
            denied; then `ProducerNotOwned` - the calling principal does not own this
            producer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: ProducerNotFound
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example the tenant check's
            evaluation failed (the PDP could not answer) or its answer does not compile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database is unavailable: the producer read,
            or the producer cursor read.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/producers/{id}:reset:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Producer id (broker-minted UUID).
    post:
      tags: [producers]
      summary: Reset the ingest-side chain state for a producer
      description: |
        Operator-driven chain reset. Clears `event_broker_producer_sequence` rows and emits an audit
        record. When the request body is absent or empty, the producer's chain on every
        topic is cleared. When `topic` is present, only that topic's chain is cleared.
        Principal-bound — only the registering principal may call this.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                topic: { type: string }
      responses:
        "200":
          description: Reset applied; audit record emitted
        "400":
          description: >-
            Invalid Argument - the path segment is not `<producer-id>:reset` (`InvalidPath`),
            or a non-empty body that is not valid JSON or does not fit the request shape, an
            unknown field included (`InvalidBody`). Nothing is reset.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            Forbidden. After the `404`: `TenantIdNotAuthorized` - the tenant check (`produce`
            on the tenant scope, rooted at the producer's tenant, barriers respected) is
            denied; then `ProducerNotOwned` - the calling principal does not own this
            producer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: ProducerNotFound
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: >-
            Payload Too Large - the request body is over the request body limit (api-gateway
            `defaults.body_limit_bytes`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example the tenant check's
            evaluation failed (the PDP could not answer) or its answer does not compile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database is unavailable: the producer read,
            or the producer chain delete.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/topics:
    get:
      tags: [topics]
      summary: List topics visible to the caller
      description: |
        Returns a paginated, filterable list of the topics the caller may read: it may
        consume the topic, or publish one of its event types, in its own tenant (producers
        read specs to validate; consumers may read them too, for example for code
        generation). `$filter` applies first; a topic the caller may not read is left out,
        with no error. To retrieve a single topic by its GTS identifier use
        `$filter=id eq '<gts-id>'`. No `GET /v1/topics/{id}` path exists.
        Items are `Topic` DTOs projected from each topic's registered instance. Topics are
        registered in `types_registry` by their owning gear - no creation path exists in the
        REST API.
      parameters:
        - name: $filter
          in: query
          schema: { type: string }
          description: OData v4 filter expression. Filterable fields — `id` (eq/ne/in).
        - name: $orderby
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque pagination token from a previous response.
      responses:
        "200":
          description: Page of topics
          content:
            application/json:
              schema:
                type: object
                required: [items, page_info]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Topic"
                  page_info:
                    $ref: "#/components/schemas/PageInfo"
        "400":
          description: Invalid $filter expression or cursor mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example a read check
            whose evaluation failed (the PDP could not answer). A check that is denied or
            whose answer does not compile only leaves the item out.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database is unavailable: the topic list
            read, or a topic's event type read.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/topics/segments:
    get:
      tags: [topics]
      summary: Get storage segments for a (topic, partition)
      description: |
        Returns the backend's segment manifest for a specific (topic, partition).
        Backend-specific in shape; consumers treat `segments[]` entries as opaque
        except for the documented envelope. See
        `features/0003-topic-segment-introspection.md` for use cases and pagination
        semantics. The caller must be able to read the topic (consume it, or publish one of
        its event types, in its own tenant); a caller that may not gets `403
        TopicNotAuthorized` before the topic is looked up, so it cannot tell a registered
        topic from a missing one.
      parameters:
        - name: topic
          in: query
          required: true
          schema: { type: string }
        - name: partition
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: $orderby
          in: query
          schema: { type: string, default: "start_sequence asc" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Segment manifest
          content:
            application/json:
              schema:
                type: object
                required: [topic, partition, start_sequence, end_sequence, start_time, end_time, segments]
                properties:
                  topic: { type: string }
                  partition: { type: integer }
                  start_sequence: { type: integer, format: int64 }
                  end_sequence: { type: integer, format: int64 }
                  start_time:
                    type: ["string", "null"]
                    format: date-time
                  end_time:
                    type: ["string", "null"]
                    format: date-time
                  segments:
                    type: array
                    items: { type: object, additionalProperties: true }
        "400":
          description: InvalidPartition
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            TopicNotAuthorized - the caller may neither consume the topic nor publish any of
            its event types in its own tenant (a check that is denied or whose answer does
            not compile). Answered before the topic lookup.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: TopicNotFound
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example the read check's
            evaluation failed (the PDP could not answer).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database or the topic's storage backend is
            unavailable: the topic's event type read, the topic lookup, or the segment read on the
            backend.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/event-types:
    get:
      tags: [event-types]
      summary: List event types visible to the caller
      description: |
        Returns a paginated, filterable list of the event types the caller may read: it may
        consume the type's topic, or publish the type, in its own tenant. `$filter` applies
        first; a type the caller may not read is left out, with no error. Event types are registered
        via the in-process SDK and types_registry — no creation path exists in the REST API.
        To retrieve a single event type by GTS id use `$filter=id eq '<gts-id>'`. Items are
        `EventType` DTOs projected from each event type's registered type schema, `data_schema`
        included.
      parameters:
        - name: $filter
          in: query
          schema: { type: string }
          description: OData v4 filter expression. Filterable fields — `id` (eq/ne/in), `topic` (eq/ne).
        - name: $orderby
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque pagination token from a previous response.
      responses:
        "200":
          description: Page of event types
          content:
            application/json:
              schema:
                type: object
                required: [items, page_info]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventType"
                  page_info:
                    $ref: "#/components/schemas/PageInfo"
        "400":
          description: Invalid $filter expression or cursor mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example a read check
            whose evaluation failed (the PDP could not answer). A check that is denied or
            whose answer does not compile only leaves the item out.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the specification store is unavailable, or
            no ingest instance is reachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/consumer-groups:
    post:
      tags: [consumer-groups]
      summary: Register an anonymous consumer group (broker-minted id)
      description: |
        Mints `gts.cf.core.events.consumer_group.v1~<uuid>` server-side. The request
        body MUST NOT carry an `id`. The minted identifier is returned in the
        response body and the `Location` header. Caller distributes it to its
        consumer fleet via its own coordination mechanism (DB, ConfigMap, env var).
        Only the principal that created the group (its subject, in its tenant) may JOIN it
        (`403 ConsumerGroupNotOwned`), so the fleet runs as that principal.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./schemas/gts.cf.core.events.consumer_group.v1~.schema.json#/definitions/CreateRequest"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the newly created consumer-group resource (`/v1/consumer-groups/<encoded-gts-id>`)
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "./schemas/gts.cf.core.events.consumer_group.v1~.schema.json"
        "400":
          description: >-
            Invalid Argument - a non-empty body that is not valid JSON or does not fit the
            request shape, a missing `client_agent` or an unknown or mistyped field included
            (`InvalidBody`); or a `client_agent` or `description` that is not printable ASCII
            within its byte length, or a `client_agent` that breaks the RFC 9110 User-Agent
            grammar (a field violation naming the field). No group is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            `TenantIdNotAuthorized` when the caller's subject or tenant id is the nil UUID,
            answered after the body checks (`400`) and before the PDP call;
            `ConsumerGroupNotAuthorized` when the caller lacks `consumer_group:define`
            permission. No group is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: >-
            Payload Too Large - the request body is over the request body limit (api-gateway
            `defaults.body_limit_bytes`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed (the PDP could not answer), or a define-check answer (the
            caller's `consumer_group:define` permission) that does not compile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database is unavailable: the consumer group
            insert.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      tags: [consumer-groups]
      summary: List consumer groups visible to the caller
      description: >-
        The list holds only the consumer groups the caller may consume: the anonymous
        groups of the tenants it may consume as, and the named groups whose group check
        (the policy's `consume` on the group) allows it.
      parameters:
        - name: $filter
          in: query
          schema: { type: string }
          description: "OData v4 filter expression. Filterable fields — `id` (eq/in), `kind` (eq)."
        - name: $orderby
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque pagination token from a previous response.
      responses:
        "200":
          description: Page of consumer groups
          content:
            application/json:
              schema:
                type: object
                required: [items, page_info]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "./schemas/gts.cf.core.events.consumer_group.v1~.schema.json"
                  page_info:
                    $ref: "#/components/schemas/PageInfo"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            `TenantIdNotAuthorized` when the caller's subject or tenant id is the nil UUID,
            answered before any read or PDP call.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed (the PDP could not answer), or a tenant-check answer (the
            caller's right to consume as an anonymous group's tenant) that does not compile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database is unavailable: the consumer group
            list read.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/consumer-groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Full GTS consumer-group identifier (URL-encoded).
    get:
      tags: [consumer-groups]
      summary: Read a registered consumer group
      responses:
        "200":
          description: Consumer group record
          content:
            application/json:
              schema:
                $ref: "./schemas/gts.cf.core.events.consumer_group.v1~.schema.json"
        "400":
          description: >-
            Invalid Argument - the `id` is not a valid GTS instance identifier: a field
            violation on `consumer_group` (reason `invalid_event_field`) that carries no part
            of the value. Answered before the named-group check, the group read and any
            authorization check.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            `TenantIdNotAuthorized` when the caller's subject or tenant id is the nil UUID
            (answered before any read or PDP call), or when the PDP denies the caller
            `consume` as the group's tenant.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: ConsumerGroupNotFound
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed (the PDP could not answer), or a tenant-check answer (the
            caller's right to consume as the group's tenant) that does not compile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          description: >-
            Unimplemented - the `id` is a named consumer group (a valid consumer-group id
            whose suffix is not a UUID); named groups are not yet implemented, tracked in
            #5702. Answered before the group is read or any authorization check.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database is unavailable: the consumer group
            read.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [consumer-groups]
      summary: Remove a consumer group from the registry
      description: >-
        Allowed only when the group has no active members; a member whose stream closed
        still counts until its `session_timeout` ends.
      responses:
        "204":
          description: Deleted
        "400":
          description: >-
            Invalid Argument - the `id` is not a valid GTS instance identifier: a field
            violation on `consumer_group` (reason `invalid_event_field`) that carries no part
            of the value. Answered before the named-group check, the group read and any
            authorization check.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            `TenantIdNotAuthorized` when the caller's subject or tenant id is the nil UUID
            (answered before any read or PDP call), or when the PDP denies the caller `manage`
            as the group's tenant; then `ConsumerGroupNotOwned` when the caller is not the
            principal that created the group (its subject, in its tenant).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: ConsumerGroupNotFound
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: ConsumerGroupHasActiveMembers
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed (the PDP could not answer), or a tenant-check answer (the
            caller's right to manage as the group's tenant) that does not compile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          description: >-
            Unimplemented - the `id` is a named consumer group (a valid consumer-group id
            whose suffix is not a UUID); named groups are not yet implemented, tracked in
            #5702. Answered before the group is read or any authorization check.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database is unavailable: the consumer group
            read, or the consumer group delete.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/subscriptions:
    get:
      tags: [subscriptions]
      summary: List active subscriptions visible to the caller
      description: >-
        Ordered newest-first by `created_at` descending, with `id` as a stable
        tiebreaker, so a freshly created subscription is on the first page.
        The list holds only the subscriptions of the tenants the caller may consume as.
      parameters:
        - name: $filter
          in: query
          schema: { type: string }
          description: "OData v4 filter expression. Filterable fields: `id` (eq/ne/in), `consumer_group` (eq/ne)."
        - name: $orderby
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque pagination token from a previous response.
      responses:
        "200":
          description: Page of subscriptions (may be empty)
          content:
            application/json:
              schema:
                type: object
                required: [items, page_info]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "./schemas/gts.cf.core.events.subscription.v1~.schema.json"
                  page_info:
                    $ref: "#/components/schemas/PageInfo"
        "400":
          description: Invalid $filter expression or cursor mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            `TenantIdNotAuthorized` when the caller's subject or tenant id is the nil UUID,
            answered before any read or PDP call. A tenant the caller may not consume as
            does not refuse the list: its subscriptions are left out.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed (the PDP could not answer), or a tenant-check answer (the
            caller's right to consume as a subscription's tenant) that does not compile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [subscriptions]
      summary: JOIN — register a subscription against a consumer group
      description: |
        Creates a subscription with one or more typed-filter `interests[]` entries (at
        least one not yet enforced, tracked in #5978). Each interest is
        topic-anchored, declares event-type patterns scoped to that topic, and optionally
        carries an engine-typed `filter { engine, expression }` object. See
        `ADR/0005-subscription-filter-typing.md` and
        `features/0002-consumer-subscription-lifecycle.md`.

        An interest may also carry `subject_types`: 1-32 GTS type patterns matched against
        the event's `subject_type`. It is a delivery filter, not an access grant; absent or
        `[]` means no selector.

        An interest reads one tenant, `subject_tenant` (optional, the caller's own tenant
        by default), with an `ownership_filter` (optional, `only_mine` by default; both
        are echoed):
        - `only_mine`: events of the caller's own tenant whose `subject_owner` is the
          caller; an event with no `subject_owner` never matches. The interest's
          `subject_tenant` must be the caller's tenant (`400 InvalidTenant`), and its
          `barrier_mode` has no effect.
        - `entire_tenant`: every event whose `subject_tenant` is the interest's tenant.
        - `tenant_subtree_included`: the interest's tenant and the tenants below it, as far
          as the consume scope reaches.
        Every event is also gated by the caller's consume scope. `max_depth` is no longer
        accepted (`400 InvalidBody`), and a `tenant_id` field is an unknown field (`422`).

        Checks run in this order; a refused JOIN creates nothing:
        1. Request parsing, in the handler. A body that is not valid JSON answers `400`; a
           missing, unknown or mistyped field answers `422` (an unknown `barrier_mode`, and
           a `filter` object without `engine` or `expression`, included). Then
           `client_agent`, `session_timeout` and the `consumer_group` id (`400`); a named
           consumer group answers `501`; then each interest's `max_depth` (refused when
           present), topic id, `types` and `subject_types` pattern syntax and `filter.engine`
           id (`400`).
        2. The caller's identity, in the domain: a caller whose subject or tenant id is the
           nil UUID answers `403 TenantIdNotAuthorized`. A bearer token does not exempt it.
        3. The limits, in the domain: the interest count (`400 TooManyInterests`), then per
           interest its `types` count (`TooManyTypes`), its `subject_types` count
           (`TooManySubjectTypes`) and its tenant (`InvalidTenant`: the nil UUID, or a
           tenant other than the caller's under `only_mine`). No read and no PDP call
           happen before steps 2 and 3.
        4. The consumer group (`404 ConsumerGroupNotFound`), then the creator check: only the
           principal that created the anonymous group (its subject, in its tenant) may JOIN
           it (`403 ConsumerGroupNotOwned`, asked before any PDP call); then the group check,
           the policy's `consume` on the group (`403 ConsumerGroupNotAuthorized`).
        5. Each `types` entry can match some event type (`400 BadTypePattern`).
        6. Per interest group (the interests sharing a topic and a tenant context: the
           caller's tenant, root only, barriers respected for `only_mine`; the interest's
           tenant, root only for `entire_tenant` or with its subtree for
           `tenant_subtree_included`, in the interest's barrier mode), the
           PDP is asked for the barrier right (`consume_ignore_barrier` on the topic) when the
           group's `barrier_mode` is `ignore`, then for the consume scope over the topic's
           registered event types, and, only when that scope is refused, for the tenant check
           that picks the refusal's code (see `403`). The first refused group ends the JOIN.
        7. Once every group is allowed, each exact `types` and `subject_types` entry is
           checked against its group's scope (`403 EventTypeNotAuthorized`,
           `SubjectTypeNotAuthorized`).
        8. Each interest's topic is registered (`404 TopicNotFound`).

        A `types` entry that matches no registered event type does not fail the JOIN: the
        `201` body lists it in that interest's `unmatched_types`. Events of such a type are
        delivered once the type registers and the caller's consume scope admits it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/gts.cf.core.events.subscription.v1~.schema.json"
      responses:
        "201":
          description: >-
            Subscription created; assignment computed. Each interest carries
            `unmatched_types`; a read or a listing of the subscription does not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinSubscriptionResponse"
        "400":
          description: |
            A body that is not valid JSON, or a validation error; a well-formed body with a
            missing, unknown or mistyped field answers `422`. Common codes:
            `InvalidSessionTimeout` (`session_timeout` is not a positive ISO 8601 duration),
            `InvalidBody` (an interest that sends `max_depth`, or a `filter.engine` that is
            not a GTS instance id),
            `BadTypePattern` (a `types[]` or `subject_types[]` pattern violates GTS spec §10
            wildcard rules: wildcard not at segment boundary, mid-pattern wildcard, multiple
            wildcards, substring within segment; or a `types[]` pattern cannot match any event
            type),
            `TypeNotInTopic` (defense-in-depth: resolved type's `parent_topic` differs from
            `interest.topic`) (not yet implemented, tracked in #5978),
            `TooManyInterests` (>64), `TooManyTypes` (>32 per interest),
            `TooManySubjectTypes` (>32 per interest), `InvalidTenant` (an
            `interests[].subject_tenant` is the nil UUID, or an `only_mine` interest names
            a tenant other than the caller's).
            The filter codes (not yet implemented, tracked in #5978):
            `ExpressionTooLong` (>4096 bytes), `CompiledFilterTooLarge` (>64KiB),
            `InvalidFilterExpression` (engine compile failed; engine diagnostic in body),
            `UnknownFilterEngine` (`filter.engine` GTS does not resolve to a registered
            engine).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: |
            One of six codes. An interest group's barrier-right, consume-scope or
            tenant-check answer that the broker cannot compile is a refusal here (`403`),
            never a `500`; the group check (the policy's `consume` on the consumer group)
            answers `500` for one.
            `TenantIdNotAuthorized`: the caller's subject or tenant id is the nil UUID; an
            `ignore` interest group lacks the barrier right (denied, or an answer that does
            not compile); or the consume scope is refused and the tenant check denies the
            interest group's tenant context.
            `ConsumerGroupNotOwned`: the caller is not the principal that created the
            anonymous group (its subject, in its tenant); asked before any PDP call.
            `ConsumerGroupNotAuthorized`: the group check refuses `consume` on the consumer
            group.
            `TopicNotAuthorized`: the consume scope for an interest group is denied, does not
            compile or leaves nothing the broker can enforce, and the tenant check reaches the
            interest group's tenant context (or its answer does not compile).
            `EventTypeNotAuthorized`: an exact `types[]` entry matches registered event types
            and the consume scope admits none of them; the message names the entry.
            `SubjectTypeNotAuthorized`: an exact `subject_types[]` entry overlaps a subject
            type that a matched event type allows, and no constraint of the consume scope
            admits it; the message names the entry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            `ConsumerGroupNotFound` (anonymous: must POST /v1/consumer-groups first; named:
            must register via types_registry (not yet implemented, tracked in #5702;
            a named group's JOIN answers `501`)),
            `TopicNotFound` (an `interest.topic` is not a registered topic).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: >-
            Payload Too Large - the request body is over the request body limit (api-gateway
            `defaults.body_limit_bytes`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: >-
            Unsupported Media Type - the request `Content-Type` is missing or is not a JSON media
            type (`application/json` or an `application/<subtype>+json` type).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >-
            The body is valid JSON but does not fit the request shape: a missing, unknown
            or mistyped field, an unknown enum value (such as a `barrier_mode` other than
            `respect` or `ignore`), or a `filter` object without `engine` or `expression`.
            The body is the generic `Unprocessable Entity` problem; it names neither the
            field nor its value. No subscription is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed (the PDP could not answer), or a group-check answer (the
            policy's `consume` on the consumer group) that does not compile. No subscription
            is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          description: >-
            Unimplemented - the `consumer_group` is a named group (a valid consumer-group id
            whose suffix is not a UUID); only anonymous groups are served (named groups are
            not yet implemented, tracked in #5702). Answered before any interest is
            validated. No subscription is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database or cluster cache is
            unavailable: the consumer group read, the event-type candidate query of an
            interest group, the registered-type lookup on a topic with more than 256 event
            types, the topic lookup, or a routing-marker write. No subscription is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: |
            Two `code`s, distinguished in the body, both with `Retry-After`:
            `RateLimited` - per-tenant JOIN rate cap breached (not yet implemented, tracked
            in #5697);
            `GroupAtCapacity` - the group already has as many members as partitions,
            so this JOIN would receive zero partitions (no standbys) (not yet implemented,
            tracked in #5978). The consumer retries the JOIN later; a slot frees
            when a member leaves.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/subscriptions/{id}:
    parameters:
      - name: id
