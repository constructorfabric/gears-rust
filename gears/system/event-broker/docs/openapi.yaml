        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            `TenantIdNotAuthorized` when the caller's subject or tenant id is the nil UUID
