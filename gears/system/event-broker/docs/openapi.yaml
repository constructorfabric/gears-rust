            caller's right to consume as the subscription's tenant) that does not compile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/subscriptions/{id}:seek:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [subscriptions]
      summary: SEEK — set the group cursor for assigned (topic, partition) pairs
      description: |
        SEEK is a **pre-stream-only** operation: the consumer SDK calls it once
        after JOIN (before opening `:stream`) to declare the starting position for
        each assigned partition. The SDK resolves the position via
        `OffsetStore::load_position(...)`; the value is either an exact last-processed
        offset (the broker emits from the first event with a sequence above it) or a
        sentinel (`"earliest"` / `"latest"` / `"at:<ISO-8601>"`) the broker resolves at
        admission. Any value in the valid range `[retention_floor - 1, head]` is
        accepted, including a backward move for replay — there is no forward-only
        rule.

        While a stream is open, its read position advances with delivery in the stream
        session only and is not stored; the stored cursor moves only by SEEK. A SEEK
        issued while `:stream` is open is rejected with `409 StreamingInProgress`.

        Each integer is the **last offset the consumer has processed**; the broker
        emits from the first event with a sequence above it. Sequences increase but
        may have gaps, so the next event's sequence need not be `cursor + 1`.
        Per-partition behavior when a partition is no longer assigned is documented in
        `features/0002-consumer-subscription-lifecycle.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topology_version, positions]
              additionalProperties: false
              properties:
                topology_version:
                  type: integer
                  format: int64
                  description: |
                    The topology_version the caller last observed for the subscription
                    (from the JOIN response or a subscription read). The broker fences
                    the whole seek against a concurrent rebalance: if this differs from
                    the subscription's current topology_version, the seek is rejected
                    412 topology_version_mismatch (no cursor seeded) and the caller
                    re-reads the subscription and re-seeks.
                positions:
                  type: object
                  description: |
                    Seek targets keyed by topic GTS id. Each topic maps to its
                    per-partition entries; each entry names the partition and the
                    desired starting position. Values are either an integer
                    (last-processed offset), or one of the string sentinels
                    "earliest", "latest", or "at:<ISO-8601>" (e.g., "at:2026-06-14T10:00:00Z").
                    A partition listed more than once under one topic ends at its last entry's
                    position: entries for the same partition are written in request order. Each
                    entry in a topic's array is still checked, and the response lists one resolved
                    entry for each.
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      required: [partition, value]
                      additionalProperties: false
                      properties:
                        partition: { type: integer, format: int32, minimum: 0 }
                        value:
                          oneOf:
                            - type: integer
                              format: int64
                              description: Last-processed offset. Valid range [retention_floor - 1, head], the head being the last stored event's sequence.
                            - type: string
                              enum: ["earliest", "latest"]
                              description: Server-resolved sentinel.
                            - type: string
                              pattern: "^at:.+"
                              description: |
                                Timestamp sentinel. "at:<ISO-8601>" resolves to the offset of the
                                first event whose occurred_at >= timestamp. Boundary behaviour:
                                before retention floor -> retention floor offset; beyond the head -> the head (the last stored event's sequence).
            example:
              topology_version: 3
              positions:
                "gts.cf.core.events.topic.v1~example.orders.v1":
                  - { partition: 0, value: 41 }
                  - { partition: 1, value: "earliest" }
                  - { partition: 2, value: "at:2026-06-14T10:00:00Z" }
      responses:
        "200":
          description: |
            Cursor seeded / updated. Response body returns the resolved integer
            offsets per partition (sentinels expanded to integers).
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: object
                    description: |
                      Resolved integer offsets keyed by topic GTS id, mirroring the
                      request's `positions` shape.
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required: [partition, value]
                        additionalProperties: false
                        properties:
                          partition: { type: integer, format: int32, minimum: 0 }
                          value: { type: integer, format: int64 }
              example:
                positions:
                  "gts.cf.core.events.topic.v1~example.orders.v1":
                    - { partition: 0, value: 41 }
                    - { partition: 1, value: 0 }
                    - { partition: 2, value: 57 }
        "400":
          description: |
            Invalid Argument; nothing is written. A path segment that is not
            `<subscription-id>:seek` (`InvalidPath`); a `positions` key
            that is not a GTS topic id (a field violation on `topic`); a `positions`
            object that names the same topic key more than once (`InvalidBody`); a string
            `value` that is none of `"earliest"`, `"latest"` or `"at:<ISO-8601>"`
            (`InvalidSeekValue`), or an `at:` value whose timestamp does not parse as
            RFC 3339 (`InvalidTimestamp`); or an integer `value` outside its partition's
            valid range (`OffsetOutOfRange`: one `positions` field violation per offending
            entry, naming its topic and partition, with reason `below_retention_floor` or
            `above_high_water_mark`). A body that is not valid JSON answers a generic `400`
            (an `about:blank` problem naming no field).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Unauthenticated - the API gateway refuses a missing or rejected bearer token
            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            Nothing is written. `TenantIdNotAuthorized` when the caller's subject or tenant
            id is the nil UUID (answered before any read or PDP call) or the PDP denies the
            caller `consume` as the subscription's tenant; `SubscriptionNotOwned` when the
            caller is not the principal that joined the subscription;
            `ConsumerGroupNotAuthorized` when the policy refuses `consume` on the
            subscription's consumer group (an answer that does not compile, or an evaluation
            that fails, is a `500`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >-
            Not Found; nothing is written: the subscription is not found (`SubscriptionNotFound`),
            its consumer group is no longer registered (`ConsumerGroupNotFound`), a `positions` key
            names a topic that is not registered (`TopicNotFound`), or the topic's storage backend
            does not hold an assigned partition (`PartitionNotFound`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            `PartitionNotAssigned` — request references a partition not currently
            assigned to this subscription (the versions match, so it is a genuine
            client error, not a stale view).
            `StreamingInProgress` - a SEEK was issued while a `:stream` is open on
            this subscription; SEEK is pre-stream-only (a stream's read position is
            not stored).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: |
            `TopologyVersionMismatch` — the `topology_version` differs from
            the subscription's current topology_version: a concurrent rebalance moved
            the assignment under the caller. Retriable — the caller re-reads the
            subscription (`GET /v1/subscriptions/{id}`) for the current
            topology_version and assignment, then re-seeks. The body is minimal (no
            topology_version, no assignment); the re-read is the single source of the
            fresh state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: >-
            Payload Too Large - the request body is over the request body limit (api-gateway
            `defaults.body_limit_bytes`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: >-
            Unsupported Media Type - the request `Content-Type` is missing or is not a JSON media
            type (`application/json` or an `application/<subtype>+json` type).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >-
            Unprocessable Entity - the body is valid JSON but does not fit the request shape: a
            missing, unknown or mistyped field, for example a `value` that is neither an integer nor
            a string (such as `true`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: >-
            An internal error, answered with a generic body: for example an authorization
            evaluation that failed (the PDP could not answer), a tenant-check answer (the
            caller's right to consume as the subscription's tenant) that does not compile, or
            a group-check answer (the policy's `consume` on the consumer group) that does not
            compile. No cursor is written.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            ServiceUnavailable, retryable - the broker's database or the topic's storage backend is
            unavailable: the consumer group read, the topic lookup, the resolution of a position on
            the backend, or a cursor write.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    Topic:
      type: object
      description: |
        A topic as this API reports it. A concrete topic is an instance of
        `gts.cf.core.events.topic.v1~`, carrying the stream's own data and no trait metadata.
        How many partitions the broker gives it and which backend stores them are the
        broker's configuration and are not reported here. This DTO is projected from the
        registered instance.
      required: [id, description]
      additionalProperties: false
      properties:
        id:
          type: string
          x-gts-instance-ref: "gts.cf.core.events.topic.v1~"
          description: >-
            GTS instance identifier of the topic, chained under
            `gts.cf.core.events.topic.v1~`.
        description:
          type: string
          description: What the stream carries, for a reader deciding whether to subscribe.
        retention:
          type: ["string", "null"]
          format: duration
          description: >-
            ISO 8601 duration events on this topic are retained for. Absent means the
            broker's configured default.
    EventType:
      type: object
      description: |
        An event type as this API reports it. A concrete event type is a derived type schema
        under `gts.cf.core.events.event.v1~`. This DTO is projected from the resolved schema:
        `topic` and `allowed_subject_types` are trait values merged across the derivation
        chain, and `data_schema` is the payload contract composed out of the schema's `data`
        narrowings. Traits are schema-only, so none of them appear in a published event and a
        producer cannot supply them.
      required: [id, topic, allowed_subject_types, partition_key, data_schema]
      additionalProperties: false
      properties:
        id:
          type: string
          description: >-
            GTS type identifier of the event type, chained under
            `gts.cf.core.events.event.v1~` and ending in `~`.
        topic:
          type: string
          description: >-
            GTS instance identifier of the topic events of this type are published to,
            chained under `gts.cf.core.events.topic.v1~`.
        description:
          type: ["string", "null"]
        partition_key:
          type: string
          description: >-
            JSON Pointer naming the event member whose value the partition is derived
            from — a resolved trait of the event type. The base defaults it (to
            `/subject_tenant`), so every event type reports one.
        allowed_subject_types:
          type: array
          items: { type: string }
          description: >-
            GTS Type-id patterns the event's `subject_type` must match - a concrete Type, a
            wildcard suffix `<prefix>.*`, or a bare base Type `<base>~`.
        data_schema:
          type: object
          additionalProperties: true
          description: >-
            JSON Schema for the event's `data` member, composed from the type's `data`
            narrowings along the derivation chain. Producers and consumers validate payloads
            against it. It is a projection of the resolved schema rather than a stored field.
    Event:
      $ref: "./schemas/gts.cf.core.events.event.v1~.schema.json"
    Subscription:
      $ref: "./schemas/gts.cf.core.events.subscription.v1~.schema.json"
    JoinSubscriptionResponse:
      type: object
      description: |
        The JOIN `201` body: the subscription, with each interest's `unmatched_types`.
        A read or a listing of the subscription answers `Subscription`, without it.
      required: [id, consumer_group, client_agent, interests, assigned, topology_version, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        consumer_group:
          type: string
          x-gts-instance-ref: "gts.cf.core.events.consumer_group.v1~"
        client_agent:
          type: string
        interests:
          type: array
          items:
            type: object
            required: [topic, subject_tenant, ownership_filter, barrier_mode, types, filter, unmatched_types]
            additionalProperties: false
            properties:
              topic:
                type: string
                x-gts-instance-ref: "gts.cf.core.events.topic.v1~"
              subject_tenant:
                type: string
                format: uuid
                description: The tenant the interest reads; the caller's own tenant when the JOIN omits it.
              ownership_filter:
                type: string
                enum: [only_mine, entire_tenant, tenant_subtree_included]
                description: Echoed; `only_mine` when the JOIN omits it.
              barrier_mode:
                type: string
                enum: [respect, ignore]
              types:
                type: array
                items: { type: string }
              subject_types:
                type: array
                items: { type: string }
                description: Present only when the interest carries a subject-type selector.
              filter:
                type: ["object", "null"]
                required: [engine, expression]
                properties:
                  engine: { type: string }
                  expression: { type: string }
              unmatched_types:
                type: array
                items: { type: string }
                description: >-
                  The entries of this interest's `types` that match no event type registered
                  on its topic; `[]` when all matched. On a topic with more than 256
                  registered event types only exact entries are checked, and a wildcard is
                  never listed.
        assigned:
          type: array
          items:
            type: object
            required: [topic, partition]
            additionalProperties: false
            properties:
              topic:
                type: string
                x-gts-instance-ref: "gts.cf.core.events.topic.v1~"
              partition: { type: integer, minimum: 0 }
        topology_version:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    ConsumerGroup:
      $ref: "./schemas/gts.cf.core.events.consumer_group.v1~.schema.json"
    PageInfo:
      type: object
      required: [limit]
      properties:
        next_cursor:
          type: ["string", "null"]
          description: Opaque token for the next page. Null when no further pages exist.
        prev_cursor:
          type: ["string", "null"]
          description: Opaque token for the previous page. Null on the first page.
        limit:
          type: integer
          description: Page size used for this response.
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, context]
      description: |
        RFC 9457 problem+json envelope produced by `toolkit-canonical-errors`. Event Broker
        does not define its own wire format: it reuses the canonical error categories and
        never mints a custom `type`.
          * `type` carries the canonical-error category as a `gts://` URI
            (e.g. `gts://gts.cf.core.errors.err.v1~cf.core.err.<category>.v1~`) — the stable
            broad-category discriminator across all gears.
          * `status` is the HTTP status; `title`/`detail` are human-readable.
          * `context` is a per-category structured object. A `503` the broker answers carries an
            empty `context` and no `Retry-After` header. A `503` the API gateway answers carries
            `context.retry_after_seconds`, from which the canonical-errors layer sets the wire
            `Retry-After` header: 5 when authentication is unavailable, 1 while the application has
            not finished starting.
          * Every authenticated route can also get two server-error answers from the API gateway
            before the broker sees the request: that `503`, and a `500` when the authentication
            infrastructure fails.
      properties:
        type:
          type: string
          format: uri-reference
          description: Canonical-error category URI (gts://…). Broad-category discriminator.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        trace_id:
          type: string
        context:
          type: object
          additionalProperties: true
          description: |
            Per-category structured context; a `503` the broker answers carries an empty
            one. Common fields include, for a `NotFound` or any
            resource-scoped error, `resource_type` / `resource_name` naming the
            addressed resource. A publish-path error about the stream names the
            targeted stream (`resource_type: "gts.cf.core.events.topic.v1~"`,
            `resource_name`: the resolved topic id); a request-level `400` names
            the request (`resource_type: "gts.cf.core.events.request.v1~"`). The
            specific fault lives in the `field_violations` or `violations` entry
            (e.g. SequenceViolation's violation carries `last_sequence=<n>`).
            Error bodies never echo submitted content - payloads or field values;
            identifiers the broker issued (a producer `id`, a resolved topic id)
            and request positions (an event `index`) may appear.

  responses:
    Problem:
      description: RFC 9457 problem response (application/problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  headers:
    PreferenceApplied:
      description: >-
        Present on a synchronous publish: the applied wait as `wait=<seconds>`
        (RFC 7240 §3) - the requested `wait` capped by configuration.
      schema:
        type: string
