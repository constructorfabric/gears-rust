            before the broker sees the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: >-
            `TenantIdNotAuthorized` when the caller's subject or tenant id is the nil UUID
            (answered before any read or PDP call) or the PDP denies the caller `consume` as
            the subscription's tenant.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: SubscriptionNotFound
          content:
            application/problem+json:
