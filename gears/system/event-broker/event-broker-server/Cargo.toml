[package]
name = "cf-gears-event-broker-server"
description = "Standalone-mode deployment binary for the Event Broker gear"
version = "0.5.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["constructorfabric", "cf-gears", "event-broker"]
categories = ["asynchronous"]
publish = false

[[bin]]
name = "cf-gears-event-broker-server"
path = "src/main.rs"

[[test]]
name = "standalone_integration_tests"
path = "tests/standalone_integration_tests.rs"
required-features = ["e2e-flight-control"]

[[test]]
name = "consumer_group_rebalance_integration_tests"
path = "tests/consumer_group_rebalance_integration_tests.rs"
required-features = ["e2e-flight-control"]

[[test]]
name = "process_cutover"
path = "tests/process_cutover.rs"
required-features = ["process-tests"]

[lints]
workspace = true

[features]
default = []
process-tests = []
e2e-flight-control = [
    "process-tests",
    "dep:prost",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
    "dep:toolkit-security",
    "dep:toolkit-trace-context",
    "dep:toolkit-transport-grpc",
]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
cluster-sdk = { workspace = true, features = ["grpc-client", "otel"] }
event-broker = { workspace = true }
prost = { workspace = true, optional = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
toolkit = { workspace = true, features = ["bootstrap"] }
toolkit-security = { workspace = true, optional = true }
toolkit-taskward = { workspace = true }
toolkit-trace-context = { workspace = true, optional = true }
toolkit-transport-grpc = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
prost = { workspace = true }
tonic-prost = { workspace = true }
cf-gears-cluster-conformance = { workspace = true }
cluster-sdk = { workspace = true, features = ["grpc-client"] }
# The standalone and rebalance targets select separate broker and flight-control
# executables. `test-utils` builds the event schemas the fixture Core admits.
event-broker = { workspace = true, features = ["test-utils"] }
event-broker-sdk = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time", "test-util"] }
tokio-stream = { workspace = true }
tonic = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["clock", "serde"] }
bytes = { workspace = true }
# `consumer_group_rebalance_integration_tests.rs` recomputes the partition hash
# (`murmur3_x86_32`) to predict which partition a subject lands on.
toolkit-stable-hash = { workspace = true }
