[package]
name = "cf-gears-static-authn-plugin"
version = "0.3.19"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AuthN resolver plugin with static token-to-identity mapping for development and testing"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "static_authn_plugin"

[lints]
workspace = true

[dependencies]
# Local dependencies
authn-resolver-sdk = { package = "cf-gears-authn-resolver-sdk", version = "0.3.38", path = "../../authn-resolver-sdk" }
# Publishes through the consumed platform API (local or resolving REST client).
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.4.0", path = "../../../types-registry/types-registry-sdk", features = ["rest-client"] }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }
# The runtime's cancellation token, held from `init` for the `post_init` publication.
tokio-util = { workspace = true }

# The published instance document.
serde_json = { workspace = true }

# Data structures
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }

# Logging
tracing = { workspace = true }

# Secrets
secrecy = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
temp-env = { workspace = true }
secrecy = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
# The in-memory platform registry the publication tests run against.
types-registry-sdk = { package = "cf-gears-types-registry-sdk", path = "../../../types-registry/types-registry-sdk", features = ["test-util"] }
serde_json = { workspace = true }
