[package]
name = "cf-gears-authn-resolver"
version = "0.2.38"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AuthN resolver gear - discovers and routes to plugins"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "authn_resolver"

[lints]
workspace = true

[dependencies]
# Trait boundaries of consumed SDKs are `CanonicalError` (ADR 0005).
toolkit-canonical-errors = { workspace = true }
# Local dependencies
authn-resolver-sdk = { package = "cf-gears-authn-resolver-sdk", version = "0.3.38", path = "../authn-resolver-sdk" }
# Plugin discovery via `consumes`: local registry or resolving REST client.
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.4.0", path = "../../types-registry/types-registry-sdk", features = ["rest-client"] }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
# Leaf crate for DynBearerAuthenticator (avoids depending on the bootstrap-gated toolkit runtime).
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }
# Bounds a cold plugin selection (`DISCOVERY_BUDGET`).
tokio = { workspace = true, features = ["time"] }

# Error handling and serialization
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
# `gts_id!` for the registry error scope the selection tests fail with.
toolkit-gts = { workspace = true }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", path = "../../types-registry/types-registry-sdk", features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
