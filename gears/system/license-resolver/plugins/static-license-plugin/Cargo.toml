[package]
name = "cf-gears-static-license-plugin"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "License resolver plugin with static config-driven grant rules for development and testing"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "licensing"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "static_license_plugin"

[lints]
workspace = true

[dependencies]
# Local dependencies
license-resolver-sdk = { workspace = true }
# `GtsId` of the published plugin instance; `gts_publication` needs the REST client.
types-registry-sdk = { workspace = true, features = ["rest-client"] }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }

# GTS types
gts = { workspace = true }

# Async runtime
async-trait = { workspace = true }

# Data structures
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
# The real registry behind the managed-admission test.
types-registry = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite"] }
toolkit-security = { workspace = true }
sea-orm-migration = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
toolkit = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-util = { workspace = true }
toolkit-gts = { workspace = true }
