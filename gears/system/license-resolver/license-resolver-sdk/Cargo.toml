[package]
name = "cf-gears-license-resolver-sdk"
version = "0.2.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SDK for license_resolver gear: is_licensed check API, licensing contract base types, plugin spec"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "licensing"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "license_resolver_sdk"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
utoipa = { workspace = true }

# GTS types
gts = { workspace = true }
toolkit-gts = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-contract = { workspace = true }
toolkit-canonical-errors = { workspace = true }
toolkit-security = { workspace = true }

# Emitted into the generated REST client (rest-client).
toolkit-http = { workspace = true, optional = true }
# Emitted into the generated server route registration (rest-server).
axum = { workspace = true, optional = true }

[features]
# Generated REST client (`LicenseResolverApiRestClient` + resolving wrapper).
rest-client = ["toolkit-contract/rest-client", "dep:toolkit-http"]
# Generated server route registration, used by the license-resolver gear.
rest-server = ["toolkit-contract/rest-server", "dep:axum"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net"] }
