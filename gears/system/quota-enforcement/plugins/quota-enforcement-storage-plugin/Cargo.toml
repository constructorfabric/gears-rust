[package]
name = "cf-gears-quota-enforcement-storage-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Quota Enforcement storage plugin on toolkit-db: foundation schema, bootstrap, configuration tables, and the Quota tables"
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "quota"]
categories = ["api-bindings"]
metadata.docs.rs.all-features = true

[lib]
name = "quota_enforcement_storage_plugin"

[lints]
workspace = true

[features]
# Gates the PostgreSQL-backed concurrency suite (`tests/quota_store_integration_pg.rs`,
# Docker required). Everything else runs on SQLite.
postgres = ["toolkit-db/pg"]
# The undelivered outbox starter (no handler) the store and PostgreSQL suites inspect
# enqueued rows with. Never enabled by production builds.
test-util = []

[dependencies]
quota-enforcement-sdk = { workspace = true }

toolkit = { workspace = true }
# Quickstart binds this plugin to SQLite at runtime; the feature must come from
# the crate itself, not from dev-dependency unification.
toolkit-db = { workspace = true, features = ["sqlite"] }
toolkit-db-macros = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }
# Registers the plugin instance the gear selects storage by.
types-registry-sdk = { workspace = true }
# The `deps = [types_registry]` edge of the gear macro names this crate.
types-registry = { workspace = true }

sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
time = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
gts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
# The contention budget's backoff between refused-lock retries (I8).
tokio = { workspace = true, features = ["time"] }

# Required by the toolkit::gear macro.
inventory = { workspace = true }

[dev-dependencies]
# Cargo unifies this edge with the lib under test into one `test-util = on`
# build, so the integration suites reach the test-only outbox starter.
cf-gears-quota-enforcement-storage-plugin = { path = ".", features = ["test-util"] }
quota-enforcement-sdk = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-util = { workspace = true }
# File-backed SQLite tests: the directory, WAL files included, goes on drop,
# and a file Windows still holds open cannot fail the test.
tempfile = { workspace = true }
# Unconditional: dev-dependencies cannot be optional; the suite that needs a
# container is `#![cfg(feature = "postgres")]`-gated.
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
test-containers = { workspace = true }
