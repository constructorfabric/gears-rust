[package]
name = "cf-gears-quota-enforcement-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SDK for the quota-enforcement gear: storage plugin contract, domain types, closed error enums, and GTS plugin spec"
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "quota"]
categories = ["api-bindings"]
metadata.docs.rs.all-features = true

[lib]
name = "quota_enforcement_sdk"

[lints]
workspace = true

[features]
# Exposes `pub mod testing`: a complete in-memory double of the storage plugin
# contract. Test-only; never enable in a production build.
test-util = ["dep:parking_lot", "dep:tokio"]
# Generated REST clients of the three contracts (`*RestClient` + resolving wrapper).
rest-client = ["toolkit-contract/rest-client", "dep:toolkit-http", "dep:secrecy"]
# Generated server route registration, used by the quota-enforcement gear.
rest-server = ["toolkit-contract/rest-server", "dep:axum"]

# `#[toolkit::contract]` emits `#[async_trait]`, which cargo-shear cannot see.
[package.metadata.cargo-shear]
ignored = ["async-trait"]

[dependencies]
async-trait = { workspace = true }
toolkit = { workspace = true }
toolkit-contract = { workspace = true }
# OpenAPI schemas of the contract types; `time` for the RFC 3339 timestamps.
utoipa = { workspace = true, features = ["time"] }
# Emitted into the generated REST client (rest-client).
toolkit-http = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
# Emitted into the generated server route registration (rest-server).
axum = { workspace = true, optional = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
time = { workspace = true }

# Canonical digests: the idempotency subject key and the request payload hash
aws-lc-rs = { workspace = true }

# GTS types. `inventory` carries the QE-owned GTS definitions into the
# process-wide registry seed (`toolkit_gts::InventoryTypeSchema`).
gts = { workspace = true }
toolkit-gts = { workspace = true }
inventory = { workspace = true }

# `AccessScope` and `SecurityContext` on the plugin contract signatures.
toolkit-security = { workspace = true }
# `QuotaEnforcementError` is the platform canonical error (DESIGN section 3.3).
toolkit-canonical-errors = { workspace = true }

parking_lot = { workspace = true, optional = true }
# The in-memory double's drain lock, held across a delivery callback.
tokio = { workspace = true, features = ["sync"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { workspace = true }
toolkit-http-middleware = { workspace = true }
