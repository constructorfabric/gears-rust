# Created: 2026-04-16 by Constructor Tech
[package]
name = "cf-gears-resource-group"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Resource Group gear: hierarchical resource group management with GTS type system"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "resource-group"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lib]
name = "resource_group"

[lints]
workspace = true

[features]
default = ["odata"]
odata = []

# Gates the Postgres-backed real-DB concurrency suite
# (tests/pg_concurrency_test.rs). Disabled by default because it spins up a
# `testcontainers` Docker container; enable with `--features integration`
# when Docker is available locally or in CI.
integration = []

[dependencies]
# SDK - public API, models, and errors
resource-group-sdk = { package = "cf-gears-resource-group-sdk", version = "0.2.1", path = "../resource-group-sdk", features = ["odata"] }

# Core dependencies
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }

# Serde and JSON schema
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
utoipa = { workspace = true, features = ["time"] }

# HTTP and REST
axum = { workspace = true, features = ["macros"] }
http = { workspace = true }

# Time handling
time = { workspace = true }

# UUID support
uuid = { workspace = true }

# Database - SeaORM
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

# Error handling
thiserror = { workspace = true }

# AuthZ
authz-resolver-sdk = { workspace = true }

# GTS type system — types registry for schema resolution
types-registry-sdk = { workspace = true }
authz-resolver = { workspace = true }
types-registry = { workspace = true }
gts = { workspace = true }

# Local dependencies
toolkit = { workspace = true }
toolkit-canonical-errors = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite", "pg"] }
toolkit-gts = { workspace = true }
toolkit-db-macros = { workspace = true }
toolkit-security = { workspace = true }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-macros = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# "test-support" enables toolkit_db::connect_db_with_metric_callback and
# secure::in_transaction_for_testing, used by the DB-behavior audit's
# QueryRecorder (tests/common/query_recorder.rs). Test-only; never built
# into the production library (this crate's own [dependencies] above pulls
# in toolkit-db without this feature).
# "pg" (on top of the "sqlite" already needed by the SQLite audit tests) lets
# tests/pg_concurrency_test.rs connect to a real PostgreSQL via connect_db().
toolkit-db = { workspace = true, features = ["sqlite", "pg", "test-support"] }
# SQL normalization for the QueryRecorder (tests/common/query_recorder.rs) --
# already a workspace dependency (see root Cargo.toml), used here as a
# test-only dev-dependency.
regex = { workspace = true }
# PostgreSQL concurrency harness (tests/pg_concurrency_test.rs) -- brings up a
# real PostgreSQL via Docker, mirroring account-management's
# tests/common/mod.rs::pg::bring_up_postgres(). Both already workspace
# dependencies (root Cargo.toml), used here as test-only dev-dependencies.
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
# Enable the SDK `test-util` feature so integration-test fakes can build the
# canonical-error envelopes via `types_registry_sdk::testing`.
types-registry-sdk = { workspace = true, features = ["test-util"] }
# Declared directly so the integration-test fakes that name
# `toolkit_canonical_errors::CanonicalError` don't rely on it being pulled in
# transitively via the normal (`[dependencies]`) build graph.
toolkit-canonical-errors = { workspace = true }
