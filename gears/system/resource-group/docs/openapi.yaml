# Created: 2026-03-06 by Constructor Tech
# Updated: 2026-04-07 by Constructor Tech

# NOTE: the aggregated, CI-verified schema for the whole platform is
# docs/api/api.json (also served live by the api-gateway at {prefix}/docs).
# Paths below are gear-relative: the gateway prepends its prefix_path (e.g. /cf).
openapi: 3.1.0
info:
  title: Resource Group API
  version: 1.0.0
  description: |
    Resource Group API — generic hierarchy and membership engine.

    ## Types

    Resource group types are not part of this API. A group type is a GTS Type Schema in the
    Types Registry, derived from the abstract base `gts.cf.core.rg.type.v1~`; register and manage
    types through the Types Registry API. Placement rules are trait values (`x-gts-traits`):
    `can_be_root`, `allowed_parent_types`, `allowed_membership_types`. The group `metadata`
    schema is the `metadata` property of the type schema. A group's type is set at creation and
    never changes.

    ## Groups & Memberships API

    Supports cursor-based pagination and OData-style `$filter`.

    Type codes and resource types are GTS type paths.
    Format: `gts.<vendor>.<package>.<namespace>.<type>.v<MAJOR>[.<MINOR>]~`

    Example hierarchy:
    ```text
      tenant T1 (depth 0)
      ├── department D2 (depth 1) {metadata: {category: "finance", short_description: "Mega Department"}}
      │   └── branch B3 (depth 2) {metadata: {location: "Building A, Floor 3"}}
      └── tenant T7 (depth 1) {metadata: {barrier: true}}
      tenant T9 (depth 0) {metadata: {custom_domain: "t9.example.com"}}
    ```
servers:
  - url: https://api.example.com
tags:
  - name: groups
    description: |
      Resource groups organized in a hierarchy.
      Every group has `parent_id`, `tenant_id`, and `depth` at the top level.
  - name: memberships
    description: Resource memberships bind resources to groups.

paths:

  # ── Groups ─────────────────────────────────────────────────────────

  /resource-group/v1/groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups with filters and pagination
      description: |
        Returns paginated resource groups.

        For hierarchy traversal (ancestors, descendants, depth), use the
        dedicated `/{group_id}/descendants` and `/{group_id}/ancestors`
        endpoints.

        - `$filter`: `type` (eq, ne, in), `hierarchy/parent_id` (eq, ne, in), `tenant_id` (eq, ne, in), `id` (eq, ne, in), `name` (eq, ne, in)
        - `limit`: page size (1..200), default 25
        - `cursor`: opaque token for pagination
      x-odata-filter:
        supported_fields:
          type: [eq, ne, in]
          hierarchy/parent_id: [eq, ne, in]
          tenant_id: [eq, ne, in]
          id: [eq, ne, in]
          name: [eq, ne, in]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated list of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPage'
              examples:
                all-groups:
                  summary: "GET ...groups — all groups"
                  value:
                    items:
                      - id: 11111111-1111-1111-1111-111111111111
                        type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                        name: T1
                        parent_id: null
                        tenant_id: 11111111-1111-1111-1111-111111111111
                      - id: 22222222-2222-2222-2222-222222222222
                        type: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
                        name: D2
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 11111111-1111-1111-1111-111111111111
                        metadata:
                          category: "finance"
                          short_description: "Mega Department"
                      - id: 33333333-3333-3333-3333-333333333333
                        type: "gts.cf.core.rg.type.v1~cf.core.rg.branch.v1~"
                        name: B3
                        parent_id: 22222222-2222-2222-2222-222222222222
                        tenant_id: 11111111-1111-1111-1111-111111111111
                        metadata:
                          location: "Building A, Floor 3"
                      - id: 77777777-7777-7777-7777-777777777777
                        type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                        name: T7
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 77777777-7777-7777-7777-777777777777
                        metadata:
                          barrier: true
                    page_info:
                      next_cursor: "eyJpZCI6Ijc3NzcuLi4ifQ"
                      limit: 25

                type-eq-tenant:
                  summary: "$filter=type eq '...tenant.v1~'"
                  value:
                    items:
                      - id: 11111111-1111-1111-1111-111111111111
                        type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                        name: T1
                        parent_id: null
                        tenant_id: 11111111-1111-1111-1111-111111111111
                      - id: 77777777-7777-7777-7777-777777777777
                        type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                        name: T7
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 77777777-7777-7777-7777-777777777777
                        metadata:
                          barrier: true
                    page_info:
                      next_cursor: "eyJpZCI6Ijc3NzcuLi4ifQ"
                      limit: 25

                parent-id-eq:
                  summary: "$filter=hierarchy/parent_id eq '11111111-...'"
                  description: Direct children of T1.
                  value:
                    items:
                      - id: 22222222-2222-2222-2222-222222222222
                        type: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
                        name: D2
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 11111111-1111-1111-1111-111111111111
                        metadata:
                          category: "finance"
                          short_description: "Mega Department"
                      - id: 77777777-7777-7777-7777-777777777777
                        type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                        name: T7
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 77777777-7777-7777-7777-777777777777
                        metadata:
                          barrier: true
                    page_info:
                      next_cursor: "eyJpZCI6Ijc3NzcuLi4ifQ"
                      limit: 25

    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      description: |
        `type` must be a chained GTS type with `gts.cf.core.rg.type.v1~` prefix.
        Derived type fields (e.g. `category`) are sent inside `metadata` object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
            examples:
              create-tenant:
                summary: Create root tenant T1
                value:
                  id: 11111111-1111-1111-1111-111111111111
                  type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                  name: T1
              create-department:
                summary: Create department D2 under T1
                value:
                  type: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
                  name: D2
                  parent_id: 11111111-1111-1111-1111-111111111111
                  metadata:
                    category: "finance"
                    short_description: "Mega Department"
              create-branch:
                summary: Create branch B3 under D2
                value:
                  type: "gts.cf.core.rg.type.v1~cf.core.rg.branch.v1~"
                  name: B3
                  parent_id: 22222222-2222-2222-2222-222222222222
                  metadata:
                    location: "Building A, Floor 3"
              create-barrier-tenant:
                summary: Create nested tenant T7 (barrier) under T1
                value:
                  id: 77777777-7777-7777-7777-777777777777
                  type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                  name: T7
                  parent_id: 11111111-1111-1111-1111-111111111111
                  metadata:
                    barrier: true
              create-tenant-custom-domain:
                summary: Create root tenant T9 (custom domain)
                value:
                  type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                  name: T9
                  metadata:
                    custom_domain: "t9.example.com"
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              examples:
                tenant-created:
                  summary: Tenant T1 response
                  value:
                    id: 11111111-1111-1111-1111-111111111111
                    type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                    name: T1
                    parent_id: null
                    tenant_id: 11111111-1111-1111-1111-111111111111
                department-created:
                  summary: Department D2 response
                  value:
                    id: 22222222-2222-2222-2222-222222222222
                    type: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
                    name: D2
                    parent_id: 11111111-1111-1111-1111-111111111111
                    tenant_id: 11111111-1111-1111-1111-111111111111
                    metadata:
                      category: "finance"
                      short_description: "Mega Department"
                branch-created:
                  summary: Branch B3 response
                  value:
                    id: 33333333-3333-3333-3333-333333333333
                    type: "gts.cf.core.rg.type.v1~cf.core.rg.branch.v1~"
                    name: B3
                    parent_id: 22222222-2222-2222-2222-222222222222
                    tenant_id: 11111111-1111-1111-1111-111111111111
                    metadata:
                      location: "Building A, Floor 3"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid-parent-type:
                  summary: Parent type not allowed
                  value:
                    type: https://api.example.com/errors/invalid-parent-type
                    title: Invalid parent type
                    status: 400
                    detail: "Type 'gts.cf.core.rg.type.v1~cf.core.rg.branch.v1~' does not allow parent of type 'gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~'"
                    trace_id: 01HXYZRGVALIDATION
                root-not-allowed:
                  summary: Type cannot be root
                  value:
                    type: https://api.example.com/errors/validation
                    title: Validation error
                    status: 400
                    detail: "Type 'gts.cf.core.rg.type.v1~w.core.org.department.v1~' cannot be root (can_be_root=false and no parent_id provided)"
                    trace_id: 01HXYZRGNOROOT
        '404':
          description: Group type or parent group not found. The type is looked up in the Types Registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                cycle-detected:
                  summary: Cycle detected in hierarchy
                  value:
                    type: https://api.example.com/errors/cycle-detected
                    title: Cycle detected
                    status: 409
                    detail: "Setting parent_id would create a cycle in the hierarchy"
                    trace_id: 01HXYZRGCYCLE
        '503':
          description: Types Registry unavailable; retry after the interval in the `Retry-After` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /resource-group/v1/groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group by group_id
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              examples:
                tenant:
                  summary: Tenant T1
                  value:
                    id: 11111111-1111-1111-1111-111111111111
                    type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                    name: T1
                    parent_id: null
                    tenant_id: 11111111-1111-1111-1111-111111111111
                department:
                  summary: Department D2
                  value:
                    id: 22222222-2222-2222-2222-222222222222
                    type: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
                    name: D2
                    parent_id: 11111111-1111-1111-1111-111111111111
                    tenant_id: 11111111-1111-1111-1111-111111111111
                    metadata:
                      category: "finance"
                      short_description: "Mega Department"
                branch:
                  summary: Branch B3
                  value:
                    id: 33333333-3333-3333-3333-333333333333
                    type: "gts.cf.core.rg.type.v1~cf.core.rg.branch.v1~"
                    name: B3
                    parent_id: 22222222-2222-2222-2222-222222222222
                    tenant_id: 11111111-1111-1111-1111-111111111111
                    metadata:
                      location: "Building A, Floor 3"
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group by group_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group by group_id
      parameters:
        - $ref: '#/components/parameters/DeleteForce'
      responses:
        '204':
          description: Group deleted

  /resource-group/v1/groups/{group_id}/descendants:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: getGroupDescendants
      tags: [groups]
      summary: Get group descendants
      description: |
        Returns descendants of the reference group `{group_id}` (depth >= 0)
        with OData filtering. `depth` is **relative** to the reference group:
        - `depth = 0` — the reference group itself
        - `depth > 0` — descendants

        - `$filter`: `depth` (eq, ne, gt, ge, lt, le), `type` (eq, ne, in)
        - `limit`: page size (1..200), default 25
        - `cursor`: opaque token for pagination
      x-odata-filter:
        supported_fields:
          depth: [eq, ne, gt, ge, lt, le]
          type: [eq, ne, in]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated descendants with relative depth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupHierarchyPage'
              examples:
                subtree-of-T1:
                  summary: "Full subtree of T1"
                  value:
                    items:
                      - id: 11111111-1111-1111-1111-111111111111
                        type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                        name: T1
                        parent_id: null
                        tenant_id: 11111111-1111-1111-1111-111111111111
                        depth: 0
                      - id: 22222222-2222-2222-2222-222222222222
                        type: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
                        name: D2
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 11111111-1111-1111-1111-111111111111
                        depth: 1
                        metadata:
                          category: "finance"
                          short_description: "Mega Department"
                      - id: 33333333-3333-3333-3333-333333333333
                        type: "gts.cf.core.rg.type.v1~cf.core.rg.branch.v1~"
                        name: B3
                        parent_id: 22222222-2222-2222-2222-222222222222
                        tenant_id: 11111111-1111-1111-1111-111111111111
                        depth: 2
                        metadata:
                          location: "Building A, Floor 3"
                      - id: 77777777-7777-7777-7777-777777777777
                        type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                        name: T7
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 77777777-7777-7777-7777-777777777777
                        depth: 1
                        metadata:
                          barrier: true
                    page_info:
                      next_cursor: "eyJpZCI6Ijc3NzcuLi4ifQ"
                      limit: 25

                depth-eq-1:
                  summary: "$filter=depth eq 1 — direct children of T1"
                  value:
                    items:
                      - id: 22222222-2222-2222-2222-222222222222
                        type: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
                        name: D2
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 11111111-1111-1111-1111-111111111111
                        depth: 1
                        metadata:
                          category: "finance"
                          short_description: "Mega Department"
                      - id: 77777777-7777-7777-7777-777777777777
                        type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                        name: T7
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 77777777-7777-7777-7777-777777777777
                        depth: 1
                        metadata:
                          barrier: true
                    page_info:
                      next_cursor: null
                      limit: 25

  /resource-group/v1/groups/{group_id}/ancestors:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: getGroupAncestors
      tags: [groups]
      summary: Get group ancestors
      description: |
        Returns ancestors of the reference group `{group_id}` (depth <= 0)
        with OData filtering. `depth` is **relative** to the reference group:
        - `depth = 0` — the reference group itself
        - `depth < 0` — ancestors

        - `$filter`: `depth` (eq, ne, gt, ge, lt, le), `type` (eq, ne, in)
        - `limit`: page size (1..200), default 25
        - `cursor`: opaque token for pagination
      x-odata-filter:
        supported_fields:
          depth: [eq, ne, gt, ge, lt, le]
          type: [eq, ne, in]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated ancestors with relative depth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupHierarchyPage'
              examples:
                ancestors-of-B3:
                  summary: "Ancestors of B3"
                  value:
                    items:
                      - id: 11111111-1111-1111-1111-111111111111
                        type: "gts.cf.core.rg.type.v1~y.core.tn.tenant.v1~"
                        name: T1
                        parent_id: null
                        tenant_id: 11111111-1111-1111-1111-111111111111
                        depth: -2
                      - id: 22222222-2222-2222-2222-222222222222
                        type: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
                        name: D2
                        parent_id: 11111111-1111-1111-1111-111111111111
                        tenant_id: 11111111-1111-1111-1111-111111111111
                        depth: -1
                        metadata:
                          category: "finance"
                          short_description: "Mega Department"
                    page_info:
                      next_cursor: null
                      limit: 25

  /resource-group/v1/memberships:
    get:
      operationId: listMemberships
      tags: [memberships]
      summary: List memberships
      description: |
        Returns paginated memberships.

        - `$filter`: `resource_id` (eq, ne, in), `resource_type` (eq, ne, in), `group_id` (eq, ne, in)
        - `limit`: page size (1..200), default 25
        - `cursor`: opaque token for pagination
      x-odata-filter:
        supported_fields:
          resource_id: [eq, ne, in]
          resource_type: [eq, ne, in]
          group_id: [eq, ne, in]
      parameters:
        - $ref: '#/components/parameters/ODataFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
              example:
                items:
                  - group_id: 33333333-3333-3333-3333-333333333333
                    resource_id: R4
                    resource_type: "gts.cf.core.lms.course.v1~"
                  - group_id: 22222222-2222-2222-2222-222222222222
                    resource_id: R5
                    resource_type: "gts.cf.core.idp.user.v1~"
                page_info:
                  next_cursor: "eyJpZCI6Ijc3NzcuLi4ifQ"
                  limit: 25

  /resource-group/v1/memberships/{group_id}/{resource_type}/{resource_id}:
    parameters:
      - $ref: '#/components/parameters/MembershipGroupId'
      - $ref: '#/components/parameters/MembershipResourceType'
      - $ref: '#/components/parameters/MembershipResourceId'
    post:
      operationId: addMembership
      tags: [memberships]
      summary: Attach membership to a group
      responses:
        '201':
          description: Membership attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
              example:
                group_id: 33333333-3333-3333-3333-333333333333
                resource_id: R4
                resource_type: "gts.cf.core.lms.course.v1~"
    delete:
      operationId: deleteMembership
      tags: [memberships]
      summary: Detach membership from a group
      responses:
        '204':
          description: Membership detached

# ── Components ─────────────────────────────────────────────────────

components:

  parameters:
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 22222222-2222-2222-2222-222222222222

    MembershipGroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 33333333-3333-3333-3333-333333333333

    MembershipResourceType:
      name: resource_type
      in: path
      required: true
      description: "GTS type identifier of the resource (ends with `~`)."
      schema:
        type: string
      example: "gts.cf.core.idp.user.v1~"

    MembershipResourceId:
      name: resource_id
      in: path
      required: true
      schema:
        type: string
      example: R4

    DeleteForce:
      name: force
      in: query
      required: false
      schema:
        type: boolean
        default: false

    Limit:
      name: limit
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor token from a previous response (`next_cursor` or `prev_cursor`).
        Changing `$filter` with an existing cursor returns `400 FILTER_MISMATCH`.
      schema:
        type: string

    ODataFilter:
      name: $filter
      in: query
      required: false
      description: OData v4.01 filter expression.
      schema:
        type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            detail: Requested entity does not exist
            status: 404
            title: Resource not found
            trace_id: 01HXYZRGNOTFOUND
            type: https://api.example.com/errors/not-found

  schemas:

    # ── Groups ──

    Group:
      type: object
      description: |
        Group entity. Base fields: `id`, `type`, `name`, `parent_id`, `tenant_id`.
        Derived type fields (e.g. `category`, `barrier`) are nested inside a `metadata` object.
        DB stores derived fields in `metadata` JSONB column.
      required: [id, type, name, parent_id, tenant_id]
      properties:
        id:
          type: string
          format: uuid
          example: 22222222-2222-2222-2222-222222222222
        type:
          type: string
          description: "GTS type identifier (chained type path, ends with `~`)."
          example: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
        name:
          type: string
          example: D2
        parent_id:
          type: [string, 'null']
          format: uuid
          description: "Direct parent group (null for root groups)."
          example: 11111111-1111-1111-1111-111111111111
        tenant_id:
          type: string
          format: uuid
          readOnly: true
          description: "Computed by server. Derived from hierarchy — equals own id for tenant types, inherited from nearest tenant ancestor otherwise."
          example: 11111111-1111-1111-1111-111111111111
        metadata:
          type: object
          description: "Type-specific fields defined by the chained RG type schema. Schema varies per type."

    GroupPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        page_info:
          $ref: '#/components/schemas/PageInfo'

    GroupHierarchyItem:
      description: "Group with relative `depth` from reference group. Returned only by the descendants/ancestors endpoints."
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [depth]
          properties:
            depth:
              type: integer
              readOnly: true
              description: "Relative depth from reference group (0 = self, positive = descendants, negative = ancestors)."
              example: 1

    GroupHierarchyPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupHierarchyItem'
        page_info:
          $ref: '#/components/schemas/PageInfo'

    CreateGroupRequest:
      type: object
      description: "Derived type fields (e.g. `category`) are sent inside the `metadata` object."
      required: [type, name]
      properties:
        id:
          type: string
          format: uuid
          description: "Optional. If omitted, server generates a UUID."
        type:
          type: string
          description: "GTS type identifier (chained type path, ends with `~`)."
          example: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
        name:
          type: string
          example: D2
        parent_id:
          type: [string, 'null']
          format: uuid
          description: "Parent group ID."
          example: 11111111-1111-1111-1111-111111111111
        tenant_id:
          type: [string, 'null']
          format: uuid
          description: >-
            Optional target tenant for the created group. Omitted, the group is
            created in the caller's own tenant. Present and different, the
            create succeeds only when the caller's `create` AccessScope covers
            that tenant; otherwise the request is rejected with 404, which does
            not reveal whether the tenant exists. Rejected for tenant-typed
            groups, whose tenant is always their own id.
        metadata:
          type: object
          description: "Type-specific fields defined by the chained RG type schema."

    UpdateGroupRequest:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          example: "gts.cf.core.rg.type.v1~w.core.org.department.v1~"
        name:
          type: string
          example: D2
        parent_id:
          type: [string, 'null']
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
      additionalProperties: true

    # ── Memberships ──

    Membership:
      type: object
      required: [group_id, resource_id, resource_type]
      properties:
        group_id:
          type: string
          format: uuid
          example: 33333333-3333-3333-3333-333333333333
        resource_id:
          type: string
          example: R4
        resource_type:
          type: string
          example: "gts.cf.core.idp.user.v1~"

    MembershipPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        page_info:
          $ref: '#/components/schemas/PageInfo'

    # ── Common ──

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id: { type: string }

    PageInfo:
      type: object
      required: [limit]
      properties:
        next_cursor:
          type: string
          description: Opaque token for next page. Omitted on last page.
        prev_cursor:
          type: string
          description: Opaque token for previous page. Omitted on first page.
        limit:
          type: integer
          format: int64
