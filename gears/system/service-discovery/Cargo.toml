[package]
name = "cf-gears-service-discovery"
version = "0.4.5"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Service Discovery - system gear for service discovery and module management"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["development-tools"]
metadata.docs.rs.all-features = true

[features]
default = []
storage-k8s = ["dep:k8s-cluster-plugin"]
storage-postgres = ["dep:postgres-cluster-plugin"]
storage-redis = ["dep:redis-cluster-plugin"]
# Runs the shared-directory storage contract against real PostgreSQL, Redis and
# k3s containers (docs/TESTING.md 4), so a default `cargo test` never needs
# Docker. Every reference to the optional crates below is test-only, so this
# feature adds nothing to the gear's own artifact beyond the three storage
# backends. Run with `make test-integration LANE=service-discovery-storage` or
# `make test-service-discovery-k8s`.
integration = [
    "storage-k8s",
    "storage-postgres",
    "storage-redis",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "dep:kube",
    "dep:k8s-openapi",
    "dep:serde-saphyr",
    "dep:tempfile",
]

[lib]
name = "service_discovery"

[lints]
workspace = true

[dependencies]
cf-gears-system-sdks = { workspace = true, features = ["directory_grpc"] }
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
http = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
humantime-serde = { workspace = true }
utoipa = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }
inventory = { workspace = true }
cluster-sdk = { workspace = true }
serde_json = { workspace = true }
k8s-cluster-plugin = { package = "cf-k8s-cluster-plugin", path = "../cluster/plugins/k8s-cluster-plugin", optional = true }
postgres-cluster-plugin = { package = "cf-postgres-cluster-plugin", path = "../cluster/plugins/postgres-cluster-plugin", optional = true }
redis-cluster-plugin = { package = "cf-redis-cluster-plugin", path = "../cluster/plugins/redis-cluster-plugin", optional = true }
# Real-backend fixtures for the `integration` feature; see `[features]`.
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true, features = ["k3s"] }
kube = { workspace = true, optional = true, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { workspace = true, optional = true, features = ["latest"] }
serde-saphyr = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
toolkit = { workspace = true, features = ["test-support"] }
tower = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util = { workspace = true }
api_gateway = { path = "../api-gateway", package = "cf-gears-api-gateway" }
serde_json = { workspace = true }
toolkit-transport-grpc = { workspace = true }
secrecy = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
standalone-cluster-plugin = { workspace = true }
# The workspace's pinned PostgreSQL, Redis and k3s images (docs/TESTING.md 4.4).
test-containers = { workspace = true }
