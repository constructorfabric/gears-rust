[package]
name = "cf-gears-types-registry-sdk"
version = "0.4.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SDK for types-registry gear: API trait, GTS entity types, and error definitions"
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["development-tools"]
metadata.docs.rs.all-features = true

[lib]
name = "types_registry_sdk"

[lints]
workspace = true

[features]
# Default: production build, no test utilities.
default = []
# In-memory clients and fixtures for consumer tests.
test-util = ["dep:toolkit", "dep:parking_lot"]
# Both REST clients and their private wire DTOs.
rest-client = ["dep:serde", "dep:toolkit-http", "dep:bytes", "dep:secrecy", "toolkit-contract/rest-client"]
# The HTTP binding descriptors `#[toolkit::provides(transports = [.., rest])]` validates.
rest-server = []
# W3C trace propagation and RED client metrics on the REST client, as a generated one has.
otel = ["rest-client", "toolkit-contract/otel"]

# Needs the resolving clients `#[toolkit::consumes]` registers.
[[test]]
name = "consumes_remote_test"
required-features = ["rest-client"]

[dependencies]
# API errors and client-side validation.
toolkit-canonical-errors = { workspace = true }

# Core dependencies for API trait
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
serde_json = { workspace = true }

# GTS identifiers and schemas.
gts = { workspace = true }
toolkit-gts = { workspace = true }

# Contracts and security contexts.
toolkit-contract = { workspace = true }
toolkit-security = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
# Async deadlines, polling and cancellation.
tokio = { workspace = true, features = ["time", "macros"] }
# `PublisherVersion`: SemVer parsing and precedence.
semver = { workspace = true }
tokio-util = { workspace = true }
# Jittered backoff of reconciliation passes and transport retries.
rand = { workspace = true }

# Wire DTOs and both REST clients (`rest-client`); `secrecy` exposes the caller's bearer
# only to the header it is sent in.
serde = { workspace = true, optional = true }
toolkit-http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

# Test doubles only (`test-util`).
toolkit = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
# Paused-clock tests of the submit/poll deadline and polling.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# Round-trip and consistency properties of the SDK's codecs and orderings.
proptest = { workspace = true }
# Captures reconciliation's events and spans in tests.
tracing-subscriber = { workspace = true }
# The test doubles also compile under `cfg(test)` without `test-util`.
toolkit = { workspace = true }
parking_lot = { workspace = true }
# The README's examples compile as doctests.
anyhow = { workspace = true }
