[package]
name = "cf-gears-graph-storage-sdk"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SDK for the graph-storage gear: client trait, transport-agnostic models, plugin contracts, GTS constants"

[lib]
name = "graph_storage_sdk"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }

toolkit-canonical-errors = { workspace = true }
toolkit-gts = { workspace = true }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-odata-macros = { workspace = true }
toolkit-security = { workspace = true }
