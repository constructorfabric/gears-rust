[package]
name = "cf-gears-llm-gateway"
description = "LLM Gateway gear: Open Responses API, request pipeline, and provider plugin routing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["constructorfabric", "cf-gears"]
categories = ["api-bindings"]
metadata.docs.rs.all-features = true

[lib]
name = "llm_gateway"

[lints]
workspace = true

[dependencies]
llm-gateway-sdk = { workspace = true }
model-registry-sdk = { workspace = true }
authz-resolver-sdk = { workspace = true }
types-registry-sdk = { workspace = true }
quota-enforcement-sdk = { workspace = true }
# S2S identity (`exchange_client_credentials`) for settle and usage delivery.
authn-resolver-sdk = { package = "cf-gears-authn-resolver-sdk", version = "0.3.40", path = "../../system/authn-resolver/authn-resolver-sdk" }
# Named by `#[toolkit::gear(deps = [...])]`.
types-registry = { workspace = true }
authz-resolver = { workspace = true }
authn-resolver = { workspace = true }
quota-enforcement = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros"] }
jsonschema = { workspace = true }
# Jitter of the settle retry backoff.
rand = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-core = { workspace = true }
humantime-serde = { workspace = true }
rust_decimal = { workspace = true }
time = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true }
# Link-time GTS permission catalog (`src/gts/permissions.rs`).
toolkit-gts = { workspace = true }
# `gts_instance!` expansions reference `::gts::*` paths.
gts = { workspace = true }

[dev-dependencies]
# `ODataQuery` / `Page` in the Model Registry client fake.
toolkit-odata = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# `ServiceExt::oneshot` drives one request through the assembled `Router`.
tower = { workspace = true }
# In-memory types-registry client for `GtsPluginDirectory` tests.
types-registry-sdk = { workspace = true, features = ["test-util"] }
# Captures the failure log of the pipeline.
tracing-test = { workspace = true, features = ["no-env-filter"] }
