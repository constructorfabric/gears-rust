# Created: 2026-08-12 by Constructor Tech
[package]
name = "cf-gears-settings-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Settings Service gear: declaration registry, scoped value resolution, and staged apply"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "settings-service"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lints]
workspace = true

[dependencies]
# Trait boundaries of consumed SDKs are `CanonicalError` (ADR 0005).
toolkit-canonical-errors = { workspace = true }
settings-service-sdk = { workspace = true }
authz-resolver-sdk = { workspace = true }
authz-resolver = { workspace = true }
uuid = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

toolkit = { workspace = true }
toolkit-db = { workspace = true }
toolkit-security = { workspace = true }
toolkit-macros = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
