[package]
name = "cf-gears-credstore-v2"
description = "credstore v2 gear (temporary, assembled over several PRs)"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "credstore_v2"

[lints]
workspace = true

[dependencies]
# Aliased so the v2 sources keep `use credstore_sdk::…` while depending on the v2 SDK package (the v1 `credstore-sdk` is a separate crate).
credstore-sdk = { package = "cf-gears-credstore-v2-sdk", version = "0.1.0", path = "../credstore-sdk" }
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }
toolkit-db = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
toolkit-db = { workspace = true, features = ["sqlite"] }
# The PostgreSQL migration suite behind `integration`: a real PostgreSQL in a
# container, since what SQLite accepts PostgreSQL may refuse.
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
test-containers = { workspace = true }

[features]
# `tests/pg_migrations_test.rs`: `m0002_value_versions` on a real PostgreSQL via
# testcontainers, Docker required (`make test-integration LANE=credstore-pg`).
# Brings the PostgreSQL driver in for that lane only; the lib leaves the backend
# to the server that hosts it.
integration = ["toolkit-db/pg"]
