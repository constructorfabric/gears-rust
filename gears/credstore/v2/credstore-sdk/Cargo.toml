[package]
name = "cf-gears-credstore-v2-sdk"
description = "SDK for credstore v2 (temporary, assembled over several PRs): API traits, models, and error definitions"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "cf-gears-system"]
categories = ["security"]
metadata.docs.rs.all-features = true

[lib]
name = "credstore_v2_sdk"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
schemars = { workspace = true }

# GTS types
gts = { workspace = true }
gts-macros = { workspace = true }
toolkit-gts = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-security = { workspace = true }
toolkit-odata = { workspace = true }

# Domain types owned by tenant-resolver
tenant-resolver-sdk = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
