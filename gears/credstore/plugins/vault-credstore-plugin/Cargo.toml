[package]
name = "cf-gears-vault-credstore-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CredStore plugin storing secret values in HashiCorp Vault / OpenBao (KV v2)"
repository.workspace = true
keywords = ["constructorfabric", "cf-gears"]
metadata.docs.rs.all-features = true

[lib]
name = "vault_credstore_plugin"

[lints]
workspace = true

[dependencies]
# Local dependencies
credstore-sdk = { package = "cf-gears-credstore-sdk", version = "0.2.15", path = "../../credstore-sdk" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.8", path = "../../../system/types-registry/types-registry-sdk" }
types-registry = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

# Data structures
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client for the Vault / OpenBao KV v2 REST API
reqwest = { workspace = true, features = ["json"] }

# Value encoding for the KV v2 "value" field
base64 = { workspace = true }

# Logging
tracing = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
serde-saphyr = { workspace = true }
httpmock = { workspace = true }
temp-env = { workspace = true }
