[package]
name = "cf-gears-credstore"
description = "credstore gear module"
version = "0.6.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "cf-gears-system"]
categories = ["security"]
metadata.docs.rs.all-features = true

[lib]
name = "credstore"

[lints]
workspace = true

[dependencies]
credstore-sdk = { workspace = true }
# Audit events for secret reads and writes (`cpt-cf-credstore-nfr-audit`).
# Resolved lazily from the ClientHub; the broker is never a hard init dependency.
event-broker-sdk = { workspace = true }
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }
toolkit-db = { workspace = true }
toolkit-canonical-errors = { workspace = true }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
authz-resolver-sdk = { workspace = true }
authz-resolver = { workspace = true }
tenant-resolver-sdk = { workspace = true }
tenant-resolver = { workspace = true }
types-registry-sdk = { workspace = true }
types-registry = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true }
# Bounded-concurrency value reads in secret-mode list (ADR-0005 §4.6):
# `stream::iter(...).buffer_unordered(SECRET_READ_CONCURRENCY)`.
futures = { workspace = true }
# SHA-256 for the weak ETag hash in the REST layer (AWS-LC, the workspace's
# FIPS-capable crypto backend).
aws-lc-rs = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# `Utc::now()` stamps the audit event's `occurred_at`.
chrono = { workspace = true, features = ["clock"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
utoipa = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics"] }
# Link-time GTS permission catalog (`src/gts/permissions.rs`): declares
# AuthzPermissionV1 instances into the toolkit-gts inventory that
# types-registry aggregates at boot.
toolkit-gts = { workspace = true }
# Direct dep needed because `gts_instance!` expansions reference `::gts::*`
# paths (the compile-time `<S as GtsSchema>::SCHEMA_ID` prefix asserts).
# Without this the proc-macro emits `::gts::…` identifiers that cannot be
# resolved.
gts = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
types-registry-sdk = { workspace = true, features = ["test-util"] }

[features]
test-support = ["dep:opentelemetry_sdk"]

[dependencies.opentelemetry_sdk]
workspace = true
features = ["metrics", "testing"]
optional = true
