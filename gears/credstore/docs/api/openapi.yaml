components:
  schemas:
    CredentialDto:
      description: 'Response body for both `GET /credstore/v1/credentials/{ref}` and each item

        of `GET /credstore/v1/credentials` (ADR-0004 Amendment A, "Why one item

        shape, and why writes do not follow `$select`"): one shape for both

        addresses. `secret` is populated only when `$select` names it (point

        read) or in secret mode (collection) and only for an item the caller may

        read; absent from the wire entirely otherwise — including when the item''s

        value could not be served (refused, missing, fingerprint mismatch —

        omitted by the domain layer already, never reported as an error for one

        item).


        `Debug` is hand-written to redact `secret`.'
      properties:
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        fallback:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FallbackDto'
            description: 'The caller''s own row''s suppression policy; absent when the caller

              holds no row under the reference (`status: none`).'
        inheritance:
          $ref: '#/components/schemas/InheritanceStatusDto'
        owner_id:
          description: 'Subject id that created the caller''s own row; absent iff `status` is

            `none`. Never populated from an ancestor''s row — an inherited entry

            must not disclose identifiers from another tenant, and a caller who

            needs the ancestor''s owner acts in that tenant''s context and reads

            it there.'
          type:
          - string
          - 'null'
        reference:
          type: string
        secret:
          description: 'The decrypted secret — present only when `$select` names it (point

            read) or in secret mode (collection), and only for an item the caller

            may read.'
          type:
          - string
          - 'null'
        sharing:
          $ref: '#/components/schemas/SharingModeDto'
        status:
          $ref: '#/components/schemas/CredentialStatusDto'
        type:
          type: string
        updated_at:
          description: 'The caller''s own row''s last-write instant; absent iff `status` is

            `none`.'
          format: date-time
          type:
          - string
          - 'null'
        version:
          description: The caller's own row's version; absent iff `status` is `none`.
          format: int64
          type:
          - integer
          - 'null'
      required:
      - reference
      - type
      - sharing
      - status
      - inheritance
      type: object
    CredentialPatchDto:
      additionalProperties: false
      description: 'Request body for `PATCH /credstore/v1/credentials/{ref}` (ADR-0004): an

        RFC 7396 JSON Merge Patch. Every field is tri-state (`Option<Option<T>>`):

        absent (untouched), explicit `null`, or a value. `secret_type`/`sharing`/

        `fallback` have no valid `null` state on the wire (rejected as

        `NULL_NOT_ALLOWED` by the handler, since none is a nullable column);

        `expires_at`/`secret` do — `null` clears/removes them.


        `Debug` is hand-written to redact `secret`.'
      properties:
        expires_at:
          type:
          - string
          - 'null'
        fallback:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FallbackDto'
        secret:
          type:
          - string
          - 'null'
        sharing:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SharingModeDto'
        type:
          type:
          - string
          - 'null'
      type: object
    CredentialStatusDto:
      description: 'The caller''s own-row status for the REST transport layer (ADR-0004, "Two

        representations").'
      enum:
      - none
      - declared
      - active
      type: string
    FallbackDto:
      description: Suppression policy for the REST transport layer (ADR-0004, "Suppression").
      enum:
      - inherit
      - none
      type: string
    InheritanceStatusDto:
      description: 'The effective-row inheritance status for the REST transport layer

        (ADR-0004, "Two representations").'
      enum:
      - own
      - inherited
      - overridden
      - suppressed
      type: string
    PageInfo:
      properties:
        limit:
          format: int64
          minimum: 0
          type: integer
        next_cursor:
          type:
          - string
          - 'null'
        prev_cursor:
          type:
          - string
          - 'null'
      required:
      - limit
      type: object
    Page_CredentialDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CredentialDto'
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page_info
      type: object
    Problem:
      description: RFC 9457 problem+json. `context` varies by error category.
      properties:
        context:
          type: object
        detail:
          type: string
        instance:
          type: string
        status:
          format: int32
          type: integer
        title:
          type: string
        trace_id:
          type: string
        type:
          type: string
      required:
      - type
      - title
      - status
      - detail
      - context
      type: object
    PutCredentialRequestDto:
      additionalProperties: false
      description: 'Request body for `PUT /credstore/v1/credentials/{ref}` (ADR-0004; tri-state

        `secret` per Amendment B): a whole-credential replace. `secret` is

        tri-state (`Option<Option<String>>`, like [`CredentialPatchDto::secret`])

        so its *absence* — rejected with the typed `SECRET_REQUIRED` reason rather

        than a generic deserialization error — can be told apart from an explicit

        JSON `null` (no value is written: a value-less create, or a value

        removal/no-op on replace) and from a string (the value is written).


        `Debug` is hand-written to redact `secret`.'
      properties:
        expires_at:
          description: 'Expiry instant (RFC 3339); only for expirable types. A `PUT` is a

            whole-value replace: omitting `expires_at` clears a stored expiry.'
          format: date-time
          type:
          - string
          - 'null'
        fallback:
          $ref: '#/components/schemas/FallbackDto'
          description: Suppression policy; defaults to `inherit`.
        secret:
          description: 'The secret to write. Required at the wire — absent is `400

            SECRET_REQUIRED` — but once present it is tri-state: a string writes a

            value, an explicit `null` writes none (ADR-0004 Amendment B).'
          type:
          - string
          - 'null'
        sharing:
          $ref: '#/components/schemas/SharingModeDto'
          description: Sharing mode — required (ADR-0004).
        type:
          description: 'Full GTS type id. Required on create; on replace it must equal the

            stored type (`TYPE_IMMUTABLE` otherwise).'
          type:
          - string
          - 'null'
      required:
      - sharing
      type: object
    SharingModeDto:
      description: Sharing mode for the REST transport layer.
      enum:
      - private
      - tenant
      - shared
      type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
