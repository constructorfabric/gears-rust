# Standalone Event Broker worker configuration.
#
# The ordinary cf-gears-event-broker-server run wires no tenant authenticator.
# With a reachable Directory and auth enabled it exits 1 before serving tenant
# routes, including a fixture-enabled build run without its opt-in flag.
# Remote production tenant authentication is tracked in #5764.
#
# For the local authenticated demo, run from the repository root with the
# default Make target paths. The build enables e2e-flight-control on the
# one-gear worker and the event-broker profile on the separate Core fixture.
#   make e2e-event-broker-build
# Start Core in one terminal. It serves HTTP on 8081 and Directory and private
# bearer validation over gRPC on 9091.
#   target/debug/test-flight-control --config config/event-broker-test-flight-control.yaml run
# Start the worker in another terminal. It serves HTTP on 8080.
#   TOOLKIT_DIRECTORY_ENDPOINT=http://127.0.0.1:9091 \
#   E2E_FLIGHT_CONTROL_ENDPOINT=http://127.0.0.1:9091 \
#   target/eb-e2e/cf-gears-event-broker-server --config config/event-broker-standalone.yaml \
#     --e2e-flight-control run
#
# The public user bearer identifies the caller. The worker uses a separate
# workload credential on the private validation service. An invalid user
# bearer returns 401. A failed private RPC, including workload rejection,
# returns 503 with Retry-After: 5.
#
# Wait for HTTP 200 from /readyz. /healthz reports liveness. The authenticated
# catalogue requests below exercise tenant authentication.
#   curl -fsS http://127.0.0.1:8080/readyz
# The worker publishes the base schemas at startup. After readiness, run this
# block in Bash with curl and jq to register the three dependent demo documents.
#   (
#     set -eu
#     core=http://127.0.0.1:8081
#     auth='x-toolkit-internal-token: eb-local-demo-workload-credential'
#     location=$(curl -fsS --max-time 3 -D - -o /dev/null -H "$auth" \
#       -H 'Idempotency-Key: eb-standalone-demo-v1' -H 'Content-Type: application/json' \
#       --data-binary @testing/e2e/suites/event_broker/fixtures/demo_entities.json \
#       "$core/types-registry/v2/platform/entities" |
#       awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2 }')
#     case "$location" in
#       /types-registry/v2/platform/operations/*) ;;
#       *) echo 'Missing registry operation Location' >&2; exit 1 ;;
#     esac
#     for attempt in $(seq 30); do
#       operation=$(curl -fsS --max-time 3 -H "$auth" "$core$location")
#       if jq -e '.status == "completed"' >/dev/null <<<"$operation"; then
#         jq -e '(.items | length == 3) and all(.items[]; .error == null and
#           (.status == "succeeded" or .status == "unchanged"))' <<<"$operation"
#         exit
#       fi
#       sleep 1
#     done
#     echo 'Demo registry operation did not complete' >&2
#     exit 1
#   )
#
# Replaying the block with the same idempotency key checks the same operation.
# After the worker's next specification refresh, use the checked-in demo user
# bearer to read the topic and both event types.
#   curl -fsS -H 'Authorization: Bearer eb-e2e-principal-a' \
#     http://127.0.0.1:8080/event-broker/v1/topics
#   curl -fsS -H 'Authorization: Bearer eb-e2e-principal-a' \
#     http://127.0.0.1:8080/event-broker/v1/event-types
# The worker publishes OpenAPI at /.well-known/openapi.json with /openapi.json
# as an alias.
#   curl -fsS http://127.0.0.1:8080/.well-known/openapi.json

server:
  home_dir: "~/.cf-gears-event-broker"

logging:
  default:
    console_level: info
    console_format: json

oop_http:
  listen_addr: "127.0.0.1:8080"
  advertise_uri: "http://127.0.0.1:8080"
  allow_loopback_advertise: true
  auth_disabled: false
  request_limits:
    body_limit_bytes: 16777216
    request_timeout: 30s
  internal_auth:
    provider: shared_secret
    secret: "eb-local-demo-workload-credential"
    peer_name: e2e-platform

database:
  servers: {}

gears:
  event-broker:
    clients:
      consumes:
        types-registry:
          endpoint: "http://127.0.0.1:8081"
        authz-resolver:
          endpoint: "http://127.0.0.1:8081"
    database:
      # The gear's own database: ingest and delivery metadata only - cursors,
      # consumer groups, producers, the specification cache and the ingest
      # outbox. The event log is not among them; it lives in the storage
      # backend's own database, configured under `backends` below.
      #
      # `engine` must be explicit here - there's no global `servers:`
      # template to infer it from (see `config/quickstart.yaml`'s
      # `sqlite_users` template for the alternative, multi-gear-sharing
      # style).
      engine: sqlite
      file: "event_broker.db" # -> ~/.cf-gears-event-broker/event-broker/event_broker.db
      # These are not optional tuning. The config-driven connect path applies
      # no SQLite defaults of its own, so without them the database runs with
      # `busy_timeout = 0` on a rollback journal: a second writer is refused
      # immediately with "database is locked" rather than waiting, and readers
      # block writers. Concurrent publishes then surface that as a 503.
      params:
        journal_mode: "WAL"
        busy_timeout: "5000"
        synchronous: "NORMAL"
      #
      # PostgreSQL or MySQL/MariaDB instead: replace `engine`, `file` and
      # `params` above. A DSN or the separate fields both work; `params` on
      # PostgreSQL are session settings, so `search_path` puts the gear's
      # tables in a schema of its own (the schema must exist).
      #
      #   engine: postgres
      #   dsn: "postgres://event_broker:${EB_DB_PASSWORD}@localhost:5432/cf_gears"
      #   params:
      #     search_path: "event_broker"
      #
      #   engine: mysql
      #   host: "localhost"
      #   port: 3306
      #   user: "event_broker"
      #   password: "${EB_DB_PASSWORD}"
      #   dbname: "event_broker"
    config:
      mode: standalone
      process:
        cluster:
          mode: memory
      workers:
        specification_refresh_interval_secs: 1
      # Every storage backend instance this deployment runs, keyed by registry
      # name. An entry is a GTS backend type and then that backend's own
      # settings beside it: everything beside `type` belongs to the named
      # backend, which validates it, so a second backend's entry looks nothing
      # like this one and the gear needs no change. Checked at startup against
      # the backends this build links, so a type nothing implements fails to
      # boot. Credentials are written as `${VAR}` references; the backend
      # expands them when it is built.
      backends:
        # The SQLite backend: the event log is a file, the deployment's second
        # SQLite file beside the gear's own database, and it survives a
        # restart. Plugin settings have no home-dir-relative form, so `path`
        # spells out `home_dir` above through `${HOME}`; move both together.
        # The gear's directory exists before the backend opens the file.
        # `${HOME}` must be set; on Windows set `HOME` or write an absolute path.
        main:
          type: "gts.cf.core.events.backend.v1~cf.core.backend.sqlite.v1~"
          path: "${HOME}/.cf-gears-event-broker/event-broker/events.db"

      # Which registry entry holds each topic's log. The instance-less key is
      # required, so every topic resolves to an entry; a key naming one topic
      # moves that topic elsewhere.
      backend_routing:
        "gts.cf.core.events.topic.v1~": main

      # Per-topic settings, keyed by topic GTS identifier. A key with an empty
      # instance part supplies the settings every topic of that type shares.
      # `partitions` is omitted here on purpose: configuration always carries an
      # entry for the topic type, and its built-in count is 8.
      topics:
        "gts.cf.core.events.topic.v1~": {}
