# CF/Gears Example Server Configuration
# Updated to use the new configuration structure
#
# No database. With the default features this profile is for `check` only, which
# parses/loads the configuration and exits (it does not initialize gears or
# validate startup prerequisites): the embedded types registry needs its database
# to admit the GTS documents its co-hosted resolvers publish, so `run` stops at
# startup with a configuration error. Use config/quickstart.yaml (SQLite), or a
# remote managed registry for the Registry APIs.

# Core server configuration (global section)
server:
  home_dir: "~/.cf-gears"

# Logging configuration (global section)
logging:
  default:
    console_level: info
    file: "logs/cf-gears.log"
    file_level: warn
    max_age_days: 28
    max_backups: 3
    max_size_mb: 1000

# Per-gear configurations using new structure
gears:
  api-gateway:
    # No database configuration needed for api-gateway
    config:
      bind_addr: "127.0.0.1:8087"
      enable_docs: true
      cors_enabled: true
      auth_disabled: true
