{
  "server": {
    "home_dir": "~/.cf-gears-event-broker-flight-control"
  },
  "logging": {
    "default": {
      "console_level": "debug",
      "console_format": "json"
    }
  },
  "database": {
    "servers": {
      "sqlite": {
        "engine": "sqlite"
      }
    }
  },
  "gears": {
    "api-gateway": {
      "config": {
        "bind_addr": "127.0.0.1:8081",
        "enable_docs": true,
        "auth_disabled": false,
        "require_auth_by_default": true,
        "internal_auth": {
          "provider": "shared_secret",
          "secret": "eb-local-demo-workload-credential",
          "peer_name": "e2e-platform"
        }
      }
    },
    "grpc-hub": {
      "config": {
        "listen_addr": "127.0.0.1:9091",
        "internal_auth": {
          "provider": "shared_secret",
          "secret": "eb-local-demo-workload-credential",
          "peer_name": "e2e-platform"
        },
        "internal_auth_enforcement": "required"
      }
    },
    "service-discovery": {
      "config": {
        "trusted_registrars": [
          "e2e-platform"
        ]
      }
    },
    "types-registry": {
      "database": {
        "server": "sqlite",
        "file": "registry.db",
        "params": {
          "busy_timeout": "5000"
        }
      },
      "config": {
        "registration_policy": {
          "gts.cf.core.events.topic.v1~cf.core.demo.*": {
            "allowed_vendors": [
              "cf"
            ]
          },
          "gts.cf.core.events.topic.v1~cf.e2e.event_broker.*": {
            "allowed_vendors": [
              "cf"
            ]
          },
          "gts.cf.core.events.event.v1~cf.core.demo.*": {
            "allowed_vendors": [
              "cf"
            ]
          },
          "gts.cf.core.events.event.v1~cf.e2e.event_broker.*": {
            "allowed_vendors": [
              "cf"
            ]
          }
        }
      }
    },
    "authn-resolver": {
      "config": {
        "vendor": "constructorfabric"
      }
    },
    "static-authn-plugin": {
      "config": {
        "vendor": "constructorfabric",
        "mode": "static_tokens",
        "tokens": [
          {
            "token": "eb-e2e-principal-a",
            "identity": {
              "subject_id": "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa",
              "subject_tenant_id": "00000000-0000-0000-0000-000000000002",
              "subject_type": "user",
              "token_scopes": []
            }
          },
          {
            "token": "eb-e2e-principal-b",
            "identity": {
              "subject_id": "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb",
              "subject_tenant_id": "00000000-0000-0000-0000-000000000002",
              "subject_type": "user",
              "token_scopes": []
            }
          },
          {
            "token": "eb-e2e-principal-c",
            "identity": {
              "subject_id": "cccccccc-cccc-cccc-cccc-cccccccccccc",
              "subject_tenant_id": "00000000-0000-0000-0000-000000000003",
              "subject_type": "user",
              "token_scopes": []
            }
          },
          {
            "token": "eb-e2e-principal-a-in-tb",
            "identity": {
              "subject_id": "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa",
              "subject_tenant_id": "00000000-0000-0000-0000-000000000003",
