[package]
name = "cf-gears-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Dependencies for fuzzing internal crates
toolkit-odata = { package = "cf-gears-toolkit-odata", path = "../../libs/toolkit-odata", features = [] }
toolkit-http-proxy = { package = "cf-gears-toolkit-http-proxy", path = "../../libs/toolkit-http-proxy" }
http = "1"

[[bin]]
name = "fuzz_odata_filter"
path = "fuzz_targets/fuzz_odata_filter.rs"
test = false
doc = false

[[bin]]
name = "fuzz_odata_cursor"
path = "fuzz_targets/fuzz_odata_cursor.rs"
test = false
doc = false

[[bin]]
name = "fuzz_odata_orderby"
path = "fuzz_targets/fuzz_odata_orderby.rs"
test = false
doc = false

[[bin]]
name = "fuzz_http_proxy_sanitize"
path = "fuzz_targets/fuzz_http_proxy_sanitize.rs"
test = false
doc = false
