# SonarQube Cloud automatic analysis. Only the duplication scope is set here; everything else
# keeps the project's defaults.

# BSS Rating engine generations keep byte-for-byte copies of the first-party code they evaluate
# with, so a released generation cannot change (gears/bss/rating/docs/ADR/
# 0006-cpt-cf-bss-rating-adr-engine-generations.md). The copies duplicate their sources by design;
# `make check-engine-generations` keeps them verbatim. They are still analysed for issues.
sonar.cpd.exclusions=gears/bss/rating/rating-engine/*/vendor/**
