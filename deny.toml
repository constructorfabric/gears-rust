# cargo-deny configuration for security, licenses, bans, and sources.
# Docs: https://embarkstudios.github.io/cargo-deny/

################################################################################
# Dependency graph construction
################################################################################
[graph]
# Optionally restrict targets to check (kept commented by default).
# targets = [
#   "x86_64-unknown-linux-gnu",
#   { triple = "wasm32-unknown-unknown", features = ["atomics"] },
# ]
# Audit the dependency trees of optional features too. `magika` pulls in
# ort/ndarray, which the default feature set does not.
# `all-features = true` is not used yet: it also enables the Windows FIPS
# provider (rustls-cng-crypto), whose rustls-webpki 0.102 has open advisories.
features = ["magika"]
# all-features = true
# exclude-dev = true
# exclude-unpublished = false

################################################################################
# Security advisories (RustSec)
################################################################################
[advisories]
# Local clone/cache of the RustSec advisory DB
db-path = ".cargo/advisory-db"
# Upstream advisory DBs to use
db-urls = ["https://github.com/RustSec/advisory-db"]

# How to treat "unmaintained" advisories:
# one of: "all" | "workspace" | "transitive" | "none"
# (This is NOT a severity level; it scopes where the rule applies.)
unmaintained = "workspace"

# Yanked crate versions still use classic lint levels.
# one of: "deny" | "warn" | "allow"
yanked = "warn"

# List of advisory IDs to ignore (RUSTSEC-YYYY-XXXX, etc.)
ignore = [
  # "RUSTSEC-0000-0000",
  "RUSTSEC-2023-0071", # Marvin Attack timing sidechannel in rsa 0.9 — dev-only dep of rustls-corecrypto-provider; used solely for RSA-PSS *verification* (public-key op, no private key involved) in rsa_pss_apple_salt_length_matches_rfc8017 test; also a dev-only dep of cf-gears-firebase-authn-plugin, whose tests sign fixture tokens with a throwaway key generated per run (no secret is at stake, no production code links it); no safe upgrade available; advisory itself permits "local use on a non-compromised computer"
  # RUSTSEC-2026-0173 (proc-macro-error2 unmaintained) was removed: the crate is no
  # longer in the dependency graph at all. Our own proc-macro crates emit diagnostics
  # via syn::Error -> compile_error!, and sea-bae 0.2.2 dropped proc-macro-error2.
  # It is now hard-banned under [bans].deny below so it cannot silently return.
  "RUSTSEC-2026-0367", # zip <9 keeps SUID/SGID/sticky bits from a ZIP's external_attributes on extraction to disk — transitive via docx-rust 0.1.11 (zip ^4) and calamine 0.36.1 (zip ^8.6; pulled in by kreuzberg 4.10.4, which itself accepts zip >=7 and so shares that 8.6)→cf-gears-file-parser→cf-gears-example-server (example app only). Not reachable: file-parser reads DOCX/XLSX entries in memory through those crates and never calls ZipArchive::extract or ZipStreamReader::extract, and no code of ours extracts an archive to disk. No usable fix: docx-rust pins zip ^4 and has had no release since 0.1.11; kreuzberg 4.10.4 requires calamine ^0.36.1, and calamine 0.36 requires zip ^8.6. Remove once DOCX parsing moves off docx-rust (or docx-rust allows zip >=9) and kreuzberg/xberg allows a calamine release on zip >=9.
  "RUSTSEC-2026-0368", # zip <9 ZipArchive::extract creates symlinks whose attacker-controlled targets point outside the destination directory — same transitive path and justification as RUSTSEC-2026-0367 (in-memory entry reads only, extract never called). Remove with it.
  "RUSTSEC-2026-0369", # zip <9 extract applies Unix permissions through symlinks without confining the target — same transitive path and justification as RUSTSEC-2026-0367 (in-memory entry reads only, extract never called). Remove with it.
  "RUSTSEC-2026-0429", # zip <9 ZipArchive::extract aborts the process on a symlink entry whose declared uncompressed size exceeds the allocator limit (DoS only, no memory unsafety) — same transitive path and justification as RUSTSEC-2026-0367 (in-memory entry reads only, extract never called). Remove with it.
  "RUSTSEC-2026-0436", # calamine <0.38 panic / unbounded allocation (OOM) in the CFB/OLE2 (legacy .xls) parser on malformed input — DoS only, no memory unsafety. Transitive via kreuzberg 4.10.4 (calamine ^0.36.1)→cf-gears-file-parser→cf-gears-example-server (optional `file-parser` feature, example app only). No usable fix: the fix landed in calamine 0.38.0, but every kreuzberg/xberg release still caps calamine below it (kreuzberg 4.10.4 and xberg 1.3.10 require ^0.36.1; kreuzberg-lts main pins 0.37.0; xberg main moved to 0.38.0 in https://github.com/xberg-io/xberg/pull/2416 but it is unreleased), and 0.36→0.38 is semver-incompatible so [patch] cannot apply. Remove once a kreuzberg or xberg release allows calamine >=0.38 and file-parser moves to it (#4846).
]

# Note:
# - Modern cargo-deny versions treat vulnerabilities as hard errors by default.
# - If you must silence a specific vuln, add its ID to `ignore` above.

################################################################################
# License policy
################################################################################
[licenses]
# Allow-list of SPDX license IDs
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "Zlib",
  "CC0-1.0",
  "OpenSSL",
]

# Confidence threshold (0.0..1.0) for license text detection
confidence-threshold = 0.8

# Per-crate exceptions (license(s) allowed only for a specific crate/version)
exceptions = [
  # aws-lc-fips-sys vendors AWS-LC-FIPS sources carrying an OpenSSL license term
  # as part of the upstream license expression. We do not allow OpenSSL globally,
  # so keep this exception pinned to the reviewed crate release only.
  { name = "aws-lc-fips-sys", version = "=0.13.14", allow = ["OpenSSL"] },
]

# Private workspace crates handling
[licenses.private]
# If true, ignore unpublished/private workspace crates for license checks
ignore = false
# Private registries considered "published" for the rule above
registries = [
  # "https://example.com/registry",
]

################################################################################
# Duplicate versions / wildcards / bans
################################################################################
[bans]
# Multiple versions of the same crate in the graph
multiple-versions = "warn"

# Version wildcards like "*"
wildcards = "allow"

# How to highlight in dot graphs when multiple versions are present
# "lowest-version" | "simplest-path" | "all"
highlight = "all"

# Default lint level for `default-features` on workspace deps (requires the
# `workspace-dependencies` feature in cargo-deny to take effect)
workspace-default-features = "allow"

# Allow-list of specific crates (use carefully)
allow = [
  # { name = "ansi_term", version = "=0.11.0" },
]

# Deny-list of specific crates (optionally with version ranges/wrappers)
deny = [
  # { name = "some-bad-crate", version = "*", wrappers = [] },
  #
  # proc-macro-error2 / proc-macro-error-attr2 are unmaintained (RUSTSEC-2026-0173).
  # We removed every use of them: all six workspace proc-macro crates report
  # diagnostics with syn::Error -> compile_error!. The crate can only come back
  # transitively (sea-orm-macros -> sea-bae dropped it in 0.2.2), so ban it outright
  # instead of relying on `unmaintained = "workspace"` to happen to not flag it.
  { name = "proc-macro-error2" },
  { name = "proc-macro-error-attr2" },
  # The original, equally unmaintained crate these two forked from.
  { name = "proc-macro-error" },
  { name = "proc-macro-error-attr" },
]

# Skip specific crate versions when checking for duplicates
skip = [
  # { name = "ansi_term", version = "=0.11.0" },
]

# Remove a crate subtree entirely from the graph for checks (stronger than skip)
skip-tree = [
  # { name = "ansi_term", version = "=0.11.0", depth = 1 },
]

################################################################################
# Allowed sources (registries and git)
################################################################################
[sources]
# Non-allowed registry encountered
unknown-registry = "warn"

# Non-allowed git source encountered
unknown-git = "warn"

# Allowed crate registries (empty list => none allowed)
# Default crates.io index:
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allowed git repositories (empty => none)
allow-git = []
