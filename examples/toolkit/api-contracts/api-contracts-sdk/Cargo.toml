[package]
name = "cf-api-contracts-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SDK for the api-contracts example module — PaymentApi contract, models, and errors"
rust-version.workspace = true
publish = false

[features]
default = []
# Enables both generated clients: the plain `<Trait>RestClient` and its
# directory-resolving wrapper `<Trait>RestResolvingClient`. Transitively pulls
# `canonical-errors` so `From<TransportError> for CanonicalError` is available.
rest-client = [
    "toolkit-contract/rest-client",
    "dep:toolkit-http",
    "dep:secrecy",
    "dep:async-stream",
    "dep:futures-util",
]
# OpenTelemetry in the generated clients: real W3C `traceparent` propagation +
# RED client metrics. Forwards `toolkit-contract/otel` (→ `toolkit-http/otel`).
otel = ["rest-client", "toolkit-contract/otel"]
grpc-client = [
    "toolkit-contract/grpc-client",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:tonic-prost-build",
    "dep:async-stream",
    "dep:futures-util",
    "dep:secrecy",
]
# Server-side route registration: enables the generated
# `register_<trait>_routes()` function and OperationBuilder integration.
rest-server = [
    "toolkit-contract/rest-server",
    "dep:axum",
    "dep:http",
]

[lints]
workspace = true

[dependencies]
toolkit.workspace = true
toolkit-contract.workspace = true
toolkit-canonical-errors.workspace = true
toolkit-canonical-errors-macro.workspace = true
toolkit-security.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
utoipa = { workspace = true, features = ["uuid"] }
uuid.workspace = true
futures-core.workspace = true

# Direct deps required when the macro emits the REST client. They appear
# directly in generated code paths (`::toolkit_http::*`, `::secrecy::*`, ...).
toolkit-http = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# Direct deps required when the macro emits the gRPC client.
tonic = { workspace = true, features = ["transport"], optional = true }
tonic-prost = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

# Direct deps required when the macro emits server route registration.
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
toolkit-contract-protogen.workspace = true
anyhow.workspace = true

# The proto-regen example imports the `grpc-client`-gated `grpc` module
# (`payment_api_grpc_binding`), so it only compiles with that feature. Without
# `required-features`, `cargo test --workspace` (default features) tries to
# build it and fails on the missing module.
[[example]]
name = "gen_grpc_proto"
required-features = ["grpc-client"]
