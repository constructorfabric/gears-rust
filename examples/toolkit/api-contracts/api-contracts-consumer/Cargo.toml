[package]
name = "cf-api-contracts-consumer"
version = "0.1.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "api-contracts example — consumer gear that resolves PaymentApi from another gear via ClientHub"
rust-version.workspace = true
publish = false

[lib]
name = "cf_api_contracts_consumer"

[features]
default = []
# OpenTelemetry runtime and resolved REST client.
otel = ["toolkit/otel", "api-contracts-sdk/otel"]
# OoP binary (api-contracts-consumer-oop): bootstrap + embedded authn stack.
oop_module = [
    "dep:clap",
    "dep:mimalloc",
    "toolkit/bootstrap",
    "dep:authn-resolver",
    "dep:static-authn-plugin",
    "dep:types-registry",
]
# Kubernetes TokenReview platform-plane auth.
k8s-auth = ["toolkit/k8s-auth"]

[lints]
workspace = true

[[bin]]
name = "api-contracts-consumer-oop"
path = "src/main.rs"
required-features = ["oop_module"]

[dependencies]
# rest-client for the resolving client `#[toolkit::consumes]` names.
api-contracts-sdk = { workspace = true, features = ["rest-client"] }
# The cluster profile marker in `src/cluster.rs`. Not `deps = [cluster]`: see the
# module comment for why a hard topo-sort edge would refuse to start.
cluster-sdk.workspace = true
toolkit.workspace = true
toolkit-canonical-errors.workspace = true
toolkit-security.workspace = true
async-trait.workspace = true
anyhow.workspace = true
axum.workspace = true
tracing.workspace = true
# The `status` operation's body and the tenant its cache probe is keyed by.
serde_json.workspace = true
uuid.workspace = true
# The status probe's deadline.
tokio.workspace = true

# OoP-only, gated behind `oop_module`.
clap = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
authn-resolver = { package = "cf-gears-authn-resolver", path = "../../../../gears/system/authn-resolver/authn-resolver", optional = true }
static-authn-plugin = { package = "cf-gears-static-authn-plugin", path = "../../../../gears/system/authn-resolver/plugins/static-authn-plugin", optional = true }
types-registry = { package = "cf-gears-types-registry", path = "../../../../gears/system/types-registry/types-registry", optional = true }

[dev-dependencies]
# The status probe's round trip: a standalone cache bound through the SDK's
# stub client, so no cluster gear is linked into the tests.
cluster-sdk = { workspace = true, features = ["test-util"] }
standalone-cluster-plugin.workspace = true
# The real provider gear, booted alongside this consumer in the composition test.
cf-api-contracts = { path = "../api-contracts" }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
parking_lot.workspace = true
# Used by the OoP test's REST-only provider (PolicyStack behind PaymentLocalClient).
toolkit-contract.workspace = true
toolkit-canonical-errors.workspace = true
