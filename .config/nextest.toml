# ClickHouse usage-collector plugin: per-test kill. Sized from measured runs
# (max 1.5s per test) and kept above the harness's own 240s bring-up budget, so
# its error, not a bare TIMEOUT, reports a wedged setup. See the plugin's
# tests/common/mod.rs (BRING_UP_BUDGET).
[[profile.default.overrides]]
filter = 'package(cf-gears-clickhouse-usage-collector-plugin)'
slow-timeout = { period = "60s", terminate-after = 5 }

# Quota Enforcement storage plugin: per-test kill. Its PostgreSQL suites hold
# transactions open on purpose and connect with no lock or statement timeout,
# so a locking regression would otherwise wait for the CI job's own limit. The
# longest test takes about 5s; three minutes turns any hang into a TIMEOUT.
[[profile.default.overrides]]
filter = 'package(cf-gears-quota-enforcement-storage-plugin)'
slow-timeout = { period = "60s", terminate-after = 3 }

# Event broker gear-DB contention suites: no retries, ever. These tests catch a
# race between a chained publish's head read and its write; a race that shows
# once is the defect, so a retry that passes would hide exactly what they exist
# to find. Explicit so a profile or command-line retry default cannot apply.
[[profile.default.overrides]]
filter = 'package(cf-gears-event-broker) & (binary(contention_backends_test) | binary(producer_chain_backends_test))'
retries = 0

# Flaky-test quarantine: each entry below retries a known-flaky test twice. This
# hides the flake, it does not fix it; remove the entry once the test is fixed.

# Seen failing on #5395 (Windows), #5349 (Windows) and #5220 (coverage): the
# rebalance cases two_subscribers_baseline_then_third_joins_mid_stream,
# scale_down_via_disconnect, rolling_replacement_via_delete and
# scale_down_via_delete. Quarantine for exactly these four, to be fixed; the
# binary's fifth case, rolling_replacement_via_disconnect, has not been seen
# failing and runs without retries.
[[profile.default.overrides]]
filter = '''package(cf-gears-event-broker) & binary(consumer_group_rebalance_integration_tests) & (
  test(=two_subscribers_baseline_then_third_joins_mid_stream)
  | test(=scale_down_via_disconnect)
  | test(=rolling_replacement_via_delete)
  | test(=scale_down_via_delete)
)'''
retries = 2

# Seen failing on #4899 (coverage). Quarantine, to be fixed.
[[profile.default.overrides]]
filter = 'package(cf-gears-cluster-sdk) & test(=lease::lease_tests::the_clock_follows_virtual_time)'
retries = 2

# Seen failing on #5349 (Windows). Quarantine, to be fixed.
[[profile.default.overrides]]
filter = 'package(cf-gears-toolkit-security) & test(=internal_auth_cache::tests::invalid_token_rejections_are_briefly_negative_cached)'
retries = 2

# CI profile: every run writes target/nextest/ci/junit.xml, which the CI jobs
# upload and .github/workflows/test-report.yml publishes as GitHub Check Runs.
# The default profile's overrides above still apply under this profile.
[profile.ci]
# Report every failing test in one run, not just the first.
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
# Requires nextest >= 0.9.143 (see NEXTEST_MIN_VERSION in gears.mk).
report-skipped = "ignored"
