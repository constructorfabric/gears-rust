# ClickHouse usage-collector plugin: per-test kill. Sized from measured runs
# (max 1.5s per test) and kept above the harness's own 240s bring-up budget, so
# its error, not a bare TIMEOUT, reports a wedged setup. See the plugin's
# tests/common/mod.rs (BRING_UP_BUDGET).
[[profile.default.overrides]]
filter = 'package(cf-gears-clickhouse-usage-collector-plugin)'
slow-timeout = { period = "60s", terminate-after = 5 }

# Quota Enforcement storage plugin: per-test kill. Its PostgreSQL suites hold
# transactions open on purpose and connect with no lock or statement timeout,
# so a locking regression would otherwise wait for the CI job's own limit. The
# longest test takes about 5s; three minutes turns any hang into a TIMEOUT.
[[profile.default.overrides]]
filter = 'package(cf-gears-quota-enforcement-storage-plugin)'
slow-timeout = { period = "60s", terminate-after = 3 }

# CI profile: every run writes target/nextest/ci/junit.xml, which the CI jobs
# upload and .github/workflows/test-report.yml publishes as GitHub Check Runs.
# The default profile's overrides above still apply under this profile.
[profile.ci]
# Report every failing test in one run, not just the first.
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
# Requires nextest >= 0.9.143 (see NEXTEST_MIN_VERSION in the Makefile).
report-skipped = "ignored"
