name: Fmt

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.rs'
      - 'Makefile'
      - '.gears-dna/gears.mk'
      - 'gears-rust.mk'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: cargo fmt (check)
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'gears-small-vm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # This workflow never runs on a push to main, so it only reads the
      # shared build cache.
      - name: Set up the shared build cache
        id: cache
        uses: ./.github/actions/ci-cache
        with:
          downloads: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          downloads-key: cargo-${{ hashFiles('**/Cargo.lock') }}
          downloads-restore-keys: cargo-

      # GitHub-hosted runs (fork pull requests, the kill switch) keep the
      # registry cache; on the self-hosted runners ci-cache covers it.
      - name: Cache Cargo/target
        if: ${{ steps.cache.outputs.mode == 'none' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-fmt-${{ hashFiles('rust-toolchain.toml') }}

      - name: cargo fmt (check)
        run: make fmt
