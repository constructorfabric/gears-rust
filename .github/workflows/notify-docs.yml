name: Notify docs site

on:
  push:
    branches: [main]
    paths: ['docs/web-docs/**']

permissions:
  contents: read

jobs:
  notify:
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'gears-small-vm' }}
    permissions:
      contents: read
    steps:
      - name: Trigger docs sync
        run: |
          gh api repos/constructorfabric/gears-rust-web-docs/dispatches \
            -f event_type=docs-sync \
            -f "client_payload[sha]=$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
