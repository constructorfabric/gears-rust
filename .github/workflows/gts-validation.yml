name: GTS Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - 'docs/**'
      - 'guidelines/**'
  workflow_dispatch:

concurrency:
  group: gts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Local dev enables incremental compilation via [profile.dev]; CI does not want
  # the extra codegen and disk churn.
  CARGO_INCREMENTAL: "0"

jobs:
  gts_validate:
    name: Validate GTS Identifiers
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'gears-large' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # gears-large rather than gears-small-vm: the runner image carries an older
      # gts-validator, so `cargo install` below compiles 0.16.1 on every run until
      # the image catches up. This workflow never runs on a push to main, so it
      # only reads the shared build cache.
      - name: Set up the shared build cache
        id: cache
        uses: ./.github/actions/ci-cache
        with:
          rust: true
          downloads: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          downloads-key: cargo-${{ hashFiles('**/Cargo.lock') }}
          downloads-restore-keys: cargo-

      # GitHub-hosted runs (fork pull requests, the kill switch) keep the
      # registry cache; on the self-hosted runners ci-cache covers it.
      - name: Cache Cargo/target
        if: ${{ steps.cache.outputs.mode == 'none' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # cache-bin caches ${CARGO_HOME}/bin, so the gts-validator binary is
          # restored across runs instead of being recompiled from source every
          # time (doc-only PRs were paying a multi-minute build otherwise).
          cache-bin: true
          cache-targets: false
          shared-key: gts-validator-0.16.1

      - name: Install gts-validator
        # Pinned + --locked for reproducibility. On a cache hit the binary is
        # already present, so cargo install detects it and skips the compile.
        run: cargo install gts-validator --version 0.16.1 --locked

      - name: Validate GTS identifiers
        run: make gts-docs
