name: Release (release-plz)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Which release-plz command to run"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - release-pr

# Restrict default permissions to read-only
permissions:
  contents: read

env:
  # `cargo publish` compiles every crate; CI does not want incremental churn
  # (see [profile.dev] in Cargo.toml, which enables it for local dev).
  CARGO_INCREMENTAL: "0"

jobs:
  # `release-plz release` publishes only versions present in the manifests and absent
  # from crates.io, so running it on every push is safe and makes an interrupted release
  # self-healing: the next push to main finishes it. That is why this needs no
  # pull_request trigger and no label matching to decide whether a release is happening.
  release:
    name: Publish crates
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.repository == 'constructorfabric/gears-rust'
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
        )
      }}
    # No concurrency group, deliberately. Any group can cancel a *pending* run when a
    # newer one joins it, and a skipped publish is silent — no crates, no tags, no
    # failure. release-plz's docs mandate this: "the concurrency block cancels the
    # pending job if a new commit is pushed — we can't risk to skip a release." Two
    # concurrent publishes are harmless, since each publishes only what crates.io lacks.
    permissions:
      contents: write
      # release-plz resolves PR numbers and contributors for changelogs and releases.
      pull-requests: read
    # Exposed so the publish jobs below know what was released. `releases` is a JSON
    # array of {package_name, tag, version}; empty when nothing was published.
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      # No `ref:` needed. On push, checkout defaults to github.sha, which is exactly the
      # commit that was pushed — for a release PR merge, its merge commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Disk report (before cleanup)
        run: |
          set -euxo pipefail
          df -h
          du -sh . || true
          du -xh . | sort -h | tail -n 40 || true

      # Removing ~/.cargo/registry also clears its `index` subdirectory, which is the
      # workaround for release-plz's gix slotmap overflow. Nothing between here and the
      # publish repopulates it: free-disk-space, setup-go, setup-protoc and
      # `rustup toolchain install` download no crates.
      - name: Runner-local cache cleanup
        run: |
          set -euxo pipefail
          rm -rf target || true
          rm -rf ~/.cargo/registry ~/.cargo/git || true
          df -h

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install protoc
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: protoc@3.34.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # No test run here. ci.yml tests every push to main, and merging a release PR is
      # the maintainer's release decision — re-testing could only override it, never
      # inform it. `cargo publish` still compiles every crate, so a crate that does not
      # build cannot be published.

      - name: release-plz release
        id: release-plz
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.3.155
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

      - name: Disk report (post-mortem)
        if: always()
        run: df -h

  release-pr:
    name: Create release PR
    runs-on: ubuntu-latest
    # Ordered after `release` so release-plz never derives the next versions from
    # crates.io while a publish is mid-flight. `!cancelled()` keeps this running when
    # `release` was skipped (manual release-pr dispatch) or failed.
    needs: release
    if: >-
      ${{
        !cancelled()
        && github.repository == 'constructorfabric/gears-rust'
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release-pr')
        )
      }}
    # Let a running instance finish — it is part-way through committing and force-pushing
    # the release branch — and keep only the newest waiting one.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # cargo-semver-checks (via release-plz/action >= 0.5.136) rustdocs toolkit
      # with extra features, including contract-grpc-client and fips. That pulls
      # prost-build (needs protoc) and aws-lc-fips-sys (needs Go). The publish
      # job already installs both; this job did not, and started failing on
      # every push to main after #4831.
      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install protoc
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: protoc@3.34.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: release-plz release-pr
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.3.155
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the Docker image + Helm chart for each released, publishable gear, in this
  # same run. Driven by release-plz's `releases` output, NOT by tag pushes: release-plz
  # creates its tags with the default GITHUB_TOKEN, which cannot trigger tag/`push`
  # workflows, and a release of >3 crates is suppressed by GitHub anyway. Reading the
  # output sidesteps both. (Regular gears are publish=true; examples and flight-control
  # are git_only — either way they appear in `releases`. The toolkit-platform umbrella
  # isn't a crate, so it's published via workflow_dispatch on publish-artifacts.yml.)
  plan-publish:
    name: Plan publish
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build publish matrix from released packages
        id: plan
        # Maps release-plz's `releases` to a {component, version} matrix of the
        # released gears that are publishable; non-gear crates are skipped.
        env:
          RELEASES: ${{ needs.release.outputs.releases }}
        run: python3 tools/scripts/resolve_release.py plan

  publish:
    name: Publish (${{ matrix.entry.component }} ${{ matrix.entry.version }})
    needs: plan-publish
    if: needs.plan-publish.outputs.any == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      # Cap concurrent publishes so a large release doesn't saturate runners.
      max-parallel: 4
      matrix:
        entry: ${{ fromJSON(needs.plan-publish.outputs.matrix) }}
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      component: ${{ matrix.entry.component }}
      version: ${{ matrix.entry.version }}
      latest: true
    secrets: inherit
