name: Clippy (full feature matrix)

# Full cargo-hack --each-feature run across the entire workspace.
# ~182 runs, ~30-40 min. Not suitable for PRs; runs nightly and on every
# push to main so regressions are caught before they accumulate.
#
# To manually trigger: Actions → Clippy (full feature matrix) → Run workflow.
on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: clippy-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: "0"

jobs:
  clippy-deep:
    name: Clippy deep (all features × all crates)
    runs-on: ubuntu-latest
    # sccache S3 keys: read-write on main, read-only elsewhere. See .github/actions/sccache.
    # No environment until the S3_BUCKET variable is set, so the job runs without one.
    environment:
      name: ${{ vars.S3_BUCKET != '' && (github.ref == 'refs/heads/main' && 'ci-cache-write' || 'ci-cache-read') || '' }}
      deployment: false
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install cargo-hack
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-hack

      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-targets: false
          shared-key: nightly-clippy-${{ hashFiles('rust-toolchain.toml') }}

      # Only main writes to the cache. See .github/actions/sccache.
      - name: Set up sccache
        uses: ./.github/actions/sccache
        with:
          s3-endpoint: ${{ vars.S3_ENDPOINT }}
          s3-region: ${{ vars.S3_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - name: cargo clippy (full feature matrix)
        run: make clippy-deep
