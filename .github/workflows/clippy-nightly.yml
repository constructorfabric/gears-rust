name: Clippy (full feature matrix)

# Full cargo-hack --each-feature run across the entire workspace.
# ~182 runs, ~30-40 min. Not suitable for PRs; runs nightly and on every
# push to main so regressions are caught before they accumulate.
#
# To manually trigger: Actions → Clippy (full feature matrix) → Run workflow.
on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: clippy-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  clippy-deep:
    name: Clippy deep (all features × all crates)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install cargo-hack
        uses: ./.github/actions/ci-tools
        with:
          tools: cargo-hack

      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: nightly-clippy-${{ hashFiles('rust-toolchain.toml') }}

      - name: Configure remote sccache
        id: sccache
        uses: ./.github/actions/sccache

      - name: cargo clippy (full feature matrix)
        run: make clippy-deep

      - name: Save sccache statistics
        if: ${{ always() && steps.sccache.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/sccache-stats
