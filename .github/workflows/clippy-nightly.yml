name: Clippy (full feature matrix)

# Full cargo-hack --each-feature run across the entire workspace.
# ~182 runs, ~30-40 min. Not suitable for PRs; runs nightly and on every
# push to main so regressions are caught before they accumulate.
#
# To manually trigger: Actions → Clippy (full feature matrix) → Run workflow.
on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: clippy-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: "0"

jobs:
  clippy-deep:
    name: Clippy deep (all features × all crates)
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'gears-large' }}
    # Only a push to main enters the environment, whose read-write key for the
    # shared build cache GitHub releases to main alone; every other run reads.
    environment:
      name: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'ci-trusted' || '' }}
      deployment: false
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install cargo-hack
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-hack

      - name: Set up the shared build cache
        id: cache
        uses: ./.github/actions/ci-cache
        with:
          rw-key-id: ${{ secrets.CI_CACHE_RW_KEY_ID }}
          rw-secret: ${{ secrets.CI_CACHE_RW_SECRET }}
          trusted: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          rust: true
          downloads: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          downloads-key: cargo-${{ hashFiles('**/Cargo.lock') }}
          downloads-restore-keys: cargo-

      # GitHub-hosted runs (fork pull requests, the kill switch) keep the
      # registry cache; on the self-hosted runners ci-cache covers it.
      - name: Cache Cargo/target
        if: ${{ steps.cache.outputs.mode == 'none' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-targets: false
          shared-key: nightly-clippy-${{ hashFiles('rust-toolchain.toml') }}

      - name: cargo clippy (full feature matrix)
        run: make clippy-deep
