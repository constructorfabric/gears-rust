name: e2e

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'guidelines/**'
  schedule:
    - cron: "0 2 * * *" # nightly full E2E at 02:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Test suite to run"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # Local dev enables incremental via [profile.dev]; CI does not want the churn.
  CARGO_INCREMENTAL: "0"
  # Debug info is dead weight here — nothing in this job reads a backtrace
  # symbol table, and it dominates both link time and cache size. Same value
  # the compiling jobs in ci.yml use.
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  # Cheap, always-on guard: pure text parsing, no Docker daemon, no toolchain.
  # Catches the two ways these pins drift silently - the Rust version getting
  # out of step with rust-toolchain.toml, and a FROM line losing its digest.
  docker-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Docker base-image pins
        run: make docker-pins

  # Which PRs are worth paying the in-image build for. e2e.yml has no `push`
  # trigger, so gating on pushes would be a no-op; the real gap is a PR that
  # edits the docker lane and merges without it ever being built.
  docker-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'testing/docker/**'
              - '**/*.Dockerfile'
              - 'Dockerfile'
              - '.dockerignore'
              - 'tools/scripts/ci.py'
              - '.github/workflows/e2e.yml'
              # Workspace-level pins. The in-image build is a full `cargo
              # build` of the workspace, so a member list, a lockfile bump, a
              # toolchain bump or the PDFIUM pin in .cargo/config.toml can
              # break it without any Dockerfile changing — which is exactly
              # how #4798 happened. Root files only: '**/Cargo.toml' would
              # fire the 60-minute job on nearly every Rust PR.
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'

  # Guard for the docker lane. It is NOT part of the `e2e` job below: that one
  # builds on the runner, this one builds inside an image, and the two failure
  # modes are unrelated. Until this job existed nothing in CI ran `docker build`
  # at all, which is how every Dockerfile in the repo came to reference a
  # package that does not exist (#4798).
  #
  # Not on every PR — a full in-image workspace build is too slow for that.
  # It runs nightly, on manual dispatch, and on the PRs that touch the docker
  # lane or the workspace pins it builds from (see `docker-changes`). It builds
  # with BUILD_PROFILE=dev for the same reason; the image is a functional test
  # subject here, not a performance subject.
  e2e-docker:
    needs: docker-changes
    # A `needs:` job that is skipped or fails would otherwise skip this job too,
    # silently taking the nightly and manual runs with it - the filter is only
    # meant to gate the pull_request case. `!cancelled()` keeps the expression
    # being evaluated in that situation, while still honouring a cancelled run
    # (which a bare `always()` would not).
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        needs.docker-changes.outputs.docker == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      E2E_DOCKER_BUILD_PROFILE: dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # docker-changes' paths-filter matches `**/*.Dockerfile`, so editing any
      # Dockerfile triggers this job - but until now the job only ever built
      # testing/docker/cf-gears.Dockerfile and http-mock.Dockerfile. A change
      # to mini-chat.Dockerfile got a green check here without ever being
      # built (#4798). Build-only: the runtime behavior is covered by
      # cf-gears.Dockerfile above; this just proves the image builds.
      #
      # BuildKit is explicit because this Dockerfile uses `RUN --mount=type=cache`,
      # which the legacy builder rejects outright. It is the default on current
      # runner images, but this job must not silently depend on that.
      - name: Build mini-chat Docker image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -f gears/mini-chat/deploy/docker/mini-chat.Dockerfile --build-arg BUILD_PROFILE=dev .

      # pytest runs on the host here (ci.py passes its env through), so
      # PYTEST_ADDOPTS reaches it; test-report.yml publishes the XML.
      - name: Run E2E tests in Docker
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/docker-smoke.xml -o junit_suite_name=e2e-docker-smoke"
        run: tools/scripts/with_rust_annotations.sh make e2e-docker-smoke

      # pytest records the assertion but not where it failed; take that from
      # the traceback so the report can annotate the test's source line.
      # --github also annotates the failures on this job and writes the job
      # summary, so they show up here without waiting for test-report.yml.
      - name: Add source locations to E2E reports
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s nullglob
          reports=(test-results/e2e/*.xml)
          if [ ${#reports[@]} -gt 0 ]; then
            python3 tools/scripts/junit_enrich.py --github "${reports[@]}" \
              || echo "::warning::could not add source locations to the E2E reports"
          fi

      - name: Upload E2E test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tests-docker
          path: test-results/e2e/*.xml
          if-no-files-found: warn
          retention-days: 14

      # No log-dump step here: ci.py captures compose logs itself, before its own
      # teardown. A step at this point would run after the containers are gone.
      - name: Tear down
        if: always()
        run: docker compose -f testing/docker/docker-compose.yml down -v || true

  e2e:
    runs-on: ubuntu-latest
    # sccache S3 keys: read-write on main, read-only elsewhere. See .github/actions/sccache.
    # No environment until the S3_BUCKET variable is set, so the job runs without one.
    environment:
      name: ${{ vars.S3_BUCKET != '' && (github.ref == 'refs/heads/main' && 'ci-cache-write' || 'ci-cache-read') || '' }}
      deployment: false
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # This job compiles more than any other: `e2e-local` builds the release
      # binary and the lane-specific targets below each build their own feature
      # configuration. Without a cache every run started from zero, which is
      # what put e2e runs at 29-41 minutes. Mirrors the `integration` job in
      # ci.yml — same actions, same pinned SHAs, same cache-targets: false
      # (rust-cache holds the registry; sccache holds the compiled objects).
      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-e2e-${{ hashFiles('rust-toolchain.toml') }}

      # Only main writes to the cache. See .github/actions/sccache.
      - name: Set up sccache
        uses: ./.github/actions/sccache
        with:
          s3-endpoint: ${{ vars.S3_ENDPOINT }}
          s3-region: ${{ vars.S3_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - name: Install Python dependencies
        id: setup
        run: pip install -r testing/e2e/requirements.txt

      # `make e2e-local` (no SUITE) runs only the shared-server suites
      # (launcher: e2e-launcher) against a single server. Self-managed suites
      # (launcher: pytest — mini-chat, usage-collector) and profile lanes
      # (tr-authz, oagw-sqlite) are NOT covered by it, so they run as their own
      # steps below. Each test step writes its own JUnit file via PYTEST_ADDOPTS
      # (both run_e2e.py and ci.py hand their env to pytest), and runs even when
      # an earlier one failed (`!cancelled()`) so one broken suite no longer
      # hides the others; the job still fails if any did. Gated on `setup` so a
      # broken environment does not cascade.
      - name: Run E2E tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          INPUT_MODE: ${{ inputs.mode }}
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/local.xml -o junit_suite_name=e2e-local"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tools/scripts/with_rust_annotations.sh make e2e-local            # nightly — full suite
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT_MODE" = "full" ]; then
            tools/scripts/with_rust_annotations.sh make e2e-local            # manual — full suite
          else
            tools/scripts/with_rust_annotations.sh make e2e-local            # PR / manual-smoke, TODO: switch to e2e-local-smoke later
          fi

      # Self-managed suite (launcher: pytest): owns its own offline server.
      - name: Run mini-chat E2E tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/mini-chat.xml -o junit_suite_name=e2e-mini-chat"
        run: tools/scripts/with_rust_annotations.sh make e2e-local SUITE=mini-chat

      # tr-authz is a PROFILE of the resource-group suite (not a standalone
      # suite), so `make e2e-local` does not run it — keep it as its own step.
      - name: Run RG + AuthZ E2E tests (tr-authz-plugin, AuthZ -> TR -> RG chain)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/tr-authz.xml -o junit_suite_name=e2e-tr-authz"
        run: tools/scripts/with_rust_annotations.sh make e2e-tr-authz

      # sqlite is a PROFILE of the oagw suite: OAGW on SQLite, with an upstream
      # and a route provisioned from types-registry `entities`. The default
      # oagw run keeps OAGW in memory.
      - name: Run OAGW E2E tests (SQLite storage, types-registry provisioning)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/oagw-sqlite.xml -o junit_suite_name=e2e-oagw-sqlite"
        run: tools/scripts/with_rust_annotations.sh make e2e-oagw-sqlite

      # Self-managed suite (launcher: pytest): starts its own server plus a
      # TimescaleDB or ClickHouse container, so it needs a reachable Docker daemon.
      # Two steps, in the order `make e2e-usage-collector` runs them, because
      # that target runs pytest twice and each run needs its own JUnit file.
      - name: Run usage-collector E2E tests (TimescaleDB container)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/usage-collector-timescaledb.xml -o junit_suite_name=e2e-usage-collector-timescaledb"
        run: tools/scripts/with_rust_annotations.sh make e2e-usage-collector BACKEND=timescaledb

      - name: Run usage-collector E2E tests (ClickHouse container)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/usage-collector-clickhouse.xml -o junit_suite_name=e2e-usage-collector-clickhouse"
        run: tools/scripts/with_rust_annotations.sh make e2e-usage-collector BACKEND=clickhouse

      # Focused suite: its e2e.yaml adds QE, its storage plugin, the cluster
      # profile and the GTS catalog to a server of its own, and sets the env
      # var the suite needs, so `make e2e-local` above skips it.
      - name: Run quota-enforcement E2E tests (focused server)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/quota-enforcement.xml -o junit_suite_name=e2e-quota-enforcement"
        run: tools/scripts/with_rust_annotations.sh make e2e-local SUITE=quota-enforcement

      # Self-managed OoP (loopback, no k8s) suite: builds flight-control + three
      # oop_module gear binaries and orchestrates them as processes itself, so it
      # bypasses run_e2e.py and runs via its own target.
      - name: Run OoP (loopback) E2E tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/oop.xml -o junit_suite_name=e2e-oop"
        run: tools/scripts/with_rust_annotations.sh make e2e-oop

      # Self-managed suite (launcher: pytest): its own server binary. The whole
      # suite runs on the in-process memory backend; the `backend_sensitive`
      # tests run again on PostgreSQL (a container, so the second step needs a
      # reachable Docker daemon).
      - name: Run event-broker E2E tests (memory backend)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/event-broker.xml -o junit_suite_name=e2e-event-broker"
        run: tools/scripts/with_rust_annotations.sh make e2e-event-broker

      - name: Run event-broker E2E tests (PostgreSQL backend)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/e2e/event-broker-pg.xml -o junit_suite_name=e2e-event-broker-pg"
        run: tools/scripts/with_rust_annotations.sh make e2e-event-broker-pg

      # pytest records the assertion but not where it failed; take that from
      # the traceback so the report can annotate the test's source line.
      # --github also annotates the failures on this job and writes the job
      # summary, so they show up here without waiting for test-report.yml.
      - name: Add source locations to E2E reports
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s nullglob
          reports=(test-results/e2e/*.xml)
          if [ ${#reports[@]} -gt 0 ]; then
            python3 tools/scripts/junit_enrich.py --github "${reports[@]}" \
              || echo "::warning::could not add source locations to the E2E reports"
          fi

      - name: Upload E2E test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tests-local
          path: test-results/e2e/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ github.workspace }}/testing/e2e/logs/**
            ${{ runner.home }}/.constructorfabric/logs/**

      - name: Create or update issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            let assignee = context.actor;
            try {
              const commit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: sha,
              });
              assignee =
                commit.data.author?.login ||
                commit.data.committer?.login ||
                context.actor;
            } catch (e) {
              core.info(`Could not fetch commit author, falling back to actor: ${e.message}`);
            }

            async function tryAssign(issueNumber) {
              try {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  assignees: [assignee],
                });
              } catch (e) {
                core.warning(`Could not assign to ${assignee}: ${e.message}`);
              }
            }

            const title = "Nightly E2E failed";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "Nightly E2E tests failed.",
              "",
              `- Commit: ${sha}`,
              `- Assigned to (latest commit author): @${assignee}`,
              `- Workflow run: ${runUrl}`,
            ].join("\n");

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}" label:e2e-nightly`,
              per_page: 1,
            });

            if (search.data.items.length > 0) {
              const issue = search.data.items[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `New failure detected.\n\n- Commit: ${sha}\n- Run: ${runUrl}`,
              });
              await tryAssign(issue.number);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["bug", "e2e-nightly", "ci"],
              });
              await tryAssign(created.data.number);
            }
