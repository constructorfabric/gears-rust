name: e2e

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'guidelines/**'
  schedule:
    - cron: "0 2 * * *" # nightly full E2E at 02:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Test suite to run"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # Local dev enables incremental via [profile.dev]; CI does not want the churn.
  CARGO_INCREMENTAL: "0"
  # Debug info is dead weight here — nothing in this job reads a backtrace
  # symbol table, and it dominates both link time and cache size. Same value
  # the compiling jobs in ci.yml use.
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # This job compiles more than any other: `e2e-local` builds the release
      # binary and the lane-specific targets below each build their own feature
      # configuration. Without a cache every run started from zero, which is
      # what put e2e runs at 29-41 minutes. Mirrors the `integration` job in
      # ci.yml — same actions, same pinned SHAs, same cache-targets: false
      # (rust-cache holds the registry; sccache holds the compiled objects).
      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-e2e-${{ hashFiles('rust-toolchain.toml') }}

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc"
          fi

      - name: Install Python dependencies
        run: pip install -r testing/e2e/requirements.txt

      # `make e2e-local` (no SUITE) runs only the shared-server suites
      # (launcher: e2e-launcher) against a single server. Self-managed suites
      # (launcher: pytest — mini-chat, usage-collector) and profile lanes
      # (tr-authz) are NOT covered by it, so they run as their own steps below.
      #
      # file-storage's lifecycle_s3 sub-suite (multipart against a real S3
      # backend) is part of the file-storage e2e-launcher suite that
      # `make e2e-local` below runs, but it SKIPS ITSELF ENTIRELY at pytest
      # collection time unless FS_E2E_S3_ENDPOINT is set (see
      # testing/e2e/suites/file_storage/lifecycle_s3/conftest.py's module
      # docstring, "Prerequisites" / "Running the S3 e2e locally") — local-fs
      # cannot do multipart at all, so without this double the suite's only
      # multipart-over-S3 coverage never actually runs. This starts Option B
      # from that docstring (MinIO via docker) rather than Option A
      # (`cargo install s3s-fs`): this runner already has a reachable Docker
      # daemon with no extra setup (the usage-collector step further below
      # relies on that same daemon via testcontainers), so a prebuilt image
      # is faster and more reliable here than compiling and installing a
      # crates.io binary on every run.
      - name: Start S3 test double (MinIO) for file-storage e2e
        env:
          # Floating `minio/minio`/`minio/mc` tags make this step
          # non-reproducible and liable to break without warning. Pinned to a
          # specific release, by digest, so the image can't change under us.
          MINIO_IMAGE: "minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e"
          MC_IMAGE: "minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727"
        run: |
          docker run -d --name fs-e2e-minio -p 19099:9000 \
            -e MINIO_ROOT_USER=test-access-key -e MINIO_ROOT_PASSWORD=test-secret-key \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:19099/minio/health/live >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh "$MC_IMAGE" -c \
            "mc alias set local http://127.0.0.1:19099 test-access-key test-secret-key && \
             mc mb local/file-storage-e2e"

      - name: Run E2E tests
        env:
          INPUT_MODE: ${{ inputs.mode }}
          # See "Start S3 test double" above — values match conftest.py's
          # own defaults, set explicitly so this doesn't silently drift.
          FS_E2E_S3_ENDPOINT: "http://127.0.0.1:19099"
          FS_E2E_S3_BUCKET: "file-storage-e2e"
          FS_E2E_S3_ACCESS_KEY: "test-access-key"
          FS_E2E_S3_SECRET_KEY: "test-secret-key"
          FS_E2E_S3_REGION: "us-east-1"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            make e2e-local            # nightly — full suite
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT_MODE" = "full" ]; then
            make e2e-local            # manual — full suite
          else
            make e2e-local            # PR / manual-smoke, TODO: switch to e2e-local-smoke later
          fi

      - name: Stop S3 test double (MinIO)
        if: always()
        run: docker rm -f fs-e2e-minio || true

      # Self-managed suite (launcher: pytest): owns its own offline server.
      - name: Run mini-chat E2E tests
        run: make e2e-mini-chat

      # tr-authz is a PROFILE of the resource-group suite (not a standalone
      # suite), so `make e2e-local` does not run it — keep it as its own step.
      - name: Run RG + AuthZ E2E tests (tr-authz-plugin, AuthZ -> TR -> RG chain)
        run: make e2e-tr-authz

      # Self-managed suite (launcher: pytest): starts its own server plus a
      # TimescaleDB container, so it needs a reachable Docker daemon.
      - name: Run usage-collector E2E tests (TimescaleDB container)
        run: make e2e-usage-collector

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ github.workspace }}/testing/e2e/logs/**
            ${{ runner.home }}/.constructorfabric/logs/**

      - name: Create or update issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            let assignee = context.actor;
            try {
              const commit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: sha,
              });
              assignee =
                commit.data.author?.login ||
                commit.data.committer?.login ||
                context.actor;
            } catch (e) {
              core.info(`Could not fetch commit author, falling back to actor: ${e.message}`);
            }

            async function tryAssign(issueNumber) {
              try {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  assignees: [assignee],
                });
              } catch (e) {
                core.warning(`Could not assign to ${assignee}: ${e.message}`);
              }
            }

            const title = "Nightly E2E failed";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "Nightly E2E tests failed.",
              "",
              `- Commit: ${sha}`,
              `- Assigned to (latest commit author): @${assignee}`,
              `- Workflow run: ${runUrl}`,
            ].join("\n");

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}" label:e2e-nightly`,
              per_page: 1,
            });

            if (search.data.items.length > 0) {
              const issue = search.data.items[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `New failure detected.\n\n- Commit: ${sha}\n- Run: ${runUrl}`,
              });
              await tryAssign(issue.number);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["bug", "e2e-nightly", "ci"],
              });
              await tryAssign(created.data.number);
            }
