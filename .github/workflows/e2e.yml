name: e2e

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'guidelines/**'
  schedule:
    - cron: "0 2 * * *" # nightly full E2E at 02:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Test suite to run"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install Python dependencies
        run: pip install -r testing/e2e/requirements.txt

      - name: Run E2E tests
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            make e2e-local            # nightly — full suite
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT_MODE" = "full" ]; then
            make e2e-local            # manual — full suite
          else
            make e2e-local            # PR / manual-smoke, TODO: switch to e2e-local-smoke later
          fi

      - name: Run mini-chat E2E tests
        run: make e2e-mini-chat

      - name: Run RG + AuthZ E2E tests (tr-authz-plugin, AuthZ -> TR -> RG chain)
        run: make e2e-tr-authz

      - name: Run usage-collector E2E tests (TimescaleDB + ClickHouse containers)
        run: make e2e-usage-collector

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ github.workspace }}/testing/e2e/logs/**
            ${{ runner.home }}/.constructorfabric/logs/**

      - name: Create or update issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            let assignee = context.actor;
            try {
              const commit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: sha,
              });
              assignee =
                commit.data.author?.login ||
                commit.data.committer?.login ||
                context.actor;
            } catch (e) {
              core.info(`Could not fetch commit author, falling back to actor: ${e.message}`);
            }

            async function tryAssign(issueNumber) {
              try {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  assignees: [assignee],
                });
              } catch (e) {
                core.warning(`Could not assign to ${assignee}: ${e.message}`);
              }
            }

            const title = "Nightly E2E failed";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "Nightly E2E tests failed.",
              "",
              `- Commit: ${sha}`,
              `- Assigned to (latest commit author): @${assignee}`,
              `- Workflow run: ${runUrl}`,
            ].join("\n");

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}" label:e2e-nightly`,
              per_page: 1,
            });

            if (search.data.items.length > 0) {
              const issue = search.data.items[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `New failure detected.\n\n- Commit: ${sha}\n- Run: ${runUrl}`,
              });
              await tryAssign(issue.number);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["bug", "e2e-nightly", "ci"],
              });
              await tryAssign(created.data.number);
            }
