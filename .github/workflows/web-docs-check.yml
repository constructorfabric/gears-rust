name: Web Docs Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/web-docs/**'
      - 'tools/scripts/docs-preview.sh'
      - 'Makefile'
      - '.github/workflows/web-docs-check.yml'
  workflow_dispatch:

concurrency:
  group: web-docs-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web_docs_check:
    name: Check Web Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: 'true'
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'

      - name: Install lychee
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: lychee

      - name: Check web docs links
        run: make web-docs-check
