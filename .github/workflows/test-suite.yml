name: Test Suite

# Runs the Rust unit tests (nextest) on one OS.
# Called by ci.yml (Ubuntu) and macos-windows-tests.yml (macOS and Windows).
#
# Jobs show up as `<caller job> / nextest`. test-report.yml relies on these
# names.
on:
  workflow_call:
    inputs:
      os:
        description: Runner label, e.g. ubuntu-latest.
        required: true
        type: string
      cache_namespace:
        type: string
        default: linux-v2
      cache_seed:
        type: boolean
        default: false

# A called workflow does not get the caller's env, so set it here.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  SCCACHE_CACHE_SIZE: "2G"
  CARGO_INCREMENTAL: "0"
  CI_PREINSTALLED_TOOLS: nextest
  # sccache release installed by mozilla-actions/sccache-action. Without a
  # `version` the action queries the GitHub releases API on every job, which
  # exhausted the installation rate limit during a Dependabot burst (2026-10-14).
  # Dependabot does not track this value: bump it by hand, together with every
  # other workflow that sets it (`grep -rn SCCACHE_VERSION .github/workflows`).
  SCCACHE_VERSION: v0.18.0

jobs:
  nextest:
    name: nextest
    runs-on: ${{ inputs.os }}
    env:
      # Windows: use lld-link. It comes with LLVM on the runner and links much
      # faster than link.exe.
      RUSTFLAGS: ${{ startsWith(inputs.os, 'windows') && '-C debuginfo=0 -C linker=lld-link' || '-C debuginfo=0' }}
      # nextest writes JUnit under the `ci` profile, and the Makefile copies it
      # to JUNIT_DIR. Keep it relative: make's sh breaks on Windows backslashes.
      NEXTEST_PROFILE: ci
      JUNIT_DIR: test-results
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Force LF in working tree (w/a for Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install nextest
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: nextest

      # Caches the Cargo registry and git deps, not target/.
      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # If sccache does not start, build with plain rustc instead of failing.
      - name: Configure Linux compilation cache
        id: sccache
        if: runner.os == 'Linux'
        uses: ./.github/actions/sccache
        with:
          writer: 'true'
          namespace: ${{ inputs.cache_namespace }}
          seed: ${{ inputs.cache_seed }}

      - name: Install sccache on other OSes
        if: runner.os != 'Linux'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: ${{ env.SCCACHE_VERSION }}

      - name: Probe sccache & set RUSTC_WRAPPER
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc"
          fi

      - name: cargo test (no macros)
        shell: bash
        run: tools/scripts/with_rust_annotations.sh make test-no-macros

      # test-report.yml turns this into GitHub checks, because this job cannot
      # write checks on fork PRs. Runs on failure too, so failed tests show up.
      - name: Upload Rust test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-tests-${{ runner.os }}
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Save compilation metrics
        if: always() && runner.os == 'Linux' && steps.sccache.outputs.enabled == 'true'
        continue-on-error: true
        uses: ./.github/actions/sccache-stats
        with:
          save: ${{ job.status == 'success' }}
