name: Test Suite

# Runs the Rust unit tests (nextest) on one OS.
# Called by ci.yml (Linux) and macos-windows-tests.yml (macOS and Windows).
#
# Jobs show up as `<caller job> / nextest`. test-report.yml relies on these
# names.
on:
  workflow_call:
    inputs:
      os:
        description: >-
          Runner label or routing expression. ci.yml passes the self-hosted rule
          (see .github/runners/README.md); macos-windows-tests.yml passes
          macos-latest and windows-latest.
        required: true
        type: string
    # No `secrets:` list: the read-write key of the shared build cache is an
    # environment secret of `ci-trusted`, which callers pass with `secrets: inherit`.

# A called workflow does not get the caller's env, so set it here.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: "0"
  CI_PREINSTALLED_TOOLS: nextest

jobs:
  nextest:
    name: nextest
    runs-on: ${{ inputs.os }}
    # Only a push to main enters the environment, whose read-write key for the
    # shared build cache GitHub releases to main alone; every other run reads.
    environment:
      name: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'ci-trusted' || '' }}
      deployment: false
    env:
      # Windows: use lld-link. It comes with LLVM on the runner and links much
      # faster than link.exe.
      RUSTFLAGS: ${{ startsWith(inputs.os, 'windows') && '-C debuginfo=0 -C linker=lld-link' || '-C debuginfo=0' }}
      # nextest writes JUnit under the `ci` profile, and the Makefile copies it
      # to JUNIT_DIR. Keep it relative: make's sh breaks on Windows backslashes.
      NEXTEST_PROFILE: ci
      JUNIT_DIR: test-results
    steps:
      - name: Free disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Force LF in working tree (w/a for Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install nextest
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest

      # Linux only: the macOS and Windows legs run on GitHub-hosted runners.
      - name: Set up the shared build cache
        if: runner.os == 'Linux'
        id: cache
        uses: ./.github/actions/ci-cache
        with:
          rw-key-id: ${{ secrets.CI_CACHE_RW_KEY_ID }}
          rw-secret: ${{ secrets.CI_CACHE_RW_SECRET }}
          trusted: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          rust: true
          downloads: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          downloads-key: cargo-${{ hashFiles('**/Cargo.lock') }}
          downloads-restore-keys: cargo-

      # GitHub-hosted runs (fork pull requests, the kill switch) keep the
      # registry cache; on the self-hosted runners ci-cache covers it.
      # Caches the Cargo registry and git deps, not target/.
      - name: Cache Cargo/target
        if: ${{ runner.os != 'Linux' || steps.cache.outputs.mode == 'none' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: cargo test (no macros)
        shell: bash
        run: tools/scripts/with_rust_annotations.sh make test-no-macros

      # test-report.yml turns this into GitHub checks, because this job cannot
      # write checks on fork PRs. Runs on failure too, so failed tests show up.
      - name: Upload Rust test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-tests-${{ runner.os }}
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 14
