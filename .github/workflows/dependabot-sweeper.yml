# Dependabot sweeper: merges safe, green Dependabot PRs and heals or escalates red ones.
#
# Why a schedule sweeper: the "Protect main" ruleset requires one approving review but NO
# status checks, and auto-merge is disabled, so nothing stops a red PR from being merged.
# The script (.github/scripts/dependabot_sweeper.py) is therefore the gate and evaluates
# checks strictly: no checks, or any pending/unknown check, means wait; any failure means red.
#
# Why an App token: merges made with GITHUB_TOKEN do not trigger `push` workflows on main
# (CI, release-plz). A GitHub App installation token does, so live mode needs one.
#
# "Eligible" means: every dependency in the head commit's `updated-dependencies:` block is a
# semver patch or minor update, except cargo 0.x minors (breaking in cargo, e.g. base64
# 0.22 -> 0.23). Entries without an update-type (docker / github_actions digest and SHA
# bumps) are eligible; for cargo they are not. Anything unparseable, any major bump, or any
# PR with a commit that is not authored by Dependabot, not GitHub-signed, or a merge commit
# is never merged. Ineligible PRs get `deps:needs-migration`.
# Red PRs whose last commit is older than 72h get one `@dependabot recreate`
# (`deps:recreated`), then `deps:needs-migration`. Caps per run: 3 merges, 3 recreates.
#
# Merge gate: a PR merges only when all workflow runs for its head SHA are complete and
# green, DCO and SonarCloud are green, the head is at least 30 minutes old, and the PR is
# not draft, not on hold (`deps:hold`), has no requested changes and no unresolved threads.
#
# Rollout switch: the workflow runs dry-run (read-only GITHUB_TOKEN, table in the job summary)
# until an admin creates the App, sets repo variable DEPS_BOT_APP_ID and sets repo variable
# DEPENDABOT_SWEEPER_MODE=live. A manual run with `live: true` also goes live (only if the
# App id is set).
#
# Admin setup (keeps the App key away from modified workflows): create the environment
# `deps-bot` with deployment branches restricted to `main` only; store DEPS_BOT_PRIVATE_KEY
# as an ENVIRONMENT secret of `deps-bot` (never a repo secret); DEPS_BOT_APP_ID is a repo
# variable. Only the `sweep-live` job uses the environment; the script also refuses
# `--live` outside refs/heads/main.
name: Dependabot Sweeper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Perform merges, approvals, comments and labels (default: dry-run)"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/scripts/dependabot_sweeper.py
      - .github/scripts/test_dependabot_sweeper.py
      - .github/workflows/dependabot-sweeper.yml

permissions:
  contents: read
  # Dry-run reads PRs and their checks with GITHUB_TOKEN; writes use the App token.
  pull-requests: read
  checks: read
  actions: read  # workflow runs for the head SHA
  statuses: read  # statusCheckRollup includes commit statuses

concurrency:
  # PR test runs get their own group: a pending run in a shared group would cancel a pending sweep.
  group: ${{ github.event_name == 'pull_request' && format('dependabot-sweeper-test-{0}', github.ref) || 'dependabot-sweeper' }}
  cancel-in-progress: false

jobs:
  test:
    name: Sweeper unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: cd .github/scripts && python3 -m unittest -v test_dependabot_sweeper

  sweep-dry-run:
    name: Sweep Dependabot PRs (dry-run)
    if: >-
      github.event_name != 'pull_request' &&
      !((inputs.live == true || vars.DEPENDABOT_SWEEPER_MODE == 'live') && vars.DEPS_BOT_APP_ID != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Default branch only: never check out or run PR code.
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sweep
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/dependabot_sweeper.py

  sweep-live:
    name: Sweep Dependabot PRs (live)
    if: >-
      github.event_name != 'pull_request' &&
      (inputs.live == true || vars.DEPENDABOT_SWEEPER_MODE == 'live') && vars.DEPS_BOT_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deps-bot
    steps:
      # Default branch only: never check out or run PR code.
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write  # labels (gh label create, issues labels API) use the Issues API
          permission-actions: read
          permission-checks: read
          permission-statuses: read

      - name: Sweep
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/dependabot_sweeper.py --live
