name: Makefile modules
on:
  pull_request:
    branches: [main, develop]
    paths:
      - Makefile
      - '.gears-dna/gears.mk'
      - 'gears-rust.mk'
      - 'tools/scripts/tests/test_makefiles.py'
      - '.github/workflows/makefiles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  includes:
    name: Makefile modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check GNU Make
        run: make --version
      - name: Check includes and help
        run: python3 -m unittest discover -s tools/scripts/tests -p test_makefiles.py -v
