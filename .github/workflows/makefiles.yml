name: Makefile modules
on:
  pull_request:
    branches: [main, develop]
    paths:
      - Makefile
      - '.gears-dna/gears.mk'
      - 'gears-rust.mk'
      - 'tools/scripts/tests/test_makefiles.py'
      - '.github/workflows/makefiles.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  includes:
    name: Makefile modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check GNU Make
        run: make --version
      - name: Check includes and help
        run: python3 -m unittest discover -s tools/scripts/tests -p test_makefiles.py -v
